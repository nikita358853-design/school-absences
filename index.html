/* ============ УТИЛИТЫ ============ */
function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
  return 'h' + Math.abs(h).toString(36);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function optionsHTML(items, selected, valueKey) {
  return items.map(item => {
    const val = valueKey ? item[valueKey] : item;
    const label = valueKey ? item.name : item;
    return '<option value="' + escapeHtml(val) + '"' + (val === selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
  }).join('');
}
function toast(msg, isError, isWarn) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : (isWarn ? ' warn' : ''));
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, 2500);
}
function todayISO() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function formatDate(iso) { if (!iso) return ''; const p = iso.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function formatDateTime(iso) {
  if (!iso) return '';
  try { const d = new Date(iso); return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); } catch (e) { return iso; }
}
function getStudentsOfClass(cls) { return data.students.filter(s => s.class === cls).sort((a, b) => a.name.localeCompare(b.name, 'ru')); }
function getDayOfWeek(dateISO) {
  if (!dateISO) return null;
  try { const d = new Date(dateISO + 'T00:00:00'); return DAYS_OF_WEEK[(d.getDay() + 6) % 7]; } catch (e) { return null; }
}

  const students = [];
  for (const c of CLASSES) for (const n of names) students.push({ id: uid(), class: c, name: n, pin: simpleHash('1234') });
  return { students, absences: [], teachers: [], parents: [], periods: {}, currentPeriod: {}, schedules: {}, log: [], notifications: [] };
}
function loadLocalData() {

}

/* ============ УВЕДОМЛЕНИЯ ============ */
function requestNotificationPermission() {
  if (!('Notification' in window)) return toast('Не поддерживается', true);
  if (Notification.permission === 'default') {
    Notification.requestPermission().then(p => {
      if (p === 'granted') toast('Уведомления включены');
      else toast('Отклонено', true);
    });
  } else if (Notification.permission === 'granted') toast('Уже включены');
  else toast('Заблокированы', true);
}
function showNativeNotification(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body: body }); } catch (e) {}
}
function pushNotification(toRole, toUser, message, detail) {
  if (!data.notifications) data.notifications = [];
  data.notifications.push({
    id: uid(), toRole, toUser, message, detail: detail || '',
    from: session ? session.name : '—',
    time: new Date().toISOString(), read: false
  });
  if (data.notifications.length > 60) data.notifications = data.notifications.slice(-60);
  saveNotifications();
  if (session && session.role === toRole && session.name === toUser) {
    showNativeNotification('Учёт пропусков', message);
  }
}
function getMyNotifications() {
  if (!session || !data.notifications) return [];
  return data.notifications
    .filter(n => n.toRole === session.role && n.toUser === session.name)
    .sort((a, b) => (b.time || '').localeCompare(a.time || ''));
}

function markAllRead() {
  if (!data.notifications) return;
  let changed = false;
  data.notifications.forEach(n => {
    if (n.toRole === session.role && n.toUser === session.name && !n.read) { n.read = true; changed = true; }
  });

}

/* ============ FIREBASE ============ */
async function initFirebaseSync() {
  if (!window.firebaseDB) { firebaseReady = true; return false; }
  firebaseReady = true;
  return true;
}
function subscribeToFirebase() {
  if (!window.firebaseDB) return;
  const { db, ref, onValue, set } = window.firebaseDB;

  onValue(ref(db, FB_PATH + '/main'), (snap) => {
    const incoming = snap.val();
    if (!incoming) {
      const seeded = buildSeedData();
      set(ref(db, FB_PATH + '/main'), {
        students: seeded.students, absences: seeded.absences,
        teachers: seeded.teachers, parents: seeded.parents,
        periods: seeded.periods, currentPeriod: seeded.currentPeriod, schedules: seeded.schedules
      });
      return;
    }
    data.students = incoming.students || [];
    data.absences = incoming.absences || [];
    data.teachers = incoming.teachers || [];
    data.parents = incoming.parents || [];
    data.periods = incoming.periods || {};
    data.currentPeriod = incoming.currentPeriod || {};
    data.schedules = incoming.schedules || {};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    firebaseConnected = true;
    updateStatusBadge();
    if (session) renderApp();
  }, (err) => { firebaseConnected = false; updateStatusBadge(); });

  onValue(ref(db, FB_PATH + '/log'), (snap) => { data.log = snap.val() || []; });
  onValue(ref(db, FB_PATH + '/notifications'), (snap) => {
    data.notifications = snap.val() || [];
    if (session) renderApp();
  });
}
function updateStatusBadge() {
  const badge = document.getElementById('syncStatus');
  if (!badge) return;
  if (!firebaseReady) badge.innerHTML = '<span class="status-dot offline"></span>Локально';
  else if (firebaseConnected) badge.innerHTML = '<span class="status-dot online"></span>Онлайн';
  else badge.innerHTML = '<span class="status-dot offline"></span>Офлайн';
}

/* ============ АВТОБЭКАПЫ ============ */
async function runAutoBackup(force) {
  if (!window.firebaseDB) return;
  const today = todayISO();
  const lastBackup = localStorage.getItem('last_backup_date');
  if (!force && lastBackup === today) return;
  try {
    const { db, ref, set, get, remove } = window.firebaseDB;
    const snap = await get(ref(db, BACKUP_PATH));
    const existing = snap.val() || {};
    const keys = Object.keys(existing).sort();
    while (keys.length >= BACKUP_KEEP_DAYS) {
      const oldest = keys.shift();
      try { await remove(ref(db, BACKUP_PATH + '/' + oldest)); } catch (e) {}
    }
    await set(ref(db, BACKUP_PATH + '/' + today), {
      time: new Date().toISOString(),
      studentsCount: data.students.length,
      absencesCount: data.absences.length,
      teachersCount: data.teachers.length,
      data: {
        students: data.students, absences: data.absences,
        teachers: data.teachers, parents: data.parents,
        periods: data.periods, currentPeriod: data.currentPeriod, schedules: data.schedules
      }
    });
    localStorage.setItem('last_backup_date', today);
  } catch (e) {}
}
async function listBackups() {
  if (!window.firebaseDB) return [];
  try {
    const { db, ref, get } = window.firebaseDB;
    const snap = await get(ref(db, BACKUP_PATH));
    const val = snap.val() || {};
    return Object.entries(val).map(([date, info]) => ({
      date, time: info.time,
      students: info.studentsCount || 0,
      absences: info.absencesCount || 0,
      teachers: info.teachersCount || 0
    })).sort((a, b) => b.date.localeCompare(a.date));
  } catch (e) { return []; }
}
async function restoreBackup(date) {
  if (!window.firebaseDB) return false;
  try {
    const { db, ref, get } = window.firebaseDB;
    const snap = await get(ref(db, BACKUP_PATH + '/' + date));
    const val = snap.val();
    if (!val || !val.data) return false;
    const d = val.data;
    data.students = d.students || [];
    data.absences = d.absences || [];
    data.teachers = d.teachers || [];
    data.parents = d.parents || [];
    data.periods = d.periods || {};
    data.currentPeriod = d.currentPeriod || {};
    data.schedules = d.schedules || {};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    saveData();
    return true;
  } catch (e) { return false; }
}

/* ============ ПЕРИОДЫ ============ */
function defaultPeriodsForClass(cls) {
  const grade = parseInt(cls, 10);
  const year = new Date().getFullYear();
  const startYear = new Date().getMonth() >= 7 ? year : year - 1;
  const y1 = startYear, y2 = startYear + 1;
  if (grade >= 10) return [
    { name: 'I полугодие',  start: y1 + '-09-01', end: y1 + '-12-28' },
    { name: 'II полугодие', start: y2 + '-01-09', end: y2 + '-05-25' },
    { name: 'Весь год',     start: y1 + '-09-01', end: y2 + '-05-31' }
  ];
  return [
    { name: 'I четверть',   start: y1 + '-09-01', end: y1 + '-10-27' },
    { name: 'II четверть',  start: y1 + '-11-05', end: y1 + '-12-28' },
    { name: 'III четверть', start: y2 + '-01-09', end: y2 + '-03-22' },
    { name: 'IV четверть',  start: y2 + '-04-01', end: y2 + '-05-25' },
    { name: 'Весь год',     start: y1 + '-09-01', end: y2 + '-05-31' }
  ];
}
function ensurePeriods(cls) {
  if (!data.periods) data.periods = {};
  if (!data.periods[cls]) data.periods[cls] = defaultPeriodsForClass(cls);
  if (!data.currentPeriod) data.currentPeriod = {};
  if (data.currentPeriod[cls] === undefined) data.currentPeriod[cls] = data.periods[cls].length - 1;
  saveData();
}
function getCurrentPeriod(cls) { ensurePeriods(cls); return data.periods[cls][data.currentPeriod[cls]]; }
function filterByPeriod(rows, cls) {
  const p = getCurrentPeriod(cls);
  if (!p) return rows;
  return rows.filter(a => a.date >= p.start && a.date <= p.end);
}
function periodSelectorHTML(cls) {
  ensurePeriods(cls);
  const periods = data.periods[cls];
  const cur = data.currentPeriod[cls];
  const options = periods.map((p, i) => '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + escapeHtml(p.name) + '</option>').join('');
  return '<select id="periodSelect" class="period-select">' + options + '</select>' +
    '<span class="period-dates">' + escapeHtml(formatDate(periods[cur].start)) + ' — ' + escapeHtml(formatDate(periods[cur].end)) + '</span>';
}

/* ============ РАСПИСАНИЕ ============ */
function ensureSchedule(cls) {
  if (!data.schedules) data.schedules = {};
  if (!data.schedules[cls]) {
    const empty = {};
    DAYS_OF_WEEK.forEach(d => empty[d] = []);
    data.schedules[cls] = empty;
    saveData();
  }
}
function getLessonsFor(cls, dateISO) {
  const day = getDayOfWeek(dateISO);
  if (!day) return getSubjects(cls);
  const schedule = data.schedules && data.schedules[cls] && data.schedules[cls][day];
  if (schedule && schedule.length) return schedule;
  return getSubjects(cls);
}
function renderScheduleInner(cls) {
  ensureSchedule(cls);
  const schedule = data.schedules[cls];
  const subjects = getSubjects(cls);
  const daysHTML = DAYS_OF_WEEK.map(day => {
    const lessons = schedule[day] || [];
    const lessonsHTML = lessons.map((lesson, idx) =>

function renderScheduleCard(cls) {
  return '<div class="card"><h3>📅 Расписание — ' + escapeHtml(cls) + '</h3>' +
    '<p style="font-size:12px; color:#64748b; margin:0 0 12px;">Уроки по дням недели. Предметы подставляются автоматически при добавлении пропуска.</p>' +
    renderScheduleInner(cls) + '</div>';

function bindScheduleEvents(cls, onUpdate) {
  onUpdate = onUpdate || (() => renderApp());
  document.querySelectorAll('[data-sched-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const day = btn.dataset.schedAdd;
      ensureSchedule(cls);
      if (!data.schedules[cls][day]) data.schedules[cls][day] = [];
      if (data.schedules[cls][day].length >= 10) return toast('Максимум 10 уроков', true);
      data.schedules[cls][day].push(getSubjects(cls)[0]);
      saveData(); onUpdate();
    });
  });
  document.querySelectorAll('[data-sched-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const parts = btn.dataset.schedDel.split('|');
      data.schedules[cls][parts[0]].splice(+parts[1], 1);
      saveData(); onUpdate();
    });
  });
  document.querySelectorAll('[data-sched-day]').forEach(sel => {
    sel.addEventListener('change', e => {
      data.schedules[cls][sel.dataset.schedDay][+sel.dataset.schedIdx] = e.target.value;
      saveData();
    });
  });
  document.getElementById('clearScheduleBtn')?.addEventListener('click', () => {
    if (!confirm('Очистить всё расписание ' + cls + '?')) return;
    const empty = {}; DAYS_OF_WEEK.forEach(d => empty[d] = []);
    data.schedules[cls] = empty;
    saveData(); onUpdate();
  });
}

/* ============ ПРОБЛЕМНЫЕ УЧЕНИКИ ============ */
function getProblemStudents(absences) {
  const counts = {};
  absences.forEach(a => { counts[a.studentName] = (counts[a.studentName] || 0) + 1; });
  return Object.entries(counts).filter(([_, n]) => n >= ABSENCE_WARNING_THRESHOLD)
    .map(([name, n]) => ({ name, count: n })).sort((a, b) => b.count - a.count);
}
function problemNamesSet(absences) {
  const s = new Set();
  getProblemStudents(absences).forEach(p => s.add(p.name));
  return s;
}
function warningBannerHTML(absences) {
  const problems = getProblemStudents(absences);
  if (!problems.length) return '';
  const names = problems.slice(0, 5).map(p => p.name + ' (' + p.count + ')').join(', ');
  const more = problems.length > 5 ? ' и ещё ' + (problems.length - 5) : '';
  return '<div class="warning-banner">' +
    '<div class="warn-icon">⚠️</div>' +
    '<div class="warn-text">' +
      '<b>Много пропусков (≥ ' + ABSENCE_WARNING_THRESHOLD + ') у ' + problems.length + ' учеников:</b><br>' +
      escapeHtml(names + more) +
    '</div></div>';
}

function drawCharts(absences, canvasPrefix) {
  if (typeof Chart === 'undefined') return;
  if (window._charts) window._charts.forEach(c => c.destroy());
  window._charts = [];
  const reasonCounts = {};
  absences.forEach(a => { const n = reasonById(a.reason).name; reasonCounts[n] = (reasonCounts[n] || 0) + 1; });
  const pieCanvas = document.getElementById(canvasPrefix + 'ReasonChart');
  if (pieCanvas) {
    const colors = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
    window._charts.push(new Chart(pieCanvas, {
      type: 'doughnut',
      data: { labels: Object.keys(reasonCounts), datasets: [{ data: Object.values(reasonCounts), backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } }
    }));
  }
  const monthCounts = {};
  absences.forEach(a => { const m = a.date.slice(0, 7); monthCounts[m] = (monthCounts[m] || 0) + 1; });
  const sortedMonths = Object.keys(monthCounts).sort();
  const mn = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const monthLabels = sortedMonths.map(m => { const p = m.split('-'); return mn[+p[1] - 1] + ' ' + p[0].slice(2); });
  const barCanvas = document.getElementById(canvasPrefix + 'MonthChart');
  if (barCanvas) {
    window._charts.push(new Chart(barCanvas, {
      type: 'bar',
      data: { labels: monthLabels, datasets: [{ label: 'Пропусков', data: sortedMonths.map(m => monthCounts[m]), backgroundColor: '#3b82f6', borderRadius: 6 }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    }));
  }
}

  searchQuery: '', sortBy: 'date', sortDir: 'desc', logFilter: ''
};

function sortAbsences(rows) {
  const dir = uiState.sortDir === 'asc' ? 1 : -1;
  return [...rows].sort((a, b) => {
    let va, vb;
    if (uiState.sortBy === 'date') { va = a.date || ''; vb = b.date || ''; }
    else if (uiState.sortBy === 'name') { va = a.studentName || ''; vb = b.studentName || ''; }
    else if (uiState.sortBy === 'reason') { va = reasonById(a.reason).name; vb = reasonById(b.reason).name; }
    else if (uiState.sortBy === 'subject') { va = a.subject || ''; vb = b.subject || ''; }
    else { va = a.date || ''; vb = b.date || ''; }
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
}
function applySearch(rows) {
  const q = (uiState.searchQuery || '').toLowerCase().trim();
  if (!q) return rows;
  return rows.filter(a => (a.studentName || '').toLowerCase().includes(q));
}

/* ============ ТАБЛИЦА ============ */
function renderAbsencesTable(rows, withActions, withParentComment, problemNames) {
  if (!rows.length) return '<div class="empty">Записей нет</div>';
  problemNames = problemNames || new Set();
  const arrowDate = uiState.sortBy === 'date' ? (uiState.sortDir === 'asc' ? '▲' : '▼') : '↕';
  const arrowName = uiState.sortBy === 'name' ? (uiState.sortDir === 'asc' ? '▲' : '▼') : '↕';
  const arrowReason = uiState.sortBy === 'reason' ? (uiState.sortDir === 'asc' ? '▲' : '▼') : '↕';
  const body = rows.map(a => {
    const r = reasonById(a.reason);
    const srcLabel = a.addedByRole === 'student'
      ? '<span class="source-tag student">добавил ученик</span>'
      : '<span class="source-tag teacher">добавил учитель</span>';
    const commentHTML = a.parentComment ? '<span class="parent-comment-tag">💬 Родитель: ' + escapeHtml(a.parentComment) + '</span>' : '';
    const isProblem = problemNames.has(a.studentName);
    const problemBadge = isProblem ? '<span class="problem-badge">⚠ Много</span>' : '';
    let row = '<tr' + (isProblem ? ' class="problem-row"' : '') + '>';
    row += '<td data-label="Дата">' + escapeHtml(formatDate(a.date)) + '</td>';
    row += '<td data-label="ФИО">' + escapeHtml(a.studentName) + problemBadge + '</td>';
    row += '<td data-label="Класс">' + escapeHtml(a.class) + '</td>';
    row += '<td data-label="Предмет">' + escapeHtml(a.subject) + '</td>';
    row += '<td data-label="Причина"><span class="reason-tag ' + r.type + '">' + escapeHtml(r.name) + '</span>' + srcLabel + '</td>';
    row += '<td data-label="Примечание">' + escapeHtml(a.note || '—') + commentHTML + '</td>';
    if (withParentComment && session.role === 'parent') {
      row += '<td><button class="btn btn-secondary btn-sm" data-parent-comment="' + a.id + '">💬 Комментарий</button></td>';
    }
    if (withActions) row += '<td><button class="btn btn-danger btn-sm" data-del-abs="' + a.id + '">Удалить</button></td>';
    row += '</tr>';
    return row;
  }).join('');
  const parentCol = withParentComment && session.role === 'parent' ? '<th></th>' : '';
  return '<table><thead><tr>' +
    '<th class="sortable" data-sort="date">Дата<span class="sort-arrow ' + (uiState.sortBy === 'date' ? 'active' : '') + '">' + arrowDate + '</span></th>' +
    '<th class="sortable" data-sort="name">ФИО<span class="sort-arrow ' + (uiState.sortBy === 'name' ? 'active' : '') + '">' + arrowName + '</span></th>' +
    '<th>Класс</th>' +
    '<th class="sortable" data-sort="subject">Предмет</th>' +
    '<th class="sortable" data-sort="reason">Причина<span class="sort-arrow ' + (uiState.sortBy === 'reason' ? 'active' : '') + '">' + arrowReason + '</span></th>' +
    '<th>Примечание</th>' + parentCol + (withActions ? '<th></th>' : '') +
    '</tr></thead><tbody>' + body + '</tbody></table>';
}
function bindSortHandlers() {
  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (uiState.sortBy === key) uiState.sortDir = uiState.sortDir === 'asc' ? 'desc' : 'asc';
      else { uiState.sortBy = key; uiState.sortDir = 'desc'; }
      renderApp();
    });
  });
}

function bellHTML() {
  const count = unreadCount();
  if (count === 0) return '<div class="bell-wrap"><button class="bell-btn" id="bellBtn">🔔</button></div>';
  return '<div class="bell-wrap"><button class="bell-btn" id="bellBtn">🔔<span class="bell-count">' + count + '</span></button></div>';
}
function bindBell() {
  const btn = document.getElementById('bellBtn');
  if (!btn) return;
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const existing = document.getElementById('notifPanel');
    if (existing) { existing.remove(); return; }
    const notifs = getMyNotifications();
    const panel = document.createElement('div');
    panel.className = 'notif-panel';
    panel.id = 'notifPanel';
    if (!notifs.length) panel.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">Уведомлений нет</div>';
    else panel.innerHTML = notifs.slice(0, 20).map(n =>
      '<div class="notif-item' + (n.read ? '' : ' unread') + '">' +
      '<div class="n-title">' + escapeHtml(n.message) + '</div>' +
      (n.detail ? '<div class="n-text">' + escapeHtml(n.detail) + '</div>' : '') +
      '<div class="n-time">' + escapeHtml(formatDateTime(n.time)) + '</div></div>').join('');
    document.body.appendChild(panel);
    markAllRead();
    setTimeout(() => {
      document.addEventListener('click', function close() {
        const p = document.getElementById('notifPanel');
        if (p) p.remove();
        document.removeEventListener('click', close);
      });
    }, 10);
  });
}

/* ============ СЕССИЯ ============ */
function saveSession() {
  if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  else localStorage.removeItem(SESSION_KEY);
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s.role === 'teacher') {
      const t = data.teachers.find(x => x.name === s.name);
      if (!t) return null;
      s.class = t.class;
    }
    if (s.role === 'student' || s.role === 'parent') {
      const st = data.students.find(x => x.class === s.class && x.name === s.name);
      if (!st) return null;
    }
    return s;
  } catch (e) { return null; }
}
let loginState = { role: 'teacher', teacherName: '', teacherClass: CLASSES[0], studentClass: CLASSES[0], studentName: '' };
const ADMIN_PASSWORD_HASH = simpleHash('admin1441');
function isAdminPassword(pwd) { return simpleHash(pwd) === ADMIN_PASSWORD_HASH; }
function findTeacher(name) {
  if (!data.teachers) data.teachers = [];
  return data.teachers.find(t => t.name.toLowerCase() === name.toLowerCase());
}

  });

    if (loginState.role === 'teacher') {

      if (!name || !pinValue) return toast('Заполните поля', true);

    renderApp();
    runAutoBackup(false);
  });

  const forgot = document.getElementById('forgotPin');
  if (forgot) {
    forgot.addEventListener('click', (e) => {
      e.preventDefault();
      const master = prompt('Мастер-пароль (по умолчанию: school21)');
      if (master !== 'school21') return toast('Неверный', true);
      const targetName = prompt('Чьё ФИО сбросить?');
      if (!targetName) return;
      const t = findTeacher(targetName);
      const s = data.students.find(st => st.name.toLowerCase() === targetName.toLowerCase());
      if (t) { t.pin = simpleHash('1234'); saveData(); toast('PIN сброшен'); }
      else if (s) { s.pin = simpleHash('1234'); saveData(); toast('PIN сброшен'); }
      else toast('Не найден', true);
    });
  }
}

/* ============ ИМПОРТ CSV ============ */
function parseStudentsCSV(text, defaultClass) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if (!lines.length) return [];
  const first = lines[0];
  let sep = ';';
  if (first.split('\t').length > first.split(';').length && first.split('\t').length > first.split(',').length) sep = '\t';
  else if (first.split(',').length > first.split(';').length) sep = ',';
  const firstRow = first.split(sep).map(s => s.trim().toLowerCase());
  const hasHeader = firstRow.some(c => c.includes('фио') || c === 'имя' || c === 'ученик' || c === 'класс' || c === 'name' || c === 'class');
  let nameIdx = 0, classIdx = -1;
  if (hasHeader) {
    firstRow.forEach((c, i) => {
      if (c.includes('фио') || c === 'имя' || c === 'ученик' || c === 'name') nameIdx = i;
      if (c.includes('класс') || c === 'class') classIdx = i;
    });
  }
  const startIdx = hasHeader ? 1 : 0;
  const result = [];
  for (let i = startIdx; i < lines.length; i++) {
    const parts = lines[i].split(sep).map(s => s.trim().replace(/^["']|["']$/g, ''));
    const name = parts[nameIdx] || '';
    if (!name || name.length < 2) {
      result.push({ name: parts.join(' '), cls: null, status: 'err', reason: 'Некорректное ФИО' });
      continue;
    }
    let cls = defaultClass;
    if (classIdx >= 0 && parts[classIdx]) {
      cls = parts[classIdx].trim().toUpperCase().replace(/\s+/g, '');
      if (!CLASSES.includes(cls)) {
        result.push({ name, cls: parts[classIdx], status: 'err', reason: 'Класс "' + parts[classIdx] + '" не существует' });
        continue;
      }
    }
    const exists = data.students.some(s => s.class === cls && s.name.toLowerCase() === name.toLowerCase());
    result.push({ name, cls, status: exists ? 'dup' : 'ok', reason: exists ? 'Уже есть в ' + cls : '' });
  }
  return result;
}
function openImportModal(defaultClass) {
  const existing = document.getElementById('importModalOverlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'importModalOverlay';
  overlay.innerHTML =
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div class="modal-header"><h3>📥 Импорт учеников из CSV</h3>' +
        '<button class="modal-close" id="importCloseBtn">×</button></div>' +
      '<div class="modal-body">' +
        '<div class="drop-zone" id="dropZone">' +
          '<div class="big-icon">📄</div>' +
          '<div><b>Перетащите CSV-файл сюда</b><br>или нажмите, чтобы выбрать</div>' +
          '<input type="file" id="csvFileInput" accept=".csv,.txt" style="display:none;">' +
        '</div>' +
        '<div id="importPreviewBox"></div>' +
        '<div class="csv-hint">' +
          '<b>Формат файла:</b><br>' +
          '• Одна колонка — ФИО: <code>Иванов Иван</code><br>' +
          '• Две колонки — ФИО;Класс: <code>Иванов Иван;7А</code><br>' +
          '• С заголовком: <code>ФИО;Класс</code><br>' +
          '• Разделитель: <code>;</code>, <code>,</code> или табуляция' +
        '</div>' +
        '<div style="margin-top:14px;">' +
          '<label>Класс по умолчанию (если в файле не указан)</label>' +
          '<select id="importDefaultClass">' + optionsHTML(CLASSES, defaultClass) + '</select>' +
        '</div>' +
      '</div>' +
      '<div class="modal-footer">' +
        '<button class="btn btn-secondary" id="importCancelBtn">Отмена</button>' +
        '<button class="btn" id="importConfirmBtn" disabled>Импортировать</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  let parsedRows = [];
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('csvFileInput');
  const previewBox = document.getElementById('importPreviewBox');
  const confirmBtn = document.getElementById('importConfirmBtn');
  const defaultClassSel = document.getElementById('importDefaultClass');

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { const f = e.target.files[0]; if (f) handleFile(f); });
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0]; if (f) handleFile(f);
  });
  defaultClassSel.addEventListener('change', () => {
    if (window._lastCsvText) {
      parsedRows = parseStudentsCSV(window._lastCsvText, defaultClassSel.value);
      renderPreview();
    }
  });
  function handleFile(file) {
    if (file.size > 1024 * 1024) return toast('Файл больше 1 МБ', true);
    const reader = new FileReader();
    reader.onload = (e) => {
      window._lastCsvText = e.target.result;
      parsedRows = parseStudentsCSV(e.target.result, defaultClassSel.value);
      renderPreview();
    };
    reader.readAsText(file, 'UTF-8');
  }
  function renderPreview() {
    if (!parsedRows.length) {
      previewBox.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">Файл пуст</div>';
      confirmBtn.disabled = true;
      return;
    }
    const ok = parsedRows.filter(r => r.status === 'ok').length;
    const dup = parsedRows.filter(r => r.status === 'dup').length;
    const err = parsedRows.filter(r => r.status === 'err').length;
    const rowsHTML = parsedRows.slice(0, 200).map(r => {
      const cls = r.status === 'ok' ? 'ok' : (r.status === 'dup' ? 'dup' : 'err');
      const icon = r.status === 'ok' ? '✓' : (r.status === 'dup' ? '⚠' : '✕');
      const note = r.status === 'ok' ? 'будет добавлен' : (r.status === 'dup' ? 'уже есть' : r.reason);
      return '<div class="import-row ' + cls + '">' +
        '<span>' + icon + ' ' + escapeHtml(r.name) + ' <b style="color:#2563eb;">' + escapeHtml(r.cls || '') + '</b></span>' +
        '<span>' + escapeHtml(note) + '</span></div>';
    }).join('');
    previewBox.innerHTML =
      '<div class="import-summary">' +
        '<span>Всего: <b>' + parsedRows.length + '</b></span>' +
        '<span style="color:#166534;">Новых: <b>' + ok + '</b></span>' +
        '<span style="color:#92400e;">Дубликатов: <b>' + dup + '</b></span>' +
        '<span style="color:#991b1b;">Ошибок: <b>' + err + '</b></span>' +
      '</div>' +
      '<div class="import-preview">' + rowsHTML + '</div>' +
      (parsedRows.length > 200 ? '<p style="font-size:12px; color:#64748b; margin:8px 0 0;">Показано 200 из ' + parsedRows.length + '</p>' : '');
    confirmBtn.disabled = ok === 0;
    confirmBtn.textContent = ok > 0 ? 'Импортировать (' + ok + ')' : 'Импортировать';
  }
  function closeModal() { overlay.remove(); window._lastCsvText = null; }
  document.getElementById('importCloseBtn').addEventListener('click', closeModal);
  document.getElementById('importCancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  confirmBtn.addEventListener('click', () => {
    const toAdd = parsedRows.filter(r => r.status === 'ok');
    if (!toAdd.length) return;
    toAdd.forEach(r => {
      data.students.push({ id: uid(), class: r.cls, name: r.name, pin: simpleHash('1234') });
    });
    logAction('add', 'Импортировано ' + toAdd.length + ' учеников из CSV');
    saveData();
    toast('Добавлено: ' + toAdd.length);
    closeModal();
    renderApp();
  });
}

    '<div class="journal-header"><h3>Статистика класса</h3>' +
      '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">' +
        '<select id="adminClassSelect" class="period-select">' + optionsHTML(CLASSES, selectedClass) + '</select>' +
        periodSelectorHTML(selectedClass) +
        '<button class="btn btn-secondary btn-sm" id="adminExportBtn">CSV</button>' +
        '<button class="btn btn-secondary btn-sm" id="adminPrintBtn">🖨</button>' +
      '</div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="num">' + total + '</div><div class="lbl">Всего</div></div>' +
      '<div class="stat"><div class="num">' + good + '</div><div class="lbl">Уваж.</div></div>' +
      '<div class="stat"><div class="num">' + bad + '</div><div class="lbl">Неуваж.</div></div>' +
      '<div class="stat"><div class="num">' + neutral + '</div><div class="lbl">Прочих</div></div>' +
      '<div class="stat"><div class="num">' + uniq + '</div><div class="lbl">Учеников</div></div>' +
      '<div class="stat"><div class="num">' + inClass + '</div><div class="lbl">В классе</div></div>' +
    '</div>' + topHTML +
    '<h4 style="margin:20px 0 10px; font-size:14px; color:#475569;">Журнал</h4>' +
    '<div class="table-wrap">' + renderAbsencesTable(absences, false, false, problemNames) + '</div>' +
    '<div class="print-signature" id="printSignature"></div></div>';
}
function renderHistoryLog() {
  const log = (data.log || []).slice().sort((a, b) => (b.time || '').localeCompare(a.time || ''));
  const q = (uiState.logFilter || '').toLowerCase();
  const filtered = q ? log.filter(l => (l.user || '').toLowerCase().includes(q) || (l.details || '').toLowerCase().includes(q)) : log;
  const rows = filtered.slice(0, 100).map(l => {
    let cls = 'upd';
    if (l.action === 'add') cls = 'add';
    else if (l.action === 'del') cls = 'del';
    else if (l.action === 'login') cls = 'login';
    else if (l.action === 'backup') cls = 'backup';
    return '<tr class="log-row"><td data-label="Время">' + escapeHtml(formatDateTime(l.time)) + '</td>' +
      '<td data-label="Кто">' + escapeHtml(l.user) + '</td>' +
      '<td data-label="Роль">' + escapeHtml(l.role) + '</td>' +
      '<td data-label="Действие"><span class="log-action ' + cls + '">' + escapeHtml(l.action) + '</span></td>' +
      '<td data-label="Детали">' + escapeHtml(l.details || '') + '</td></tr>';
  }).join('');
  return '<div class="card"><div class="journal-header"><h3>📜 История (только админ)</h3>' +
    '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">' +
      '<input type="text" id="logSearch" placeholder="🔍 Поиск..." value="' + escapeHtml(uiState.logFilter) + '" style="min-width:200px;">' +
      '<button class="btn btn-secondary btn-sm" id="clearLogBtn">Очистить</button>' +
    '</div></div>' +
    '<p style="font-size:12px; color:#64748b; margin:0 0 12px;">Всего: ' + log.length + ' (показано 100)</p>' +
    (filtered.length ? '<div class="table-wrap"><table><thead><tr><th>Время</th><th>Кто</th><th>Роль</th><th>Действие</th><th>Детали</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">Записей нет</div>') +
    '</div>';
}
function renderBackupsCard() {
  return '<div class="card"><h3>💾 Резервные копии</h3>' +
    '<p style="font-size:12px; color:#64748b; margin:0 0 12px;">Автобэкап создаётся раз в день при входе. Хранятся последние ' + BACKUP_KEEP_DAYS + ' дней.</p>' +
    '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">' +
      '<button class="btn btn-secondary btn-sm" id="manualBackupBtn">💾 Создать бэкап</button>' +
      '<button class="btn btn-secondary btn-sm" id="refreshBackupsBtn">🔄 Обновить</button>' +
    '</div>' +
    '<div class="backup-list" id="backupList"><div class="empty">Нажмите «Обновить»</div></div></div>';
}

function renderAdmin() {
  if (!data.teachers) data.teachers = [];
  const teachers = [...data.teachers].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  let tCard = '';
  if (teachers.length === 0) tCard = '<div class="empty">Нет учителей</div>';
  else {
    const rows = teachers.map(t =>
      '<tr><td data-label="ФИО"><b>' + escapeHtml(t.name) + '</b></td>' +
      '<td data-label="Класс"><select data-tclass="' + escapeHtml(t.name) + '" style="padding:6px 10px;">' + optionsHTML(CLASSES, t.class) + '</select></td>' +
      '<td data-label="PIN"><button class="btn btn-secondary btn-sm" data-treset="' + escapeHtml(t.name) + '">Сброс 1234</button></td>' +
      '<td><button class="btn btn-danger btn-sm" data-tdel="' + escapeHtml(t.name) + '">Удалить</button></td></tr>').join('');
    tCard = '<div class="table-wrap"><table><thead><tr><th>ФИО</th><th>Класс</th><th>PIN</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  const app = document.getElementById('app');
  app.innerHTML =
    topbarHTML('Панель администратора', '') +
    '<div class="container">' +
      '<div class="card">' +
        '<div class="journal-header">' +
          '<h3>📥 Импорт учеников из CSV</h3>' +
          '<button class="btn" id="adminImportBtn">Выбрать файл</button>' +
        '</div>' +
        '<p style="font-size:13px; color:#64748b; margin:0;">Загрузите файл со списком учеников.</p>' +
      '</div>' +
      '<div class="card"><h3>Зарегистрировать учителя</h3><form id="addTeacherForm">' +
        '<div class="form-grid">' +
          '<div><label for="newTeacherName">ФИО</label><input type="text" id="newTeacherName" required></div>' +
          '<div><label for="newTeacherClass">Класс</label><select id="newTeacherClass" required>' + optionsHTML(CLASSES, CLASSES[0]) + '</select></div>' +
          '<div><label for="newTeacherPin">PIN (пусто=1234)</label><input type="text" id="newTeacherPin" maxlength="8"></div>' +
        '</div>' +
        '<button type="submit" class="btn" style="margin-top:16px;">Добавить</button>' +
      '</form></div>' +
      '<div class="card"><h3>Учителя (' + teachers.length + ')</h3>' + tCard + '</div>' +
      renderAllClassesSummary() +
      renderAdminClassStats(uiState.adminSelectedClass || CLASSES[0]) +
      '<div class="card">' +
        '<div class="journal-header"><h3>📅 Расписание классов</h3>' +
          '<div style="display:flex; gap:10px; align-items:center;">' +
            '<select id="adminScheduleClass" class="period-select">' +
              optionsHTML(CLASSES, uiState.scheduleEditClass || CLASSES[0]) +
            '</select>' +
          '</div>' +
        '</div>' +
        '<p style="font-size:12px; color:#64748b; margin:0 0 12px;">Выберите класс и настройте уроки по дням недели.</p>' +
        '<div id="adminScheduleBox"></div>' +
      '</div>' +
      renderBackupsCard() +
      renderHistoryLog() +
    '</div>';

  bindLogout();
  document.getElementById('adminImportBtn')?.addEventListener('click', () => openImportModal(CLASSES[0]));
  document.getElementById('addTeacherForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('newTeacherName').value.trim();
    const cls = document.getElementById('newTeacherClass').value;
    const pinRaw = document.getElementById('newTeacherPin').value.trim();
    if (!name) return toast('Введите ФИО', true);
    if (findTeacher(name)) return toast('Уже есть', true);
    const pin = pinRaw || '1234';
    if (!/^\d{4,8}$/.test(pin)) return toast('PIN 4-8 цифр', true);
    data.teachers.push({ name, class: cls, pin: simpleHash(pin), createdAt: new Date().toISOString() });
    logAction('add', 'Учитель ' + name + ' (класс ' + cls + ')');
    saveData(); toast('Учитель добавлен'); renderAdmin();
  });
  document.querySelectorAll('[data-tclass]').forEach(sel => {
    sel.addEventListener('change', e => {
      const t = findTeacher(sel.dataset.tclass);
      if (!t) return;
      const old = t.class;
      t.class = e.target.value;
      logAction('upd', 'Класс ' + t.name + ' с ' + old + ' на ' + t.class);
      saveData(); toast('Класс изменён');
    });
  });
  document.querySelectorAll('[data-treset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.treset;
      const t = findTeacher(name);
      if (!t || !confirm('Сбросить PIN?')) return;
      t.pin = simpleHash('1234'); saveData();
      logAction('upd', 'Сброшен PIN ' + name);
      toast('PIN сброшен');
    });
  });
  document.querySelectorAll('[data-tdel]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.tdel;
      if (!confirm('Удалить учителя "' + name + '"?')) return;
      data.teachers = data.teachers.filter(t => t.name !== name);
      logAction('del', 'Учитель ' + name);
      saveData(); toast('Удалён'); renderAdmin();
    });
  });
  document.getElementById('adminClassSelect')?.addEventListener('change', e => { uiState.adminSelectedClass = e.target.value; renderAdmin(); });
  document.getElementById('periodSelect')?.addEventListener('change', e => {
    const cls = uiState.adminSelectedClass || CLASSES[0];
    data.currentPeriod[cls] = parseInt(e.target.value, 10);
    saveData(); renderAdmin();
  });
  document.getElementById('adminExportBtn')?.addEventListener('click', () => {
    const cls = uiState.adminSelectedClass || CLASSES[0];
    const period = getCurrentPeriod(cls);
    const rows = [['Дата', 'ФИО', 'Класс', 'Предмет', 'Причина', 'Примечание']];
    filterByPeriod(data.absences.filter(a => a.class === cls), cls).forEach(a => {
      rows.push([a.date, a.studentName, a.class, a.subject, reasonById(a.reason).name, a.note || '']);
    });
    const csv = '\uFEFF' + rows.map(r => r.join(';')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'пропуски_' + cls + '_' + period.name + '.csv';
    link.click();
    toast('Скачано');
  });
  document.getElementById('adminPrintBtn')?.addEventListener('click', () => {
    const cls = uiState.adminSelectedClass || CLASSES[0];
    const period = getCurrentPeriod(cls);
    printJournal(cls, period.name);
  });
  document.getElementById('adminScheduleClass')?.addEventListener('change', e => {
    uiState.scheduleEditClass = e.target.value;
    renderAdminScheduleBox();
  });
  document.getElementById('logSearch')?.addEventListener('input', e => {
    uiState.logFilter = e.target.value;
    clearTimeout(window._logTimer);
    window._logTimer = setTimeout(() => {
      const input = document.getElementById('logSearch');
      const pos = input ? input.selectionStart : 0;
      renderAdmin();
      const ni = document.getElementById('logSearch');
      if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); }
    }, 300);
  });
  document.getElementById('clearLogBtn')?.addEventListener('click', () => {
    if (!confirm('Очистить всю историю?')) return;
    data.log = []; saveData(); toast('Очищено'); renderAdmin();
  });
  document.getElementById('manualBackupBtn')?.addEventListener('click', async () => {
    toast('Создаю бэкап...');
    await runAutoBackup(true);
    logAction('backup', 'Ручной бэкап');
    toast('Бэкап создан');
    loadBackupList();
  });
  document.getElementById('refreshBackupsBtn')?.addEventListener('click', loadBackupList);

  renderAdminScheduleBox();
  loadBackupList();
  bindSortHandlers();
  bindBell();
}

function renderAdminScheduleBox() {
  const cls = uiState.scheduleEditClass || CLASSES[0];
  ensureSchedule(cls);
  const box = document.getElementById('adminScheduleBox');
  if (!box) return;
  box.innerHTML = renderScheduleInner(cls);
  bindScheduleEvents(cls, () => renderAdminScheduleBox());
}

async function loadBackupList() {
  const list = document.getElementById('backupList');
  if (!list) return;
  list.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8;">Загрузка...</div>';
  const backups = await listBackups();
  if (!backups.length) {
    list.innerHTML = '<div class="empty">Нет резервных копий</div>';
    return;
  }
  list.innerHTML = backups.map(b =>
    '<div class="backup-item">' +
      '<div><b>' + escapeHtml(b.date) + '</b><br>' +
        '<span style="font-size:11px; color:#64748b;">' + escapeHtml(formatDateTime(b.time)) + ' · уч.: ' + b.students + ' · проп.: ' + b.absences + '</span></div>' +
      '<button class="btn btn-secondary btn-sm" data-restore="' + escapeHtml(b.date) + '">Восстановить</button>' +
    '</div>').join('');
  document.querySelectorAll('[data-restore]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const date = btn.dataset.restore;
      if (!confirm('Восстановить базу из бэкапа ' + date + '?\nВсе текущие данные будут заменены.')) return;
      const ok = await restoreBackup(date);
      if (ok) {
        logAction('upd', 'Восстановление из бэкапа ' + date);
        toast('База восстановлена');
        renderApp();
      } else toast('Ошибка', true);
    });
  });
}

/* ============ PWA ============ */
(function setupPwaManifest() {
  const iconSvg = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
    '<rect width="192" height="192" rx="36" fill="#1e293b"/>' +
    '<text x="96" y="128" font-size="100" text-anchor="middle">🎓</text></svg>'
  );
  const manifest = {
    name: 'Учёт пропусков', short_name: 'Пропуски',
    description: 'Школьная система учёта пропусков и причин',
    start_url: '.', scope: '.', display: 'standalone', orientation: 'portrait',
    background_color: '#eef2f7', theme_color: '#1e293b', lang: 'ru',
    icons: [
      { src: iconSvg, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
      { src: iconSvg, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const url = URL.createObjectURL(blob);
  const link = document.getElementById('manifestLink');
  if (link) link.href = url;
})();

if ('serviceWorker' in navigator) {
  const swCode = "self.addEventListener('install',e=>self.skipWaiting());" +
    "self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));" +
    "self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;" +
    "e.respondWith(caches.open('v1').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{try{c.put(e.request,res.clone())}catch(_){}return res}).catch(()=>c.match('/')))))});";
  try {
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  } catch (e) {}
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installPwaBtn');
  if (btn) btn.classList.add('show');
});
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installPwaBtn');
  if (btn) btn.classList.remove('show');
  deferredPrompt = null;
  toast('Приложение установлено');
});

/* ============ СТАРТ ============ */
(async function startApp() {
  document.getElementById('installPwaBtn')?.addEventListener('click', async () => {
    if (!deferredPrompt) return toast('Установка недоступна', true);
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if (choice.outcome === 'accepted') toast('Устанавливаем...');
    deferredPrompt = null;
    document.getElementById('installPwaBtn').classList.remove('show');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const m = document.getElementById('importModalOverlay');
      if (m) m.remove();
    }
  });

  session = loadSession();
  renderApp();

  setTimeout(async () => {
    await new Promise(resolve => {
      const start = Date.now();
      const check = () => {
        if (window.firebaseDB !== undefined) return resolve();
        if (Date.now() - start > 3000) return resolve();
        setTimeout(check, 50);
      };
      check();
    });
    await initFirebaseSync();
    subscribeToFirebase();
    updateStatusBadge();
    setTimeout(() => runAutoBackup(false), 5000);
  }, 100);
})();
</script>
