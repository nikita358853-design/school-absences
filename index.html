<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Посещаемость 10А — учёт пропусков и причин</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --primary: #2563eb; --primary-d: #1d4ed8;
        --bg: #f4f6fb; --card: #fff; --border: #e2e8f0;
        --text: #1e293b; --muted: #64748b;
        --success: #16a34a; --warning: #f59e0b;
        --danger: #dc2626; --secondary: #6b7280;
        --director: #7c3aed; --deputy: #db2777;
        --radius: 10px;
        --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
    }
    .hidden { display: none !important; }

    /* Buttons */
    .btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 16px; border: 1px solid transparent; border-radius: 8px;
        background: var(--primary); color: #fff; font-size: 14px; font-weight: 500;
        cursor: pointer; text-decoration: none; transition: background .15s;
        font-family: inherit;
    }
    .btn:hover { background: var(--primary-d); }
    .btn-outline { background: transparent; color: var(--primary); border-color: var(--primary); }
    .btn-outline:hover { background: rgba(37,99,235,.08); }
    .btn-danger { background: var(--danger); } .btn-danger:hover { background: #b91c1c; }
    .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-ghost:hover { background: #f1f5f9; color: var(--text); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .input, .select, .textarea {
        width: 100%; padding: 9px 12px; border: 1px solid var(--border);
        border-radius: 8px; background: #fff; font-size: 14px; font-family: inherit;
        color: var(--text); transition: border-color .15s, box-shadow .15s;
    }
    .input:focus, .select:focus, .textarea:focus {
        outline: none; border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .textarea { resize: vertical; min-height: 60px; }

    /* Login */
    #login-screen {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 20px;
    }
    .login-card {
        background: var(--card); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 32px; width: 100%; max-width: 440px;
    }
    .login-card h1 { font-size: 20px; text-align: center; margin-bottom: 24px; }
    .login-card h1 .icon {
        display: inline-block; background: var(--primary); color: #fff;
        width: 40px; height: 40px; border-radius: 10px; line-height: 40px;
        text-align: center; margin-right: 8px; font-size: 20px; vertical-align: middle;
    }
    .demo-box {
        margin-top: 20px; padding: 12px 14px; background: #f8fafc;
        border: 1px dashed var(--border); border-radius: 8px;
        font-size: 12px; color: var(--muted); line-height: 1.8;
    }
    .demo-box b { color: var(--text); }
    .demo-box code {
        background: #fff; padding: 1px 6px; border-radius: 4px;
        border: 1px solid var(--border); color: var(--text);
        font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px;
    }
    .error-msg {
        background: #fef2f2; color: #991b1b; padding: 10px 14px;
        border-radius: 8px; font-size: 13px; margin-bottom: 16px;
        border: 1px solid #fecaca;
    }

    /* App header */
    .app-header {
        background: #fff; border-bottom: 1px solid var(--border);
        padding: 0 24px; display: flex; align-items: center; gap: 24px;
        height: 60px; position: sticky; top: 0; z-index: 10;
    }
    .app-header .logo {
        font-weight: 700; font-size: 16px; color: var(--primary); white-space: nowrap;
    }
    .app-nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
    .app-nav button {
        padding: 8px 14px; background: transparent; border: none;
        border-radius: 8px; font-size: 14px; font-family: inherit;
        color: var(--muted); cursor: pointer; transition: all .15s;
        white-space: nowrap;
    }
    .app-nav button:hover { background: #f1f5f9; color: var(--text); }
    .app-nav button.active { background: rgba(37,99,235,.1); color: var(--primary); font-weight: 600; }
    .user-info { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .user-info .name { color: var(--text); font-weight: 500; }
    .user-info .role {
        padding: 2px 8px; border-radius: 4px; font-size: 11px;
        text-transform: uppercase; letter-spacing: .03em; font-weight: 600;
    }
    .role-director { background: #f3e8ff; color: var(--director); }
    .role-deputy   { background: #fce7f3; color: var(--deputy); }
    .role-teacher  { background: #dbeafe; color: var(--primary); }
    .role-student  { background: #dcfce7; color: var(--success); }

    /* Container */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .page-title { font-size: 22px; margin-bottom: 4px; }
    .page-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    /* Cards */
    .card {
        background: var(--card); border-radius: var(--radius);
        box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden;
    }
    .card-header {
        padding: 14px 20px; border-bottom: 1px solid var(--border);
        font-weight: 600; font-size: 15px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        flex-wrap: wrap;
    }
    .card-body { padding: 20px; }
    .card-body.p-0 { padding: 0; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
        text-align: left; padding: 12px 16px; font-size: 11px;
        font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
        color: var(--muted); background: #f8fafc;
        border-bottom: 1px solid var(--border);
    }
    tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    .td-center { text-align: center; }
    .td-end { text-align: right; }

    /* Badges */
    .badge {
        display: inline-block; padding: 2px 10px; border-radius: 999px;
        font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: .03em; white-space: nowrap;
    }
    .badge-success   { background: #dcfce7; color: #166534; }
    .badge-warning   { background: #fef3c7; color: #92400e; }
    .badge-secondary { background: #e2e8f0; color: #475569; }
    .badge-danger    { background: #fee2e2; color: #991b1b; }

    /* KPI */
    .kpi-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px; margin-bottom: 24px;
    }
    .kpi {
        background: #fff; border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 18px 20px;
        border-left: 4px solid var(--primary);
    }
    .kpi.success { border-left-color: var(--success); }
    .kpi.warning { border-left-color: var(--warning); }
    .kpi.danger  { border-left-color: var(--danger); }
    .kpi.director { border-left-color: var(--director); }
    .kpi.deputy  { border-left-color: var(--deputy); }
    .kpi .kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
    .kpi .kpi-value { font-size: 26px; font-weight: 700; }

    /* Charts */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }

    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
    .bar-label { width: 200px; flex-shrink: 0; font-size: 12px; line-height: 1.3; }
    .bar-track { flex: 1; height: 20px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width .4s; }
    .bar-value { width: 30px; text-align: right; font-weight: 600; font-size: 12px; }

    .donut-wrap { display: flex; align-items: center; gap: 20px; }
    .donut { width: 130px; height: 130px; border-radius: 50%; flex-shrink: 0; position: relative; }
    .donut::after { content: ''; position: absolute; inset: 26px; background: #fff; border-radius: 50%; }
    .legend { font-size: 13px; line-height: 1.9; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    /* Progress */
    .progress {
        height: 20px; background: #f1f5f9; border-radius: 999px;
        overflow: hidden; position: relative; min-width: 110px;
    }
    .progress-fill {
        height: 100%; border-radius: 999px; display: flex; align-items: center;
        justify-content: center; font-size: 11px; font-weight: 600; color: #fff;
        transition: width .4s; white-space: nowrap; padding: 0 6px;
    }
    .progress-fill.success { background: var(--success); }
    .progress-fill.warning { background: var(--warning); }
    .progress-fill.danger  { background: var(--danger); }

    /* Students grid */
    .students-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
    }
    .student-chip {
        padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
        font-size: 14px; background: #fafbfc; display: flex; align-items: center; gap: 8px;
    }
    .student-chip::before {
        content: ''; width: 8px; height: 8px; background: var(--primary);
        border-radius: 50%; flex-shrink: 0;
    }

    /* Alerts */
    .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .alert-success { background: #dcfce7; color: #166534; }
    .alert-error   { background: #fef2f2; color: #991b1b; }
    .alert-info    { background: #eff6ff; color: #1e40af; }
    .alert-warning { background: #fef3c7; color: #92400e; }

    /* Empty */
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }

    /* Section */
    .section-title {
        font-size: 16px; font-weight: 600; margin: 24px 0 12px;
        padding-bottom: 8px; border-bottom: 2px solid var(--border);
        display: flex; align-items: center; gap: 8px;
    }

    /* Inline form */
    .inline-form {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px; align-items: end;
    }
    .inline-form .form-group { margin-bottom: 0; }

    /* Log */
    .log-entry {
        padding: 10px 16px; border-bottom: 1px solid var(--border);
        font-size: 13px; display: flex; gap: 12px; align-items: flex-start;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-time { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 130px; }
    .log-user { font-weight: 600; }
    .log-role {
        font-size: 10px; padding: 1px 6px; border-radius: 4px;
        text-transform: uppercase; font-weight: 600;
    }

    /* Actions */
    .action-btns { display: flex; gap: 4px; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
    <div class="login-card">
        <h1><span class="icon">✓</span> Посещаемость</h1>
        <div id="login-error" class="error-msg hidden"></div>
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="login-user">Логин</label>
                <input class="input" type="text" id="login-user" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="login-pass">Пароль</label>
                <input class="input" type="password" id="login-pass" required autocomplete="current-password">
            </div>
            <button class="btn" style="width:100%; justify-content:center;" type="submit">Войти</button>
        </form>
        <div class="demo-box">
            <b>Демо-аккаунты:</b><br>
            директор: <code>director / director123</code><br>
            завуч: <code>deputy / deputy123</code><br>
            учитель: <code>teacher / teacher123</code><br>
            учитель 2: <code>teacher2 / teacher123</code><br>
            ученик: <code>student / student123</code>
        </div>
    </div>
</div>

<!-- ============ APP ============ -->
<div id="app-screen" class="hidden">
    <header class="app-header">
        <div class="logo">✓ Посещаемость</div>
        <nav class="app-nav" id="app-nav"></nav>
        <div class="user-info">
            <span class="name" id="user-name"></span>
            <span class="role" id="user-role"></span>
            <button class="btn btn-ghost btn-sm" id="logout-btn">Выйти</button>
        </div>
    </header>
    <main class="container">
        <div id="page-home"></div>
        <div id="page-add" class="hidden"></div>
        <div id="page-reports" class="hidden"></div>
        <div id="page-manage" class="hidden"></div>
        <div id="page-reasons" class="hidden"></div>
        <div id="page-log" class="hidden"></div>
    </main>
</div>

<script>
/* ================================================================
   1. ДЕМО-ДАННЫЕ
   ================================================================ */
function dateOffset(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
}

function generateDemoAbsences() {
    return [
        { id: 1,  studentId: 1, date: dateOffset(-2),  reasonId: 1, comment: 'Справка от педиатра' },
        { id: 2,  studentId: 2, date: dateOffset(-3),  reasonId: 5, comment: '' },
        { id: 3,  studentId: 3, date: dateOffset(-3),  reasonId: 2, comment: '' },
        { id: 4,  studentId: 2, date: dateOffset(-7),  reasonId: 6, comment: 'Опоздал на 15 минут' },
        { id: 5,  studentId: 4, date: dateOffset(-8),  reasonId: 3, comment: 'Олимпиада по физике' },
        { id: 6,  studentId: 1, date: dateOffset(-10), reasonId: 1, comment: '' },
        { id: 7,  studentId: 5, date: dateOffset(-11), reasonId: 2, comment: '' },
        { id: 8,  studentId: 7, date: dateOffset(-12), reasonId: 5, comment: '' },
        { id: 9,  studentId: 2, date: dateOffset(-15), reasonId: 5, comment: 'Без предупреждения' },
        { id: 10, studentId: 6, date: dateOffset(-16), reasonId: 8, comment: 'Поездка с родителями' },
        { id: 11, studentId: 3, date: dateOffset(-18), reasonId: 4, comment: 'Плановый медосмотр' },
        { id: 12, studentId: 8, date: dateOffset(-20), reasonId: 1, comment: '' },
        { id: 13, studentId: 2, date: dateOffset(-22), reasonId: 7, comment: '' },
        { id: 14, studentId: 5, date: dateOffset(-25), reasonId: 3, comment: 'Конкурс чтецов' },
        { id: 15, studentId: 1, date: dateOffset(-27), reasonId: 2, comment: '' },
        // 10Б
        { id: 16, studentId: 9,  date: dateOffset(-4),  reasonId: 1, comment: '' },
        { id: 17, studentId: 10, date: dateOffset(-9),  reasonId: 5, comment: '' },
        { id: 18, studentId: 11, date: dateOffset(-14), reasonId: 3, comment: 'Соревнования' },
        // 11А
        { id: 19, studentId: 12, date: dateOffset(-5),  reasonId: 2, comment: '' },
        { id: 20, studentId: 13, date: dateOffset(-13), reasonId: 6, comment: 'Опоздание' }
    ];
}

const SEED = {
    classes: [
        { id: 1, name: '10А', teacherId: 3 },
        { id: 2, name: '10Б', teacherId: 4 },
        { id: 3, name: '11А', teacherId: null }
    ],
    students: [
        { id: 1,  fullName: 'Иванов Иван Иванович',        classId: 1 },
        { id: 2,  fullName: 'Петров Пётр Петрович',        classId: 1 },
        { id: 3,  fullName: 'Сидорова Анна Сергеевна',     classId: 1 },
        { id: 4,  fullName: 'Кузнецов Дмитрий Олегович',   classId: 1 },
        { id: 5,  fullName: 'Смирнова Екатерина Павловна', classId: 1 },
        { id: 6,  fullName: 'Морозов Артём Владимирович',  classId: 1 },
        { id: 7,  fullName: 'Волкова Мария Андреевна',     classId: 1 },
        { id: 8,  fullName: 'Соколов Никита Максимович',   classId: 1 },
        { id: 9,  fullName: 'Алексеев Андрей Игоревич',    classId: 2 },
        { id: 10, fullName: 'Белова Ольга Дмитриевна',     classId: 2 },
        { id: 11, fullName: 'Григорьев Павел Сергеевич',   classId: 2 },
        { id: 12, fullName: 'Дмитриева Софья Андреевна',   classId: 3 },
        { id: 13, fullName: 'Егоров Максим Викторович',    classId: 3 }
    ],
    reasons: [
        { id: 1, name: 'Болезнь (есть справка)',   category: 'уважительная' },
        { id: 2, name: 'Семейные обстоятельства',  category: 'уважительная' },
        { id: 3, name: 'Соревнования / олимпиады', category: 'уважительная' },
        { id: 4, name: 'Медосмотр',                category: 'уважительная' },
        { id: 5, name: 'Без предупреждения',       category: 'неуважительная' },
        { id: 6, name: 'Опоздание',                category: 'неуважительная' },
        { id: 7, name: 'Самовольный уход',         category: 'неуважительная' },
        { id: 8, name: 'По заявлению родителей',   category: 'особая' }
    ],
    users: [
        { id: 1, username: 'director', password: 'director123', role: 'director', name: 'Смирнов Алексей Викторович' },
        { id: 2, username: 'deputy',   password: 'deputy123',   role: 'deputy',   name: 'Козлова Елена Петровна' },
        { id: 3, username: 'teacher',  password: 'teacher123',  role: 'teacher',  name: 'Иванова Мария Петровна' },
        { id: 4, username: 'teacher2', password: 'teacher123',  role: 'teacher',  name: 'Орлов Сергей Николаевич' },
        { id: 5, username: 'student',  password: 'student123',  role: 'student',  name: 'Иванов Иван Иванович', studentId: 1 }
    ],
    absences: [],
    log: []
};

/* ================================================================
   2. ХРАНИЛИЩЕ
   ================================================================ */
const STORAGE_KEY = 'school_attendance_v2';
const SESSION_KEY = 'school_attendance_session_v2';

let state = null;
let session = null;

function initStorage() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
        try { state = JSON.parse(raw); } catch { state = null; }
    }
    if (!state || !state.users) {
        state = JSON.parse(JSON.stringify(SEED));
        state.absences = generateDemoAbsences();
        save();
    }
}

function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadSession() {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (raw) { try { session = JSON.parse(raw); } catch { session = null; } }
}

function saveSession() {
    if (session) sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    else sessionStorage.removeItem(SESSION_KEY);
}

/* ================================================================
   3. УТИЛИТЫ
   ================================================================ */
function esc(str) {
    return String(str).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
}

function getStudent(id) { return state.students.find(s => s.id === id); }
function getClass(id) { return state.classes.find(c => c.id === id); }
function getReason(id) { return state.reasons.find(r => r.id === id); }
function getTeacher(id) { return state.users.find(u => u.id === id && u.role === 'teacher'); }
function getStudentsOfClass(classId) { return state.students.filter(s => s.classId === classId); }
function getTeacherOfClass(classId) {
    const c = getClass(classId);
    if (!c || !c.teacherId) return null;
    return getTeacher(c.teacherId);
}
function getClassOfStudent(studentId) {
    const s = getStudent(studentId);
    if (!s) return null;
    return getClass(s.classId);
}
function nextId(arr) {
    return arr.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
}
function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return d + '.' + m + '.' + y;
}
function formatDateTime(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
function workdaysBetween(fromIso, toIso) {
    const from = new Date(fromIso), to = new Date(toIso);
    let count = 0;
    const d = new Date(from);
    while (d <= to) {
        const day = d.getDay();
        if (day !== 0 && day !== 6) count++;
        d.setDate(d.getDate() + 1);
    }
    return count;
}
function categoryBadge(cat) {
    if (cat === 'уважительная') return '<span class="badge badge-success">уважительная</span>';
    if (cat === 'неуважительная') return '<span class="badge badge-warning">неуважительная</span>';
    return '<span class="badge badge-secondary">' + esc(cat) + '</span>';
}
function roleLabel(role) {
    return { director: 'директор', deputy: 'завуч', teacher: 'учитель', student: 'ученик' }[role] || role;
}
function roleBadgeClass(role) {
    return 'role-' + role;
}
function calcAttendance(studentId, startIso, endIso) {
    const workdays = workdaysBetween(startIso, endIso);
    const absences = state.absences.filter(a =>
        a.studentId === studentId && a.date >= startIso && a.date <= endIso
    ).length;
    return workdays > 0 ? Math.max(0, ((workdays - absences) / workdays) * 100) : 100;
}
function classAvgAttendance(classId, startIso, endIso) {
    const students = getStudentsOfClass(classId);
    if (students.length === 0) return 100;
    const total = students.reduce((sum, s) => sum + calcAttendance(s.id, startIso, endIso), 0);
    return Math.round((total / students.length) * 10) / 10;
}

/* ================================================================
   4. ЖУРНАЛ ДЕЙСТВИЙ
   ================================================================ */
function logAction(action) {
    if (!session) return;
    state.log.push({
        id: nextId(state.log),
        ts: Date.now(),
        user: session.name,
        role: session.role,
        action: action
    });
    save();
}

/* ================================================================
   5. АВТОРИЗАЦИЯ
   ================================================================ */
function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pass').value;
    const err = document.getElementById('login-error');

    const user = state.users.find(u => u.username === username);

    if (!user || user.password !== password) {
        err.textContent = 'Неверный логин или пароль';
        err.classList.remove('hidden');
        return;
    }

    session = {
        userId: user.id,
        role: user.role,
        name: user.name,
        username: user.username,
        studentId: user.studentId || null
    };
    saveSession();
    logAction('Вход в систему');
    renderApp();
}

function handleLogout() {
    logAction('Выход из системы');
    session = null;
    saveSession();
    renderLogin();
}

function renderLogin() {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
    document.getElementById('login-error').classList.add('hidden');
    document.getElementById('login-form').reset();
}

/* ================================================================
   6. ОБОЛОЧКА ПРИЛОЖЕНИЯ
   ================================================================ */
let currentPage = 'home';

function renderApp() {
    if (!session) { renderLogin(); return; }

    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');

    document.getElementById('user-name').textContent = session.name;
    const roleEl = document.getElementById('user-role');
    roleEl.textContent = roleLabel(session.role);
    roleEl.className = 'role ' + roleBadgeClass(session.role);

    renderNav();
    renderPage(currentPage);
}

function getTabs() {
    const r = session.role;
    if (r === 'student') return [['home', 'Мои пропуски']];
    if (r === 'teacher') return [
        ['home', 'Мой класс'],
        ['add', 'Добавить пропуск'],
        ['reports', 'Отчёты']
    ];
    if (r === 'deputy') return [
        ['home', 'Обзор школы'],
        ['add', 'Добавить пропуск'],
        ['reports', 'Отчёты'],
        ['reasons', 'Причины']
    ];
    if (r === 'director') return [
        ['home', 'Обзор школы'],
        ['add', 'Добавить пропуск'],
        ['reports', 'Отчёты'],
        ['manage', 'Управление'],
        ['reasons', 'Причины'],
        ['log', 'Журнал']
    ];
    return [];
}

function renderNav() {
    const nav = document.getElementById('app-nav');
    const tabs = getTabs();
    if (!tabs.some(t => t[0] === currentPage)) currentPage = 'home';

    nav.innerHTML = tabs.map(([key, label]) => `
        <button data-page="${key}" class="${currentPage === key ? 'active' : ''}">
            ${esc(label)}
        </button>
    `).join('');

    nav.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
            currentPage = btn.dataset.page;
            renderApp();
        });
    });
}

const PAGES = ['home', 'add', 'reports', 'manage', 'reasons', 'log'];

function renderPage(page) {
    PAGES.forEach(p => document.getElementById('page-' + p).classList.add('hidden'));
    document.getElementById('page-' + page).classList.remove('hidden');

    if (page === 'home') renderHomePage();
    else if (page === 'add') renderAddPage();
    else if (page === 'reports') renderReportsPage();
    else if (page === 'manage') renderManagePage();
    else if (page === 'reasons') renderReasonsPage();
    else if (page === 'log') renderLogPage();
}

    } else {

    el.innerHTML = `

                                ? `<option value="">— выберите ученика —</option>
                                   ${getStudentsOfClass(allowedClasses[0]?.id).map(s =>
                                       `<option value="${s.id}">${esc(s.fullName)}</option>`
                                   ).join('')}`
                                : '<option value="">— сначала выберите класс —</option>'}

                        <input class="input" type="date" name="date" value="${today}" required>

                        <label class="form-label">Причина *</label>
                        <select class="select" name="reasonId" required>
                            <option value="">— выберите причину —</option>
                            ${state.reasons.map(r =>
                                `<option value="${r.id}">[${esc(r.category)}] ${esc(r.name)}</option>`
                            ).join('')}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Комментарий</label>

                    </div>

                    <button class="btn" type="submit">Сохранить</button>

            </div>
        </div>
    `;

    if (!isTeacher) {
        const classSelect = document.getElementById('add-class');
        const studentSelect = document.getElementById('add-student');

        classSelect.addEventListener('change', () => {
            const cid = Number(classSelect.value);
            const students = cid ? getStudentsOfClass(cid) : [];
            studentSelect.disabled = !cid;
            studentSelect.innerHTML = cid
                ? '<option value="">— выберите ученика —</option>' +
                  students.map(s => `<option value="${s.id}">${esc(s.fullName)}</option>`).join('')
                : '<option value="">— сначала выберите класс —</option>';
        });
    }

    document.getElementById('add-form').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const studentId = Number(fd.get('studentId'));
        const reasonId = Number(fd.get('reasonId'));
        const date = fd.get('date');
        const comment = (fd.get('comment') || '').trim();

        if (!studentId || !reasonId || !date) return;

        state.absences.push({
            id: nextId(state.absences),
            studentId, reasonId, date, comment
        });
        save();

        const s = getStudent(studentId);
        const r = getReason(reasonId);
        logAction(`Добавил(а) пропуск: ${s.fullName}, ${formatDate(date)}, ${r.name}`);

        document.getElementById('add-msg').innerHTML =
            '<div class="alert alert-success">Пропуск добавлен</div>';
        e.target.reset();
        e.target.querySelector('[name="date"]').value = today;

            document.getElementById('add-student').disabled = true;
            document.getElementById('add-student').innerHTML =
                '<option value="">— сначала выберите класс —</option>';
        }
    });
}

let reportsState = { classFilter: 'all', start: null, end: null };

function renderReportsPage() {
    const today = new Date();
    const startDefault = new Date(); startDefault.setDate(startDefault.getDate() - 29);

    if (!reportsState.start) reportsState.start = startDefault.toISOString().slice(0, 10);
    if (!reportsState.end)   reportsState.end   = today.toISOString().slice(0, 10);

    const isTeacher = session.role === 'teacher';
    let allowedClasses;
    if (isTeacher) {
        const own = state.classes.find(c => c.teacherId === session.userId);
        allowedClasses = own ? [own] : [];
        reportsState.classFilter = own ? String(own.id) : 'all';
    } else {
        allowedClasses = state.classes;
    }

    const { start, end } = reportsState;
    const classFilter = reportsState.classFilter;

    // Данные в периоде
    let absencesInPeriod;
    if (classFilter === 'all') {
        absencesInPeriod = state.absences.filter(a => a.date >= start && a.date <= end);
    } else {
        const cid = Number(classFilter);
        const studentIds = getStudentsOfClass(cid).map(s => s.id);
        absencesInPeriod = state.absences.filter(a =>
            a.date >= start && a.date <= end && studentIds.includes(a.studentId)
        );
    }

    const workdays = workdaysBetween(start, end);
    const totalAbs = absencesInPeriod.length;

    // Топ причин и категорий
    const reasonCount = {}, catCount = {};
    absencesInPeriod.forEach(a => {
        const r = getReason(a.reasonId);
        reasonCount[r.name] = (reasonCount[r.name] || 0) + 1;
        catCount[r.category] = (catCount[r.category] || 0) + 1;
    });
    const topReasons = Object.entries(reasonCount).sort((a, b) => b[1] - a[1]).slice(0, 8);

    // Что показывать в таблице: учеников или классы
    let tableHTML;
    if (classFilter === 'all') {
        // Сводка по классам
        const classRows = allowedClasses.map(c => {
            const students = getStudentsOfClass(c.id);
            const avg = classAvgAttendance(c.id, start, end);
            const abs = state.absences.filter(a =>
                a.date >= start && a.date <= end && students.some(s => s.id === a.studentId)
            ).length;
            return { cls: c, teacher: getTeacherOfClass(c.id), students: students.length, abs, avg };
        });
        tableHTML = `
            <table>
                <thead><tr>
                    <th>Класс</th><th>Классный руководитель</th>
                    <th class="td-center">Учеников</th>
                    <th class="td-center">Пропусков</th>
                    <th>Посещаемость</th>
                </tr></thead>
                <tbody>
                    ${classRows.map(r => {
                        const cls = r.avg >= 90 ? 'success' : r.avg >= 75 ? 'warning' : 'danger';
                        return `<tr>
                            <td><b>${esc(r.cls.name)}</b></td>
                            <td>${r.teacher ? esc(r.teacher.name) : '—'}</td>
                            <td class="td-center">${r.students}</td>
                            <td class="td-center">${r.abs}</td>
                            <td><div class="progress"><div class="progress-fill ${cls}" style="width:${r.avg}%">${r.avg}%</div></div></td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>`;
    } else {
        // Сводка по ученикам выбранного класса
        const students = getStudentsOfClass(Number(classFilter));
        const studentStats = students.map(s => {
            const st = { name: s.fullName, total: 0, 'уважительная': 0, 'неуважительная': 0, 'особая': 0 };
            absencesInPeriod.filter(a => a.studentId === s.id).forEach(a => {
                const r = getReason(a.reasonId);
                st.total++;
                st[r.category]++;
            });
            st.attendance = Math.round(calcAttendance(s.id, start, end) * 10) / 10;
            return st;
        }).sort((a, b) => a.name.localeCompare(b.name));

        tableHTML = `
            <table>
                <thead><tr>
                    <th>Ученик</th><th class="td-center">Пропусков</th>
                    <th class="td-center">Уваж.</th><th class="td-center">Неуваж.</th>
                    <th class="td-center">Особая</th><th>Посещаемость</th>
                </tr></thead>
                <tbody>
                    ${studentStats.map(s => {
                        const cls = s.attendance >= 90 ? 'success' : s.attendance >= 75 ? 'warning' : 'danger';
                        return `<tr>

function barsHTML(items) {
    const max = Math.max(...items.map(i => i[1]), 1);
    return items.map(([label, count]) => `
        <div class="bar-row">
            <div class="bar-label">${esc(label)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(count / max) * 100}%"></div></div>
            <div class="bar-value">${count}</div>
        </div>
    `).join('');
}

function donutHTML(catCount) {
    const colors = { 'уважительная': '#16a34a', 'неуважительная': '#f59e0b', 'особая': '#6b7280' };
    const total = Object.values(catCount).reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    const segments = [];
    Object.entries(catCount).forEach(([cat, count]) => {
        const from = (acc / total) * 360;
        acc += count;
        const to = (acc / total) * 360;
        segments.push(`${colors[cat] || '#cbd5e1'} ${from}deg ${to}deg`);
    });
    const gradient = `conic-gradient(${segments.join(',')})`;
    const legend = Object.entries(catCount).map(([cat, count]) => `
        <div class="legend-item">
            <span class="legend-dot" style="background:${colors[cat] || '#cbd5e1'};"></span>
            <span>${esc(cat)}: <b>${count}</b></span>
        </div>
    `).join('');
    return `<div class="donut-wrap">
        <div class="donut" style="background:${gradient};"></div>
        <div class="legend">${legend}</div>
    </div>`;
}

            <div class="card-body p-0">

/* ================================================================
   13. ЭКСПОРТ В CSV
   ================================================================ */
function exportCSV() {
    const rows = [['Класс', 'Ученик', 'Дата', 'Причина', 'Категория', 'Комментарий']];
    [...state.absences]
        .sort((a, b) => b.date.localeCompare(a.date))
        .forEach(a => {
            const s = getStudent(a.studentId);
            const r = getReason(a.reasonId);
            const c = s ? getClass(s.classId) : null;
            rows.push([
                c ? c.name : '',
                s ? s.fullName : '',
                a.date,
                r.name,
                r.category,
                a.comment || ''
            ]);
        });

    const csv = '\ufeff' + rows.map(row =>
        row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';')
    ).join('\r\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'absences_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
