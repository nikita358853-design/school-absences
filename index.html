<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Посещаемость — учёт пропусков и причин</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --primary: #2563eb; --primary-d: #1d4ed8;
        --bg: #f4f6fb; --card: #fff; --border: #e2e8f0;
        --text: #1e293b; --muted: #64748b;
        --success: #16a34a; --warning: #f59e0b;
        --danger: #dc2626; --secondary: #6b7280;
        --director: #7c3aed; --deputy: #db2777;
        --admin: #0891b2;
        --radius: 10px;
        --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
    }
    .hidden { display: none !important; }

    /* Buttons */
    .btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 16px; border: 1px solid transparent; border-radius: 8px;
        background: var(--primary); color: #fff; font-size: 14px; font-weight: 500;
        cursor: pointer; font-family: inherit; transition: background .15s;
    }
    .btn:hover { background: var(--primary-d); }
    .btn-outline { background: transparent; color: var(--primary); border-color: var(--primary); }
    .btn-outline:hover { background: rgba(37,99,235,.08); }
    .btn-danger { background: var(--danger); } .btn-danger:hover { background: #b91c1c; }
    .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-ghost:hover { background: #f1f5f9; color: var(--text); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .input, .select, .textarea {
        width: 100%; padding: 9px 12px; border: 1px solid var(--border);
        border-radius: 8px; background: #fff; font-size: 14px; font-family: inherit;
        color: var(--text); transition: border-color .15s, box-shadow .15s;
    }
    .input:focus, .select:focus, .textarea:focus {
        outline: none; border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .input:disabled, .select:disabled { background: #f8fafc; color: var(--muted); cursor: not-allowed; }
    .textarea { resize: vertical; min-height: 60px; }

    /* Login */
    #login-screen {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 20px;
    }
    .login-card {
        background: var(--card); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 32px; width: 100%; max-width: 460px;
    }
    .login-card h1 { font-size: 20px; text-align: center; margin-bottom: 24px; }
    .login-card h1 .icon {
        display: inline-block; background: var(--primary); color: #fff;
        width: 40px; height: 40px; border-radius: 10px; line-height: 40px;
        text-align: center; margin-right: 8px; font-size: 20px; vertical-align: middle;
    }
    .demo-box {
        margin-top: 20px; padding: 12px 14px; background: #f8fafc;
        border: 1px dashed var(--border); border-radius: 8px;
        font-size: 12px; color: var(--muted); line-height: 1.9;
    }
    .demo-box b { color: var(--text); }
    .demo-box code {
        background: #fff; padding: 1px 6px; border-radius: 4px;
        border: 1px solid var(--border); color: var(--text);
        font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px;
    }
    .error-msg {
        background: #fef2f2; color: #991b1b; padding: 10px 14px;
        border-radius: 8px; font-size: 13px; margin-bottom: 16px;
        border: 1px solid #fecaca;
    }

    /* App header */
    .app-header {
        background: #fff; border-bottom: 1px solid var(--border);
        padding: 0 24px; display: flex; align-items: center; gap: 24px;
        height: 60px; position: sticky; top: 0; z-index: 10;
    }
    .app-header .logo { font-weight: 700; font-size: 16px; color: var(--primary); white-space: nowrap; }
    .app-nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
    .app-nav button {
        padding: 8px 14px; background: transparent; border: none;
        border-radius: 8px; font-size: 14px; font-family: inherit;
        color: var(--muted); cursor: pointer; transition: all .15s;
        white-space: nowrap;
    }
    .app-nav button:hover { background: #f1f5f9; color: var(--text); }
    .app-nav button.active { background: rgba(37,99,235,.1); color: var(--primary); font-weight: 600; }
    .user-info { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .user-info .name { color: var(--text); font-weight: 500; }
    .user-info .role {
        padding: 2px 8px; border-radius: 4px; font-size: 11px;
        text-transform: uppercase; letter-spacing: .03em; font-weight: 600;
    }
    .role-director { background: #f3e8ff; color: var(--director); }
    .role-deputy   { background: #fce7f3; color: var(--deputy); }
    .role-teacher  { background: #dbeafe; color: var(--primary); }
    .role-student  { background: #dcfce7; color: var(--success); }
    .role-admin    { background: #cffafe; color: var(--admin); }

    /* Container */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .page-title { font-size: 22px; margin-bottom: 4px; }
    .page-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    /* Cards */
    .card {
        background: var(--card); border-radius: var(--radius);
        box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden;
    }
    .card-header {
        padding: 14px 20px; border-bottom: 1px solid var(--border);
        font-weight: 600; font-size: 15px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        flex-wrap: wrap;
    }
    .card-body { padding: 20px; }
    .card-body.p-0 { padding: 0; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
        text-align: left; padding: 12px 16px; font-size: 11px;
        font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
        color: var(--muted); background: #f8fafc;
        border-bottom: 1px solid var(--border);
    }
    tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    .td-center { text-align: center; }
    .td-end { text-align: right; }

    /* Badges */
    .badge {
        display: inline-block; padding: 2px 10px; border-radius: 999px;
        font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: .03em; white-space: nowrap;
    }
    .badge-success   { background: #dcfce7; color: #166534; }
    .badge-warning   { background: #fef3c7; color: #92400e; }
    .badge-secondary { background: #e2e8f0; color: #475569; }
    .badge-danger    { background: #fee2e2; color: #991b1b; }
    .badge-info      { background: #dbeafe; color: #1e40af; }

    /* KPI */
    .kpi-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px; margin-bottom: 24px;
    }
    .kpi {
        background: #fff; border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 18px 20px;
        border-left: 4px solid var(--primary);
    }
    .kpi.success { border-left-color: var(--success); }
    .kpi.warning { border-left-color: var(--warning); }
    .kpi.danger  { border-left-color: var(--danger); }
    .kpi.director { border-left-color: var(--director); }
    .kpi.deputy  { border-left-color: var(--deputy); }
    .kpi.admin   { border-left-color: var(--admin); }
    .kpi .kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
    .kpi .kpi-value { font-size: 26px; font-weight: 700; }

    /* Charts */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
    .bar-label { width: 200px; flex-shrink: 0; font-size: 12px; line-height: 1.3; }
    .bar-track { flex: 1; height: 20px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width .4s; }
    .bar-value { width: 30px; text-align: right; font-weight: 600; font-size: 12px; }
    .donut-wrap { display: flex; align-items: center; gap: 20px; }
    .donut { width: 130px; height: 130px; border-radius: 50%; flex-shrink: 0; position: relative; }
    .donut::after { content: ''; position: absolute; inset: 26px; background: #fff; border-radius: 50%; }
    .legend { font-size: 13px; line-height: 1.9; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    /* Progress */
    .progress {
        height: 20px; background: #f1f5f9; border-radius: 999px;
        overflow: hidden; position: relative; min-width: 110px;
    }
    .progress-fill {
        height: 100%; border-radius: 999px; display: flex; align-items: center;
        justify-content: center; font-size: 11px; font-weight: 600; color: #fff;
        transition: width .4s; white-space: nowrap; padding: 0 6px;
    }
    .progress-fill.success { background: var(--success); }
    .progress-fill.warning { background: var(--warning); }
    .progress-fill.danger  { background: var(--danger); }

    /* Students grid */
    .students-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
    }
    .student-chip {
        padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
        font-size: 14px; background: #fafbfc; display: flex; align-items: center; gap: 8px;
    }
    .student-chip::before {
        content: ''; width: 8px; height: 8px; background: var(--primary);
        border-radius: 50%; flex-shrink: 0;
    }

    /* Alerts */
    .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .alert-success { background: #dcfce7; color: #166534; }
    .alert-error   { background: #fef2f2; color: #991b1b; }
    .alert-info    { background: #eff6ff; color: #1e40af; }
    .alert-warning { background: #fef3c7; color: #92400e; }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }

    /* Section */
    .section-title {
        font-size: 16px; font-weight: 600; margin: 24px 0 12px;
        padding-bottom: 8px; border-bottom: 2px solid var(--border);
        display: flex; align-items: center; gap: 8px;
    }
    .inline-form {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px; align-items: end;
    }
    .inline-form .form-group { margin-bottom: 0; }

    /* Log */
    .log-entry {
        padding: 10px 16px; border-bottom: 1px solid var(--border);
        font-size: 13px; display: flex; gap: 12px; align-items: flex-start;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-time { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 130px; }
    .log-user { font-weight: 600; }

    /* ============= SCHEDULE ============= */
    .day-section { margin-bottom: 20px; }
    .day-header {
        font-weight: 600; font-size: 15px; margin-bottom: 10px;
        padding-bottom: 6px; border-bottom: 2px solid var(--border);
        display: flex; align-items: center; justify-content: space-between;
    }
    .day-header .day-count {
        font-size: 12px; color: var(--muted); font-weight: 500;
    }
    .lesson-row {
        display: flex; align-items: center; gap: 10px; padding: 8px 12px;
        background: #f8fafc; border-radius: 6px; margin-bottom: 6px;
        font-size: 14px;
    }
    .lesson-num {
        background: var(--primary); color: #fff;
        width: 24px; height: 24px; border-radius: 4px;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 600; flex-shrink: 0;
    }
    .lesson-time { color: var(--muted); font-size: 13px; font-family: monospace; min-width: 100px; }
    .lesson-subject { font-weight: 500; flex: 1; }
    .lesson-teacher { color: var(--muted); font-size: 13px; }

    /* ============= QUICK-ADD ROSTER ============= */
    .attendance-row td { transition: background .15s; }
    .attendance-row.active { background: #fef2f2; }
    .attendance-check { width: 18px; height: 18px; cursor: pointer; accent-color: var(--danger); }
    .attendance-row .input, .attendance-row .select { padding: 6px 10px; font-size: 13px; }
    .quick-info {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px; margin-bottom: 16px; padding: 14px 16px;
        background: #eff6ff; border-radius: 8px; font-size: 13px;
    }
    .quick-info .qi-item { display: flex; flex-direction: column; }
    .quick-info .qi-label { color: var(--muted); font-size: 11px; text-transform: uppercase;
                            letter-spacing: .04em; font-weight: 600; margin-bottom: 2px; }
    .quick-info .qi-value { font-weight: 600; font-size: 15px; color: var(--text); }
</style>
</head>

const STORAGE_KEY = 'school_attendance_v3';
const SESSION_KEY = 'school_attendance_session_v3';
const DAYS = { 1: 'Понедельник', 2: 'Вторник', 3: 'Среда', 4: 'Четверг', 5: 'Пятница', 6: 'Суббота', 7: 'Воскресенье' };

let state = null;
let session = null;

/* ================================================================
   2. ХРАНИЛИЩЕ
   ================================================================ */
function initStorage() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { try { state = JSON.parse(raw); } catch { state = null; } }
    if (!state || !state.users || !state.schedule) {
        state = JSON.parse(JSON.stringify(SEED));
        state.absences = generateDemoAbsences();
        save();
    }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function loadSession() {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (raw) { try { session = JSON.parse(raw); } catch { session = null; } }
}
function saveSession() {
    if (session) sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    else sessionStorage.removeItem(SESSION_KEY);
}

/* ================================================================
   3. УТИЛИТЫ
   ================================================================ */
function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
}
function getStudent(id) { return state.students.find(s => s.id === id); }
function getClass(id) { return state.classes.find(c => c.id === id); }
function getReason(id) { return state.reasons.find(r => r.id === id); }
function getUser(id) { return state.users.find(u => u.id === id); }
function getStudentsOfClass(classId) { return state.students.filter(s => s.classId === classId); }
function getTeacherOfClass(classId) {
    const c = getClass(classId); if (!c || !c.teacherId) return null;
    const u = getUser(c.teacherId); return u && u.role === 'teacher' ? u : null;
}
function allTeachers() { return state.users.filter(u => u.role === 'teacher'); }
function nextId(arr) { return arr.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1; }
function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-'); return d + '.' + m + '.' + y;
}
function formatDateTime(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
function getDayOfWeek(isoDate) {
    const d = new Date(isoDate + 'T00:00:00');
    const jsDay = d.getDay();
    return jsDay === 0 ? 7 : jsDay;
}
function dayName(n) { return DAYS[n] || '?'; }
function getLessonsForDay(classId, isoDate) {
    const dw = getDayOfWeek(isoDate);
    return state.schedule
        .filter(l => l.classId === classId && l.dayOfWeek === dw)
        .sort((a, b) => a.lessonNumber - b.lessonNumber);
}
function workdaysBetween(fromIso, toIso) {
    const from = new Date(fromIso), to = new Date(toIso);
    let count = 0; const d = new Date(from);
    while (d <= to) {
        const day = d.getDay();
        if (day !== 0 && day !== 6) count++;
        d.setDate(d.getDate() + 1);
    }
    return count;
}
function categoryBadge(cat) {
    if (cat === 'уважительная') return '<span class="badge badge-success">уважительная</span>';
    if (cat === 'неуважительная') return '<span class="badge badge-warning">неуважительная</span>';
    return '<span class="badge badge-secondary">' + esc(cat) + '</span>';
}
function roleLabel(role) {
    return { director: 'директор', deputy: 'завуч', teacher: 'учитель', student: 'ученик', admin: 'администратор' }[role] || role;
}
function roleBadgeClass(role) { return 'role-' + role; }
function calcAttendance(studentId, startIso, endIso) {
    const workdays = workdaysBetween(startIso, endIso);
    const absences = state.absences.filter(a =>
        a.studentId === studentId && a.date >= startIso && a.date <= endIso
    ).length;
    return workdays > 0 ? Math.max(0, ((workdays - absences) / workdays) * 100) : 100;
}
function classAvgAttendance(classId, startIso, endIso) {
    const students = getStudentsOfClass(classId);
    if (students.length === 0) return 100;
    const total = students.reduce((sum, s) => sum + calcAttendance(s.id, startIso, endIso), 0);
    return Math.round((total / students.length) * 10) / 10;
}
function getMyClass() {
    if (session.role === 'teacher') return state.classes.find(c => c.teacherId === session.userId) || null;
    if (session.role === 'student') {
        const s = getStudent(session.studentId); return s ? getClass(s.classId) : null;
    }
    return null;
}

/* ================================================================
   4. ЖУРНАЛ ДЕЙСТВИЙ
   ================================================================ */
function logAction(action) {
    if (!session) return;
    state.log.push({
        id: nextId(state.log), ts: Date.now(),
        user: session.name, role: session.role, action: action
    });
    save();
}

/* ================================================================
   5. АВТОРИЗАЦИЯ
   ================================================================ */
function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pass').value;
    const err = document.getElementById('login-error');
    const user = state.users.find(u => u.username === username);
    if (!user || user.password !== password) {
        err.textContent = 'Неверный логин или пароль';
        err.classList.remove('hidden');
        return;
    }
    session = {
        userId: user.id, role: user.role, name: user.name,
        username: user.username, studentId: user.studentId || null
    };
    saveSession();
    logAction('Вход в систему');
    renderApp();
}
function handleLogout() {
    logAction('Выход из системы');
    session = null; saveSession(); renderLogin();
}
function renderLogin() {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
    document.getElementById('login-error').classList.add('hidden');
    document.getElementById('login-form').reset();
}

/* ================================================================
   6. ОБОЛОЧКА ПРИЛОЖЕНИЯ
   ================================================================ */
let currentPage = 'home';

function renderApp() {
    if (!session) { renderLogin(); return; }
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    document.getElementById('user-name').textContent = session.name;
    const roleEl = document.getElementById('user-role');
    roleEl.textContent = roleLabel(session.role);
    roleEl.className = 'role ' + roleBadgeClass(session.role);
    renderNav();
    renderPage(currentPage);
}

function getTabs() {
    const r = session.role;
    if (r === 'student')  return [['home','Мои пропуски'], ['schedule','Расписание']];
    if (r === 'teacher')  return [
        ['home','Мой класс'], ['quick-add','Посещаемость'],
        ['schedule','Расписание'], ['reports','Отчёты']
    ];
    if (r === 'deputy')   return [
        ['home','Обзор школы'], ['quick-add','Посещаемость'],
        ['schedule','Расписание'], ['reports','Отчёты'], ['reasons','Причины']
    ];
    if (r === 'director') return [
        ['home','Обзор школы'], ['quick-add','Посещаемость'],
        ['schedule','Расписание'], ['reports','Отчёты'],
        ['manage','Структура'], ['reasons','Причины'], ['log','Журнал']
    ];
    if (r === 'admin')    return [
        ['home','Система'], ['accounts','Аккаунты'],
        ['reasons','Причины'], ['log','Журнал']
    ];
    return [];
}

function renderNav() {
    const nav = document.getElementById('app-nav');
    const tabs = getTabs();
    if (!tabs.some(t => t[0] === currentPage)) currentPage = 'home';
    nav.innerHTML = tabs.map(([key, label]) => `
        <button data-page="${key}" class="${currentPage === key ? 'active' : ''}">${esc(label)}</button>
    `).join('');
    nav.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
            currentPage = btn.dataset.page; renderApp();
        });
    });
}

const PAGES = ['home', 'quick-add', 'schedule', 'reports', 'manage', 'accounts', 'reasons', 'log'];

function renderPage(page) {
    PAGES.forEach(p => document.getElementById('page-' + p).classList.add('hidden'));
    document.getElementById('page-' + page).classList.remove('hidden');
    if (page === 'home') renderHomePage();
    else if (page === 'quick-add') renderQuickAddPage();
    else if (page === 'schedule') renderSchedulePage();
    else if (page === 'reports') renderReportsPage();
    else if (page === 'manage') renderManagePage();
    else if (page === 'accounts') renderAccountsPage();
    else if (page === 'reasons') renderReasonsPage();
    else if (page === 'log') renderLogPage();
}

            <div class="card-body p-0">
                ${recentLog.length ? recentLog.map(l => `
                    <div class="log-entry">
                        <span class="log-time">${formatDateTime(l.ts)}</span>
                        <span>
                            <span class="log-user">${esc(l.user)}</span>
                            <span class="badge ${roleBadgeClass(l.role)}" style="font-size:9px;margin-left:4px;">${roleLabel(l.role)}</span>
                            — ${esc(l.action)}
                        </span>
                    </div>`).join('') : '<div class="empty">Действий пока нет</div>'}
            </div>
        </div>
    `;
    document.getElementById('go-accounts').onclick = () => { currentPage = 'accounts'; renderApp(); };
    document.getElementById('go-reasons').onclick = () => { currentPage = 'reasons'; renderApp(); };
    document.getElementById('go-log').onclick = () => { currentPage = 'log'; renderApp(); };

let quickAddState = { classId: null, date: null };

function renderQuickAddPage() {
    const isTeacher = session.role === 'teacher';
    const allowedClasses = isTeacher
        ? (getMyClass() ? [getMyClass()] : [])
        : state.classes;

    if (allowedClasses.length === 0) {
        document.getElementById('page-quick-add').innerHTML = `
            <h1 class="page-title">Отметить посещаемость</h1>
            <div class="alert alert-warning">Вам не назначен класс. Обратитесь к директору школы.</div>`;
        return;
    }

    if (!quickAddState.classId || !allowedClasses.some(c => c.id === quickAddState.classId)) {
        quickAddState.classId = allowedClasses[0].id;
    }
    if (!quickAddState.date) {
        quickAddState.date = new Date().toISOString().slice(0, 10);
    }

    const cls = getClass(quickAddState.classId);
    const date = quickAddState.date;
    const lessons = getLessonsForDay(cls.id, date);
    const students = getStudentsOfClass(cls.id).sort((a, b) => a.fullName.localeCompare(b.fullName));
    const existingAbsences = state.absences.filter(a =>
        a.date === date && students.some(s => s.id === a.studentId)
    );
    const existingByStudent = {};
    existingAbsences.forEach(a => { existingByStudent[a.studentId] = a; });

    const dayLabel = dayName(getDayOfWeek(date));

    document.getElementById('page-quick-add').innerHTML = `
        <h1 class="page-title">Отметить посещаемость</h1>
        <p class="page-subtitle">Отметьте отсутствующих — учитель может сразу сохранить всех</p>

        <div class="card">
            <div class="card-body">
                <div class="inline-form" style="grid-template-columns: ${isTeacher ? '1fr 1fr' : '1fr 1fr'};">
                    ${!isTeacher ? `
                    <div class="form-group">
                        <label class="form-label">Класс</label>
                        <select class="select" id="qa-class">
                            ${allowedClasses.map(c =>
                                `<option value="${c.id}" ${c.id === quickAddState.classId ? 'selected' : ''}>${esc(c.name)}</option>`
                            ).join('')}
                        </select>
                    </div>` : ''}
                    <div class="form-group">
                        <label class="form-label">Дата</label>
                        <input class="input" type="date" id="qa-date" value="${date}">
                    </div>
                </div>
            </div>
        </div>

        <div class="quick-info">
            <div class="qi-item"><div class="qi-label">Класс</div><div class="qi-value">${esc(cls.name)}</div></div>
            <div class="qi-item"><div class="qi-label">День</div><div class="qi-value">${esc(dayLabel)}</div></div>
            <div class="qi-item"><div class="qi-label">Учеников</div><div class="qi-value">${students.length}</div></div>
            <div class="qi-item"><div class="qi-label">Уроков в расписании</div><div class="qi-value">${lessons.length}</div></div>
            <div class="qi-item"><div class="qi-label">Уже отмечено отсутствующих</div><div class="qi-value">${existingAbsences.length}</div></div>
        </div>

        ${lessons.length ? `
        <div class="card">
            <div class="card-header">Расписание на ${esc(dayLabel.toLowerCase())}</div>
            <div class="card-body">
                ${lessons.map(l => {
                    const t = l.teacherId ? getUser(l.teacherId) : null;
                    return `<div class="lesson-row">
                        <div class="lesson-num">${l.lessonNumber}</div>
                        <div class="lesson-time">${esc(l.startTime)}–${esc(l.endTime)}</div>
                        <div class="lesson-subject">${esc(l.subject)}</div>
                        <div class="lesson-teacher">${t ? esc(t.name) : ''}</div>
                    </div>`;
                }).join('')}
            </div>
        </div>` : `<div class="alert alert-info">На ${esc(dayLabel.toLowerCase())} уроков нет. Но вы всё равно можете отметить отсутствующих.</div>`}

        <div class="card">
            <div class="card-header">
                <span>Отметки на ${formatDate(date)}</span>
                <button class="btn btn-sm" id="qa-save">💾 Сохранить</button>
            </div>
            <div class="card-body p-0">
                ${students.length ? `
                <div class="table-wrap"><table>
                    <thead><tr>
                        <th style="width:60px;">Отсут.</th>
                        <th>Ученик</th>
                        <th style="width:260px;">Причина</th>
                        <th>Комментарий</th>
                    </tr></thead>
                    <tbody>
                        ${students.map(st => {
                            const existing = existingByStudent[st.id];
                            const isMarked = !!existing;
                            return `<tr class="attendance-row ${isMarked ? 'active' : ''}" data-row-sid="${st.id}">
                                <td><input type="checkbox" class="attendance-check" data-sid="${st.id}" ${isMarked ? 'checked' : ''}></td>
                                <td>${esc(st.fullName)}</td>
                                <td>
                                    <select class="select" data-reason-for="${st.id}" ${isMarked ? '' : 'disabled'}>
                                        <option value="">— выберите —</option>
                                        ${state.reasons.map(r =>
                                            `<option value="${r.id}" ${existing && existing.reasonId === r.id ? 'selected' : ''}>[${esc(r.category)}] ${esc(r.name)}</option>`
                                        ).join('')}
                                    </select>
                                </td>
                                <td>
                                    <input type="text" class="input" data-comment-for="${st.id}"
                                           value="${existing?.comment ? esc(existing.comment) : ''}"
                                           ${isMarked ? '' : 'disabled'}
                                           placeholder="необязательно">
                                </td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table></div>` : '<div class="empty">В классе нет учеников</div>'}
            </div>
        </div>

        <div id="qa-msg"></div>
    `;

    // Обработчики смены класса и даты
    const classSel = document.getElementById('qa-class');
    if (classSel) {
        classSel.addEventListener('change', () => {
            quickAddState.classId = Number(classSel.value);
            renderQuickAddPage();
        });
    }
    document.getElementById('qa-date').addEventListener('change', e => {
        quickAddState.date = e.target.value;
        renderQuickAddPage();
    });

    // Чекбоксы
    document.querySelectorAll('.attendance-check').forEach(cb => {
        cb.addEventListener('change', () => {
            const sid = Number(cb.dataset.sid);
            const reasonSel = document.querySelector(`[data-reason-for="${sid}"]`);
            const commentInp = document.querySelector(`[data-comment-for="${sid}"]`);
            const row = document.querySelector(`.attendance-row[data-row-sid="${sid}"]`);
            reasonSel.disabled = !cb.checked;
            commentInp.disabled = !cb.checked;
            row.classList.toggle('active', cb.checked);
        });
    });

    // Сохранить
    document.getElementById('qa-save').addEventListener('click', () => {
        const checked = [...document.querySelectorAll('.attendance-check:checked')].map(cb => Number(cb.dataset.sid));

        // Валидация: у каждого отмеченного должна быть причина
        let errorMsg = '';
        checked.forEach(sid => {
            const r = document.querySelector(`[data-reason-for="${sid}"]`).value;
            if (!r) {
                const st = getStudent(sid);
                errorMsg = `Для «${st.fullName}» не выбрана причина`;
            }
        });
        if (errorMsg) {
            document.getElementById('qa-msg').innerHTML =
                `<div class="alert alert-error">${esc(errorMsg)}</div>`;
            return;
        }

        // Upsert: удалить существующие записи для отмеченных и добавить заново
        const checkedSet = new Set(checked);
        state.absences = state.absences.filter(a =>
            !(a.date === date && checkedSet.has(a.studentId))
        );

        let idCounter = nextId(state.absences);
        checked.forEach(sid => {
            const reasonId = Number(document.querySelector(`[data-reason-for="${sid}"]`).value);
            const comment = document.querySelector(`[data-comment-for="${sid}"]`).value.trim();
            state.absences.push({
                id: idCounter++, studentId: sid, date, reasonId, comment
            });
        });

        save();
        logAction(`Отметил(а) посещаемость ${cls.name} на ${formatDate(date)}: отсутствует ${checked.length}`);

        document.getElementById('qa-msg').innerHTML =
            `<div class="alert alert-success">Сохранено: ${checked.length} отсутствующих на ${formatDate(date)}</div>`;

        // Перерисовка через мгновение, чтобы сообщение было видно
        setTimeout(() => renderQuickAddPage(), 600);
    });
}

let schedState = { classId: null };

function renderSchedulePage() {
    const isTeacher = session.role === 'teacher';
    const isStudent = session.role === 'student';
    const isDirector = session.role === 'director';
    const isDeputy = session.role === 'deputy';
    const canEdit = isDirector || isDeputy;

    let allowedClasses;
    if (isTeacher || isStudent) {
        const my = getMyClass();
        allowedClasses = my ? [my] : [];
    } else {
        allowedClasses = state.classes;
    }

    if (allowedClasses.length === 0) {
        document.getElementById('page-schedule').innerHTML = `
            <h1 class="page-title">Расписание</h1>
            <div class="alert alert-warning">Нет доступных классов.</div>`;
        return;
    }

    if (!schedState.classId || !allowedClasses.some(c => c.id === schedState.classId)) {
        schedState.classId = allowedClasses[0].id;
    }

    const cls = getClass(schedState.classId);
    const teachers = allTeachers();

    let html = `
        <h1 class="page-title">Расписание · ${esc(cls.name)}</h1>
        <p class="page-subtitle">${canEdit ? 'Можно редактировать' : 'Режим просмотра'}</p>
    `;

    if (!isTeacher && !isStudent) {
        html += `
        <div class="card">
            <div class="card-body">
                <div class="form-group" style="margin:0; max-width:300px;">
                    <label class="form-label">Класс</label>
                    <select class="select" id="sched-class">
                        ${allowedClasses.map(c =>
                            `<option value="${c.id}" ${c.id === schedState.classId ? 'selected' : ''}>${esc(c.name)}</option>`
                        ).join('')}
                    </select>
                </div>
            </div>
        </div>`;
    }

    if (canEdit) {
        html += `
        <div class="card">
            <div class="card-header">Добавить урок</div>
            <div class="card-body">
                <form id="form-add-lesson" class="inline-form">
                    <div class="form-group">
                        <label class="form-label">День *</label>
                        <select class="select" name="dayOfWeek" required>
                            ${[1,2,3,4,5,6].map(d => `<option value="${d}">${DAYS[d]}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">№ урока *</label>
                        <select class="select" name="lessonNumber" required>
                            ${[1,2,3,4,5,6,7,8].map(n => `<option value="${n}">${n}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Предмет *</label>
                        <input class="input" name="subject" placeholder="Математика" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Учитель</label>
                        <select class="select" name="teacherId">
                            <option value="">— не указан —</option>
                            ${teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Начало *</label>
                        <input class="input" type="time" name="startTime" value="08:30" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Конец *</label>
                        <input class="input" type="time" name="endTime" value="09:15" required>
                    </div>
                    <div class="form-group">
                        <button class="btn" type="submit">+ Добавить</button>
                    </div>
                </form>
                <div id="sched-msg" style="margin-top:12px;"></div>
            </div>
        </div>`;
    }

    // Группировка по дням
    const byDay = {};
    for (let d = 1; d <= 6; d++) byDay[d] = [];
    state.schedule.filter(l => l.classId === cls.id).forEach(l => {
        if (byDay[l.dayOfWeek]) byDay[l.dayOfWeek].push(l);
    });
    Object.values(byDay).forEach(arr => arr.sort((a, b) => a.lessonNumber - b.lessonNumber));

    html += `<div class="card"><div class="card-body">`;
    let totalLessons = 0;
    for (let d = 1; d <= 6; d++) {
        const lessons = byDay[d];
        totalLessons += lessons.length;
        html += `<div class="day-section">
            <div class="day-header">
                <span>${DAYS[d]}</span>
                <span class="day-count">${lessons.length} уроков</span>
            </div>
            ${lessons.length ? lessons.map(l => {
                const t = l.teacherId ? getUser(l.teacherId) : null;
                return `<div class="lesson-row">
                    <div class="lesson-num">${l.lessonNumber}</div>
                    <div class="lesson-time">${esc(l.startTime)}–${esc(l.endTime)}</div>
                    <div class="lesson-subject">${esc(l.subject)}</div>
                    <div class="lesson-teacher">${t ? esc(t.name) : ''}</div>
                    ${canEdit ? `<button class="btn btn-ghost btn-sm" data-del-lesson="${l.id}" title="Удалить">✕</button>` : ''}
                </div>`;
            }).join('') : `<div style="color:var(--muted);font-size:13px;padding:6px 0;">Уроков нет</div>`}
        </div>`;
    }
    html += `</div></div>`;

    document.getElementById('page-schedule').innerHTML = html;

    // Обработчики
    const classSel = document.getElementById('sched-class');
    if (classSel) {
        classSel.addEventListener('change', () => {
            schedState.classId = Number(classSel.value);
            renderSchedulePage();
        });
    }

    if (canEdit) {
        document.getElementById('form-add-lesson').addEventListener('submit', e => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const dayOfWeek = Number(fd.get('dayOfWeek'));
            const lessonNumber = Number(fd.get('lessonNumber'));
            const subject = (fd.get('subject') || '').trim();
            const teacherId = fd.get('teacherId') ? Number(fd.get('teacherId')) : null;
            const startTime = fd.get('startTime');
            const endTime = fd.get('endTime');

            if (!subject) return;

            // Проверка: нет ли уже урока в этот день на это место
            if (state.schedule.some(l => l.classId === cls.id &&
                l.dayOfWeek === dayOfWeek && l.lessonNumber === lessonNumber)) {
                document.getElementById('sched-msg').innerHTML =
                    `<div class="alert alert-error">На ${DAYS[dayOfWeek]} уже есть урок №${lessonNumber}</div>`;
                return;
            }

            state.schedule.push({
                id: nextId(state.schedule), classId: cls.id,
                dayOfWeek, lessonNumber, subject, teacherId, startTime, endTime
            });
            save();
            logAction(`Добавил(а) урок: ${cls.name}, ${DAYS[dayOfWeek]}, №${lessonNumber}, ${subject}`);
            renderSchedulePage();
        });

        document.querySelectorAll('[data-del-lesson]').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = Number(btn.dataset.delLesson);
                const l = state.schedule.find(x => x.id === id);
                if (!confirm(`Удалить урок «${l.subject}» (${DAYS[l.dayOfWeek]}, №${l.lessonNumber})?`)) return;
                state.schedule = state.schedule.filter(x => x.id !== id);
                save();
                logAction(`Удалил(а) урок: ${cls.name}, ${DAYS[l.dayOfWeek]}, №${l.lessonNumber}, ${l.subject}`);
                renderSchedulePage();
            });
        });
    }
}

let reportsState = { classFilter: 'all', start: null, end: null };

function renderReportsPage() {
    const today = new Date();
    const s = new Date(); s.setDate(s.getDate() - 29);
    if (!reportsState.start) reportsState.start = s.toISOString().slice(0, 10);
    if (!reportsState.end)   reportsState.end   = today.toISOString().slice(0, 10);

    const isTeacher = session.role === 'teacher';
    let allowedClasses;
    if (isTeacher) {
        const own = getMyClass();
        allowedClasses = own ? [own] : [];
        reportsState.classFilter = own ? String(own.id) : 'all';
    } else {
        allowedClasses = state.classes;
    }

    const { start, end } = reportsState;
    const classFilter = reportsState.classFilter;

    let absencesInPeriod;
    if (classFilter === 'all') {
        absencesInPeriod = state.absences.filter(a => a.date >= start && a.date <= end);
    } else {
        const cid = Number(classFilter);
        const studentIds = getStudentsOfClass(cid).map(x => x.id);
        absencesInPeriod = state.absences.filter(a =>
            a.date >= start && a.date <= end && studentIds.includes(a.studentId)
        );
    }

    const workdays = workdaysBetween(start, end);
    const totalAbs = absencesInPeriod.length;

    const reasonCount = {}, catCount = {};
    absencesInPeriod.forEach(a => {
        const r = getReason(a.reasonId);
        if (!r) return;
        reasonCount[r.name] = (reasonCount[r.name] || 0) + 1;
        catCount[r.category] = (catCount[r.category] || 0) + 1;
    });
    const topReasons = Object.entries(reasonCount).sort((a, b) => b[1] - a[1]).slice(0, 8);

    let tableHTML;
    if (classFilter === 'all') {
        const classRows = allowedClasses.map(c => {
            const students = getStudentsOfClass(c.id);
            const avg = classAvgAttendance(c.id, start, end);
            const abs = state.absences.filter(a =>
                a.date >= start && a.date <= end && students.some(s2 => s2.id === a.studentId)
            ).length;
            return { cls: c, teacher: getTeacherOfClass(c.id), students: students.length, abs, avg };
        });
        tableHTML = `<table>
            <thead><tr>
                <th>Класс</th><th>Классный руководитель</th>
                <th class="td-center">Учеников</th><th class="td-center">Пропусков</th>
                <th>Посещаемость</th>
            </tr></thead>
            <tbody>${classRows.map(r => {
                const bar = r.avg >= 90 ? 'success' : r.avg >= 75 ? 'warning' : 'danger';
                return `<tr>
                    <td><b>${esc(r.cls.name)}</b></td>
                    <td>${r.teacher ? esc(r.teacher.name) : '—'}</td>
                    <td class="td-center">${r.students}</td>
                    <td class="td-center">${r.abs}</td>
                    <td><div class="progress"><div class="progress-fill ${bar}" style="width:${r.avg}%">${r.avg}%</div></div></td>
                </tr>`;
            }).join('')}</tbody>
        </table>`;
    } else {
        const students = getStudentsOfClass(Number(classFilter));
        const studentStats = students.map(st => {
            const stat = { name: st.fullName, total: 0, 'уважительная': 0, 'неуважительная': 0, 'особая': 0 };
            absencesInPeriod.filter(a => a.studentId === st.id).forEach(a => {
                const r = getReason(a.reasonId);
                if (!r) return;
                stat.total++;
                stat[r.category]++;
            });
            stat.attendance = Math.round(calcAttendance(st.id, start, end) * 10) / 10;
            return stat;
        }).sort((a, b) => a.name.localeCompare(b.name));

        tableHTML = `<table>
            <thead><tr>
                <th>Ученик</th><th class="td-center">Пропусков</th>
                <th class="td-center">Уваж.</th><th class="td-center">Неуваж.</th>
                <th class="td-center">Особая</th><th>Посещаемость</th>
            </tr></thead>
            <tbody>${studentStats.map(st => {
                const bar = st.attendance >= 90 ? 'success' : st.attendance >= 75 ? 'warning' : 'danger';
                return `<tr>
                    <td>${esc(st.name)}</td>
                    <td class="td-center">${st.total}</td>
                    <td class="td-center">${st['уважительная']}</td>
                    <td class="td-center">${st['неуважительная']}</td>
                    <td class="td-center">${st['особая']}</td>
                    <td><div class="progress"><div class="progress-fill ${bar}" style="width:${st.attendance}%">${st.attendance}%</div></div></td>
                </tr>`;
            }).join('')}</tbody>
        </table>`;
    }

    document.getElementById('page-reports').innerHTML = `
        <h1 class="page-title">Отчёты</h1>
        <p class="page-subtitle">Период: ${formatDate(start)} — ${formatDate(end)}</p>

        <div class="card">
            <div class="card-body">
                <form id="reports-filter" class="inline-form">
                    ${!isTeacher ? `
                    <div class="form-group">
                        <label class="form-label">Класс</label>
                        <select class="select" name="classId">
                            <option value="all">Все классы</option>
                            ${allowedClasses.map(c =>
                                `<option value="${c.id}" ${classFilter === String(c.id) ? 'selected' : ''}>${esc(c.name)}</option>`
                            ).join('')}
                        </select>
                    </div>` : ''}
                    <div class="form-group">
                        <label class="form-label">С</label>
                        <input class="input" type="date" name="start" value="${start}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">По</label>
                        <input class="input" type="date" name="end" value="${end}">
                    </div>
                    <div class="form-group"><button class="btn" type="submit">Применить</button></div>
                    <div class="form-group"><button class="btn btn-outline" type="button" id="export-btn">⬇ CSV</button></div>
                </form>
            </div>
        </div>

        <div class="kpi-grid">
            <div class="kpi"><div class="kpi-label">Рабочих дней</div><div class="kpi-value">${workdays}</div></div>
            <div class="kpi warning"><div class="kpi-label">Пропусков</div><div class="kpi-value">${totalAbs}</div></div>
            <div class="kpi success"><div class="kpi-label">Учеников в выборке</div><div class="kpi-value">${classFilter === 'all'
                ? allowedClasses.reduce((sum, c) => sum + getStudentsOfClass(c.id).length, 0)
                : getStudentsOfClass(Number(classFilter)).length}</div></div>
        </div>

        <div class="charts-grid">
            <div class="card" style="margin-bottom:0;">
                <div class="card-header">Топ причин</div>

                <div class="card-header">Категории</div>
                <div class="card-body">${Object.keys(catCount).length ? donutHTML(catCount) : '<div class="empty">Нет данных</div>'}</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">${classFilter === 'all' ? 'Сводка по классам' : 'Посещаемость учеников'}</div>
            <div class="card-body p-0"><div class="table-wrap">${tableHTML}</div></div>
        </div>
    `;

    document.getElementById('reports-filter').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        reportsState.start = fd.get('start');
        reportsState.end = fd.get('end');

        renderReportsPage();
    });
    document.getElementById('export-btn').addEventListener('click', exportCSV);
}

function barsHTML(items) {
    const max = Math.max(...items.map(i => i[1]), 1);
    return items.map(([label, count]) => `
        <div class="bar-row">
            <div class="bar-label">${esc(label)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(count / max) * 100}%"></div></div>
            <div class="bar-value">${count}</div>
        </div>
    `).join('');
}

function donutHTML(catCount) {
    const colors = { 'уважительная': '#16a34a', 'неуважительная': '#f59e0b', 'особая': '#6b7280' };
    const total = Object.values(catCount).reduce((a, b) => a + b, 0) || 1;
    let acc = 0; const segments = [];
    Object.entries(catCount).forEach(([cat, count]) => {
        const from = (acc / total) * 360;
        acc += count;
        const to = (acc / total) * 360;
        segments.push(`${colors[cat] || '#cbd5e1'} ${from}deg ${to}deg`);
    });
    const gradient = `conic-gradient(${segments.join(',')})`;
    const legend = Object.entries(catCount).map(([cat, count]) => `
        <div class="legend-item">
            <span class="legend-dot" style="background:${colors[cat] || '#cbd5e1'};"></span>
            <span>${esc(cat)}: <b>${count}</b></span>
        </div>
    `).join('');
    return `<div class="donut-wrap">
        <div class="donut" style="background:${gradient};"></div>
        <div class="legend">${legend}</div>
    </div>`;
}

/* ================================================================
   15. ЭКСПОРТ CSV
   ================================================================ */
function exportCSV() {
    const rows = [['Класс', 'Ученик', 'Дата', 'Причина', 'Категория', 'Комментарий']];
    [...state.absences].sort((a, b) => b.date.localeCompare(a.date)).forEach(a => {
        const s = getStudent(a.studentId);
        const r = getReason(a.reasonId);
        const c = s ? getClass(s.classId) : null;
        rows.push([c ? c.name : '', s ? s.fullName : '', a.date, r?.name || '', r?.category || '', a.comment || '']);
    });
    const csv = '\ufeff' + rows.map(row =>
        row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';')
    ).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'absences_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
