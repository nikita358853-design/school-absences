<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учёт пропусков и причин — 10 класс</title>
<style>
    /* ============ СБРОС И ПЕРЕМЕННЫЕ ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --primary:   #2563eb;
        --primary-d: #1d4ed8;
        --bg:        #f4f6fb;
        --card:      #ffffff;
        --border:    #e2e8f0;
        --text:      #1e293b;
        --muted:     #64748b;
        --success:   #16a34a;
        --warning:   #f59e0b;
        --danger:    #dc2626;
        --secondary: #6b7280;
        --radius:    10px;
        --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                     'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
    }

    .hidden { display: none !important; }

    /* ============ КНОПКИ ============ */
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--primary);
        color: white;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: background .15s;
    }
    .btn:hover     { background: var(--primary-d); }
    .btn-outline   { background: transparent; color: var(--primary); border-color: var(--primary); }
    .btn-outline:hover { background: rgba(37,99,235,.08); }
    .btn-danger    { background: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }
    .btn-ghost     { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-ghost:hover { background: #f1f5f9; color: var(--text); }
    .btn-sm        { padding: 4px 10px; font-size: 12px; }

    /* ============ ИНПУТЫ ============ */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500;
                  color: var(--text); margin-bottom: 6px; }
    .input, .select, .textarea {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
        font-size: 14px;
        font-family: inherit;
        color: var(--text);
        transition: border-color .15s, box-shadow .15s;
    }
    .input:focus, .select:focus, .textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .textarea { resize: vertical; min-height: 60px; }
    .hint     { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ============ ЭКРАН ВХОДА ============ */
    #login-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
    }
    .login-card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 32px;
        width: 100%;
        max-width: 400px;
    }
    .login-card h1 {
        font-size: 22px;
        text-align: center;
        margin-bottom: 24px;
    }
    .login-card h1 .icon {
        display: inline-block;
        background: var(--primary);
        color: white;
        width: 40px; height: 40px;
        border-radius: 10px;
        line-height: 40px;
        text-align: center;
        margin-right: 8px;
        font-size: 20px;
        vertical-align: middle;
    }
    .demo-box {
        margin-top: 20px;
        padding: 12px 14px;
        background: #f8fafc;
        border: 1px dashed var(--border);
        border-radius: 8px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
    }
    .demo-box b { color: var(--text); }
    .demo-box code {
        background: white;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
        color: var(--text);
        font-family: 'SFMono-Regular', Consolas, monospace;
    }

    .error-msg {
        background: #fef2f2;
        color: #991b1b;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 16px;
        border: 1px solid #fecaca;
    }

    /* ============ ШАПКА ПРИЛОЖЕНИЯ ============ */
    .app-header {
        background: white;
        border-bottom: 1px solid var(--border);
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 24px;
        height: 60px;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    .app-header .logo {
        font-weight: 700;
        font-size: 16px;
        color: var(--primary);
        white-space: nowrap;
    }
    .app-nav {
        display: flex;
        gap: 4px;
        flex: 1;
    }
    .app-nav button {
        padding: 8px 14px;
        background: transparent;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        color: var(--muted);
        cursor: pointer;
        transition: all .15s;
    }
    .app-nav button:hover    { background: #f1f5f9; color: var(--text); }
    .app-nav button.active   { background: rgba(37,99,235,.1); color: var(--primary); font-weight: 600; }
    .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--muted);
    }
    .user-info .name { color: var(--text); font-weight: 500; }
    .user-info .role {
        background: #f1f5f9;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    /* ============ КОНТЕНТ ============ */
    .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
    }
    .page-title { font-size: 22px; margin-bottom: 4px; }
    .page-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    /* ============ КАРТОЧКИ ============ */
    .card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 20px;
        overflow: hidden;
    }
    .card-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        font-size: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .card-body { padding: 20px; }
    .card-body.p-0 { padding: 0; }

    /* ============ ТАБЛИЦА ============ */
    .table-wrap { overflow-x: auto; }
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }
    thead th {
        text-align: left;
        padding: 12px 16px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .05em;
        color: var(--muted);
        background: #f8fafc;
        border-bottom: 1px solid var(--border);
    }
    tbody td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    .td-center { text-align: center; }
    .td-end    { text-align: right; }

    /* ============ БЕЙДЖИ ============ */
    .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .03em;
    }
    .badge-success   { background: #dcfce7; color: #166534; }
    .badge-warning   { background: #fef3c7; color: #92400e; }
    .badge-secondary { background: #e2e8f0; color: #475569; }

    /* ============ KPI ============ */
    .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
    }
    .kpi {
        background: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px 20px;
        border-left: 4px solid var(--primary);
    }
    .kpi.success { border-left-color: var(--success); }
    .kpi.warning { border-left-color: var(--warning); }
    .kpi .kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
    .kpi .kpi-value { font-size: 28px; font-weight: 700; }

    /* ============ ГРАФИКИ ============ */
    .charts-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }
    @media (max-width: 768px) {
        .charts-grid { grid-template-columns: 1fr; }
    }

    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
    .bar-label { width: 200px; flex-shrink: 0; color: var(--text); font-size: 12px; line-height: 1.2; }
    .bar-track { flex: 1; height: 20px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
    .bar-fill  { height: 100%; background: var(--primary); border-radius: 4px;
                 transition: width .4s ease; }
    .bar-value { width: 30px; text-align: right; font-weight: 600; font-size: 12px; }

    .donut-wrap { display: flex; align-items: center; gap: 20px; }
    .donut {
        width: 140px; height: 140px;
        border-radius: 50%;
        flex-shrink: 0;
        position: relative;
    }
    .donut::after {
        content: '';
        position: absolute;
        inset: 28px;
        background: white;
        border-radius: 50%;
    }
    .legend { font-size: 13px; line-height: 1.9; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    /* ============ ПРОГРЕСС-БАР ============ */
    .progress {
        height: 20px;
        background: #f1f5f9;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        min-width: 110px;
    }
    .progress-fill {
        height: 100%;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        color: white;
        transition: width .4s;
    }
    .progress-fill.success   { background: var(--success); }
    .progress-fill.warning   { background: var(--warning); }
    .progress-fill.danger    { background: var(--danger); }

    /* ============ УЧЕНИКИ СПИСКОМ ============ */
    .students-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
    }
    .student-chip {
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        background: #fafbfc;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .student-chip::before {
        content: '';
        width: 8px; height: 8px;
        background: var(--primary);
        border-radius: 50%;
        flex-shrink: 0;
    }

    /* ============ СООБЩЕНИЯ ============ */
    .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
    }
    .alert-success { background: #dcfce7; color: #166534; }
    .alert-error   { background: #fef2f2; color: #991b1b; }

    /* ============ ПУСТОЕ СОСТОЯНИЕ ============ */
    .empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
    }
</style>
</head>
<body>

<!-- ============================================================
     ЭКРАН 1: ВХОД
     ============================================================ -->
<div id="login-screen">
    <div class="login-card">
        <h1><span class="icon">✓</span> Учёт пропусков</h1>

        <div id="login-error" class="error-msg hidden"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="login-user">Логин</label>
                <input class="input" type="text" id="login-user"
                       required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="login-pass">Пароль</label>
                <input class="input" type="password" id="login-pass"
                       required autocomplete="current-password">
            </div>
            <button class="btn" style="width:100%; justify-content:center;" type="submit">
                Войти
            </button>
        </form>

        <div class="demo-box">
            <b>Демо-аккаунты (для проверки):</b><br>
            учитель: <code>teacher</code> / <code>teacher123</code><br>
            ученик:  <code>student</code> / <code>student123</code><br>
            админ:   <code>admin</code>   / <code>admin123</code>
        </div>
    </div>
</div>

<!-- ============================================================
     ЭКРАН 2: ПРИЛОЖЕНИЕ
     ============================================================ -->
<div id="app-screen" class="hidden">

    <header class="app-header">
        <div class="logo">✓ Учёт пропусков</div>

        <nav class="app-nav" id="app-nav"></nav>

        <div class="user-info">
            <span class="name" id="user-name"></span>
            <span class="role" id="user-role"></span>
            <button class="btn btn-ghost btn-sm" id="logout-btn">Выйти</button>
        </div>
    </header>

    <main class="container">
        <div id="page-home"></div>
        <div id="page-add"  class="hidden"></div>
        <div id="page-reports" class="hidden"></div>
    </main>
</div>

<script>
/* ================================================================
   1. ДЕМО-ДАННЫЕ
   ================================================================ */
const SEED = {
    students: [
        { id: 1, fullName: 'Иванов Иван Иванович',        className: '10А' },
        { id: 2, fullName: 'Петров Пётр Петрович',        className: '10А' },
        { id: 3, fullName: 'Сидорова Анна Сергеевна',     className: '10А' },
        { id: 4, fullName: 'Кузнецов Дмитрий Олегович',   className: '10А' },
        { id: 5, fullName: 'Смирнова Екатерина Павловна', className: '10А' },
        { id: 6, fullName: 'Морозов Артём Владимирович',  className: '10А' },
        { id: 7, fullName: 'Волкова Мария Андреевна',     className: '10А' },
        { id: 8, fullName: 'Соколов Никита Максимович',   className: '10А' }
    ],
    reasons: [
        { id: 1, name: 'Болезнь (есть справка)',   category: 'уважительная' },
        { id: 2, name: 'Семейные обстоятельства',  category: 'уважительная' },
        { id: 3, name: 'Соревнования / олимпиады', category: 'уважительная' },
        { id: 4, name: 'Медосмотр',                category: 'уважительная' },
        { id: 5, name: 'Без предупреждения',       category: 'неуважительная' },
        { id: 6, name: 'Опоздание',                category: 'неуважительная' },
        { id: 7, name: 'Самовольный уход',         category: 'неуважительная' },
        { id: 8, name: 'По заявлению родителей',   category: 'особая' }
    ],
    absences: []   // заполняется динамически относительно "сегодня"
};

const ACCOUNTS = {
    teacher: { password: 'teacher123', role: 'teacher', name: 'Иванова Мария Петровна', studentId: null },
    admin:   { password: 'admin123',   role: 'admin',   name: 'Администратор школы',   studentId: null },
    student: { password: 'student123', role: 'student', name: 'Иванов Иван Иванович',  studentId: 1    }
};

const STORAGE_KEY = 'school_absences_single_v1';
const SESSION_KEY = 'school_absences_session_v1';

/* ================================================================
   2. ХРАНИЛИЩЕ
   ================================================================ */
let state = null;
let session = null;

function dateOffset(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
}

function generateDemoAbsences() {
    // 15 пропусков за последние 30 дней
    return [
        { id: 1,  studentId: 1, date: dateOffset(-2),  reasonId: 1, comment: 'Справка от педиатра' },
        { id: 2,  studentId: 2, date: dateOffset(-3),  reasonId: 5, comment: '' },
        { id: 3,  studentId: 3, date: dateOffset(-3),  reasonId: 2, comment: 'Семейные обстоятельства' },
        { id: 4,  studentId: 2, date: dateOffset(-7),  reasonId: 6, comment: 'Опоздал на 15 минут' },
        { id: 5,  studentId: 4, date: dateOffset(-8),  reasonId: 3, comment: 'Олимпиада по физике' },
        { id: 6,  studentId: 1, date: dateOffset(-10), reasonId: 1, comment: '' },
        { id: 7,  studentId: 5, date: dateOffset(-11), reasonId: 2, comment: '' },
        { id: 8,  studentId: 7, date: dateOffset(-12), reasonId: 5, comment: '' },
        { id: 9,  studentId: 2, date: dateOffset(-15), reasonId: 5, comment: 'Без предупреждения' },
        { id: 10, studentId: 6, date: dateOffset(-16), reasonId: 8, comment: 'Поездка с родителями' },
        { id: 11, studentId: 3, date: dateOffset(-18), reasonId: 4, comment: 'Плановый медосмотр' },
        { id: 12, studentId: 8, date: dateOffset(-20), reasonId: 1, comment: '' },
        { id: 13, studentId: 2, date: dateOffset(-22), reasonId: 7, comment: '' },
        { id: 14, studentId: 5, date: dateOffset(-25), reasonId: 3, comment: 'Конкурс чтецов' },
        { id: 15, studentId: 1, date: dateOffset(-27), reasonId: 2, comment: '' }
    ];
}

function initStorage() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
        try { state = JSON.parse(raw); } catch { state = null; }
    }
    if (!state || !state.students) {
        state = JSON.parse(JSON.stringify(SEED));
        state.absences = generateDemoAbsences();
        save();
    }
}

function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ================================================================
   3. СЕССИЯ
   ================================================================ */
function loadSession() {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (raw) { try { session = JSON.parse(raw); } catch { session = null; } }
}

function saveSession() {
    if (session) sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    else sessionStorage.removeItem(SESSION_KEY);
}

/* ================================================================
   4. УТИЛИТЫ
   ================================================================ */
function esc(str) {
    return String(str).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
}

function getStudent(id) { return state.students.find(s => s.id === id); }
function getReason(id)  { return state.reasons.find(r => r.id === id); }

function categoryBadge(cat) {
    if (cat === 'уважительная')    return '<span class="badge badge-success">уважительная</span>';
    if (cat === 'неуважительная')  return '<span class="badge badge-warning">неуважительная</span>';
    return '<span class="badge badge-secondary">' + esc(cat) + '</span>';
}

function formatDate(iso) {
    const [y, m, d] = iso.split('-');
    return d + '.' + m + '.' + y;
}

function workdaysBetween(fromIso, toIso) {
    const from = new Date(fromIso), to = new Date(toIso);
    let count = 0;
    const d = new Date(from);
    while (d <= to) {
        const day = d.getDay();
        if (day !== 0 && day !== 6) count++;
        d.setDate(d.getDate() + 1);
    }
    return count;
}

/* ================================================================
   5. РЕНДЕР: ЛОГИН
   ================================================================ */
function renderLogin() {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
    document.getElementById('login-error').classList.add('hidden');
    document.getElementById('login-form').reset();
}

function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;

    const acc = ACCOUNTS[user];
    const err = document.getElementById('login-error');

    if (!acc || acc.password !== pass) {
        err.textContent = 'Неверный логин или пароль';
        err.classList.remove('hidden');
        return;
    }

    session = { username: user, role: acc.role, name: acc.name, studentId: acc.studentId };
    saveSession();
    renderApp();
}

function handleLogout() {
    session = null;
    saveSession();
    renderLogin();
}

/* ================================================================
   6. РЕНДЕР: ПРИЛОЖЕНИЕ
   ================================================================ */
let currentPage = 'home';

function renderApp() {
    if (!session) { renderLogin(); return; }

    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');

    document.getElementById('user-name').textContent = session.name;
    document.getElementById('user-role').textContent = session.role;

    renderNav();
    renderPage(currentPage);
}

function renderNav() {
    const nav = document.getElementById('app-nav');
    const isTeacher = session.role === 'teacher' || session.role === 'admin';

    const tabs = isTeacher
        ? [ ['home','Главная'], ['add','Добавить пропуск'], ['reports','Отчёты'] ]
        : [ ['home','Мои пропуски'] ];

    nav.innerHTML = tabs.map(([key, label]) => `
        <button data-page="${key}" class="${currentPage === key ? 'active' : ''}">
            ${esc(label)}
        </button>
    `).join('');

    nav.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
            currentPage = btn.dataset.page;
            renderApp();
        });
    });
}

function renderPage(page) {
    document.getElementById('page-home').classList.add('hidden');
    document.getElementById('page-add').classList.add('hidden');
    document.getElementById('page-reports').classList.add('hidden');

    if (page === 'add' && (session.role === 'teacher' || session.role === 'admin')) {
        document.getElementById('page-add').classList.remove('hidden');
        renderAddPage();
    } else if (page === 'reports' && (session.role === 'teacher' || session.role === 'admin')) {
        document.getElementById('page-reports').classList.remove('hidden');
        renderReportsPage();
    } else {
        document.getElementById('page-home').classList.remove('hidden');
        renderHomePage();
    }
}

/* ================================================================
   7. ГЛАВНАЯ СТРАНИЦА
   ================================================================ */
function renderHomePage() {
    if (session.role === 'student') renderStudentHome();
    else renderTeacherHome();
}

function renderStudentHome() {
    const student = getStudent(session.studentId);
    const absences = state.absences
        .filter(a => a.studentId === session.studentId)
        .sort((a, b) => b.date.localeCompare(a.date));

    const el = document.getElementById('page-home');
    el.innerHTML = `
        <h1 class="page-title">Мои пропуски</h1>
        <p class="page-subtitle">${esc(student.fullName)} · класс ${esc(student.className)}</p>

        <div class="card">
            <div class="card-body p-0">
                ${absences.length ? `
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th>Дата</th><th>Причина</th><th>Категория</th><th>Комментарий</th>
                        </tr></thead>
                        <tbody>
                            ${absences.map(a => {
                                const r = getReason(a.reasonId);
                                return `<tr>
                                    <td>${formatDate(a.date)}</td>
                                    <td>${esc(r.name)}</td>
                                    <td>${categoryBadge(r.category)}</td>
                                    <td>${a.comment ? esc(a.comment) : '—'}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                ` : '<div class="empty">У вас нет пропусков. Так держать! 🎉</div>'}
            </div>
        </div>
    `;
}

function renderTeacherHome() {
    const absences = [...state.absences].sort((a, b) => b.date.localeCompare(a.date));

    const el = document.getElementById('page-home');
    el.innerHTML = `
        <h1 class="page-title">Панель класса</h1>
        <p class="page-subtitle">Всего учеников: ${state.students.length} ·
           записей о пропусках: ${state.absences.length}</p>

        <div class="card">
            <div class="card-header">
                <span>Последние пропуски</span>
                <button class="btn btn-sm" id="go-add-btn">+ Добавить</button>
            </div>
            <div class="card-body p-0">
                ${absences.length ? `
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th>Дата</th><th>Ученик</th><th>Причина</th>
                            <th>Категория</th><th>Комментарий</th><th></th>
                        </tr></thead>
                        <tbody>
                            ${absences.map(a => {
                                const s = getStudent(a.studentId);
                                const r = getReason(a.reasonId);
                                return `<tr>
                                    <td>${formatDate(a.date)}</td>
                                    <td>${esc(s.fullName)}</td>
                                    <td>${esc(r.name)}</td>
                                    <td>${categoryBadge(r.category)}</td>
                                    <td style="color:var(--muted);font-size:13px;">${a.comment ? esc(a.comment) : ''}</td>
                                    <td class="td-end">
                                        <button class="btn btn-ghost btn-sm delete-btn"
                                                data-id="${a.id}" title="Удалить">✕</button>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                ` : '<div class="empty">Пока нет записей о пропусках.</div>'}
            </div>
        </div>

        <div class="card">
            <div class="card-header">Ученики класса</div>
            <div class="card-body">
                <div class="students-grid">
                    ${state.students.map(s =>
                        `<div class="student-chip">${esc(s.fullName)}</div>`
                    ).join('')}
                </div>
            </div>
        </div>
    `;

    document.getElementById('go-add-btn').addEventListener('click', () => {
        currentPage = 'add';
        renderApp();
    });

    el.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {

            const id = Number(btn.dataset.id);

/* ================================================================
   8. СТРАНИЦА ДОБАВЛЕНИЯ
   ================================================================ */
function renderAddPage() {
    const today = new Date().toISOString().slice(0, 10);
    const el = document.getElementById('page-add');

    el.innerHTML = `
        <h1 class="page-title">Добавить пропуск</h1>
        <p class="page-subtitle">Выберите ученика, дату и причину</p>

        <div class="card" style="max-width:600px;">
            <div class="card-body">
                <div id="add-msg"></div>
                <form id="add-form">
                    <div class="form-group">
                        <label class="form-label">Ученик *</label>
                        <select class="select" name="studentId" required>
                            <option value="">— выберите ученика —</option>
                            ${state.students.map(s =>
                                `<option value="${s.id}">${esc(s.fullName)}</option>`
                            ).join('')}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Дата *</label>
                        <input class="input" type="date" name="date" value="${today}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Причина *</label>
                        <select class="select" name="reasonId" required>
                            <option value="">— выберите причину —</option>
                            ${state.reasons.map(r =>
                                `<option value="${r.id}">[${esc(r.category)}] ${esc(r.name)}</option>`
                            ).join('')}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Комментарий</label>
                        <textarea class="textarea" name="comment"
                                  placeholder="Необязательно"></textarea>
                    </div>

                    <button class="btn" type="submit">Сохранить</button>
                </form>
            </div>
        </div>
    `;

    document.getElementById('add-form').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const studentId = Number(fd.get('studentId'));
        const reasonId  = Number(fd.get('reasonId'));
        const date      = fd.get('date');
        const comment   = (fd.get('comment') || '').trim();

        if (!studentId || !reasonId || !date) return;

        const newId = state.absences.reduce((max, a) => Math.max(max, a.id), 0) + 1;
        state.absences.push({ id: newId, studentId, reasonId, date, comment });
        save();

        document.getElementById('add-msg').innerHTML =
            '<div class="alert alert-success">Пропуск добавлен</div>';
        e.target.reset();
        e.target.querySelector('[name="date"]').value = today;
    });
}

/* ================================================================
   9. СТРАНИЦА ОТЧЁТОВ
   ================================================================ */
function renderReportsPage() {
    const end   = new Date();
    const start = new Date();
    start.setDate(start.getDate() - 29);

    const startIso = start.toISOString().slice(0, 10);
    const endIso   = end.toISOString().slice(0, 10);

    const filtered = state.absences.filter(a => a.date >= startIso && a.date <= endIso);

    const workdays = workdaysBetween(startIso, endIso);
    const totalAbsences = filtered.length;

    // Статистика по ученикам
    const perStudent = {};
    state.students.forEach(s => {
        perStudent[s.id] = { name: s.fullName, total: 0,
            'уважительная': 0, 'неуважительная': 0, 'особая': 0 };
    });
    filtered.forEach(a => {
        const ps = perStudent[a.studentId];
        const r = getReason(a.reasonId);
        if (!ps) return;
        ps.total++;
        ps[r.category] = (ps[r.category] || 0) + 1;
    });
    const studentStats = Object.values(perStudent).map(ps => {
        const percent = workdays > 0
            ? Math.max(0, ((workdays - ps.total) / workdays) * 100)
            : 100;
        return { ...ps, attendance: Math.round(percent * 10) / 10 };
    }).sort((a, b) => a.name.localeCompare(b.name));

    // Топ причин
    const reasonCount = {};
    filtered.forEach(a => {
        const r = getReason(a.reasonId);
        reasonCount[r.name] = (reasonCount[r.name] || 0) + 1;
    });
    const topReasons = Object.entries(reasonCount)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);

    // Категории
    const catCount = {};
    filtered.forEach(a => {
        const r = getReason(a.reasonId);
        catCount[r.category] = (catCount[r.category] || 0) + 1;
    });

    const el = document.getElementById('page-reports');
    el.innerHTML = `
        <h1 class="page-title">Отчёты</h1>
        <p class="page-subtitle">Период: ${formatDate(startIso)} — ${formatDate(endIso)}</p>

        <div class="kpi-grid">
            <div class="kpi">
                <div class="kpi-label">Рабочих дней</div>
                <div class="kpi-value">${workdays}</div>
            </div>
            <div class="kpi warning">
                <div class="kpi-label">Всего пропусков</div>
                <div class="kpi-value">${totalAbsences}</div>
            </div>
            <div class="kpi success">
                <div class="kpi-label">Учеников</div>
                <div class="kpi-value">${state.students.length}</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="card" style="margin-bottom:0;">
                <div class="card-header">Топ причин</div>
                <div class="card-body">
                    ${topReasons.length
                        ? barsHTML(topReasons)
                        : '<div class="empty">Нет данных за период</div>'}
                </div>
            </div>
            <div class="card" style="margin-bottom:0;">
                <div class="card-header">Категории</div>
                <div class="card-body">
                    ${Object.keys(catCount).length
                        ? donutHTML(catCount)
                        : '<div class="empty">Нет данных за период</div>'}
                </div>
            </div>
        </div>

        <div style="margin-bottom:20px; text-align:right;">
            <button class="btn btn-outline" id="export-btn">⬇ Экспорт в CSV</button>
        </div>

        <div class="card">
            <div class="card-header">Посещаемость учеников</div>
            <div class="card-body p-0">
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th>Ученик</th>
                            <th class="td-center">Пропусков</th>
                            <th class="td-center">Уваж.</th>
                            <th class="td-center">Неуваж.</th>
                            <th class="td-center">Особая</th>
                            <th>Посещаемость</th>
                        </tr></thead>
                        <tbody>
                            ${studentStats.map(s => {
                                const cls = s.attendance >= 90 ? 'success'
                                          : s.attendance >= 75 ? 'warning' : 'danger';
                                return `<tr>
                                    <td>${esc(s.name)}</td>
                                    <td class="td-center">${s.total}</td>
                                    <td class="td-center">${s['уважительная']}</td>
                                    <td class="td-center">${s['неуважительная']}</td>
                                    <td class="td-center">${s['особая']}</td>
                                    <td>
                                        <div class="progress">
                                            <div class="progress-fill ${cls}"
                                                 style="width:${s.attendance}%">
                                                ${s.attendance}%
                                            </div>
                                        </div>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    `;

    document.getElementById('export-btn').addEventListener('click', exportCSV);
}

function barsHTML(items) {
    const max = Math.max(...items.map(i => i[1]), 1);
    return items.map(([label, count]) => `
        <div class="bar-row">
            <div class="bar-label">${esc(label)}</div>
            <div class="bar-track">
                <div class="bar-fill" style="width:${(count / max) * 100}%"></div>
            </div>
            <div class="bar-value">${count}</div>
        </div>
    `).join('');
}

function donutHTML(catCount) {
    const colors = {
        'уважительная':   '#16a34a',
        'неуважительная': '#f59e0b',
        'особая':         '#6b7280'
    };
    const total = Object.values(catCount).reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    const segments = [];
    Object.entries(catCount).forEach(([cat, count]) => {
        const from = (acc / total) * 360;
        acc += count;
        const to = (acc / total) * 360;
        segments.push(`${colors[cat] || '#cbd5e1'} ${from}deg ${to}deg`);
    });
    const gradient = `conic-gradient(${segments.join(',')})`;

    const legend = Object.entries(catCount).map(([cat, count]) => `
        <div class="legend-item">
            <span class="legend-dot" style="background:${colors[cat] || '#cbd5e1'};"></span>
            <span>${esc(cat)}: <b>${count}</b></span>
        </div>
    `).join('');

    return `
        <div class="donut-wrap">
            <div class="donut" style="background:${gradient};"></div>
            <div class="legend">${legend}</div>
        </div>
    `;
}

/* ================================================================
   10. ЭКСПОРТ В CSV
   ================================================================ */
function exportCSV() {
    const rows = [['Ученик', 'Дата', 'Причина', 'Категория', 'Комментарий']];
    [...state.absences]
        .sort((a, b) => b.date.localeCompare(a.date))
        .forEach(a => {
            const s = getStudent(a.studentId);
            const r = getReason(a.reasonId);
            rows.push([s.fullName, a.date, r.name, r.category, a.comment || '']);
        });

    const csv = '\ufeff' + rows.map(row =>
        row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';')
    ).join('\r\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'absences_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
