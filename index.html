<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Посещаемость</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232563eb'/><stop offset='1' stop-color='%231d4ed8'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><path d='M28 52 l16 16 l30 -34' stroke='white' stroke-width='11' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--primary:#2563eb;--primary-d:#1d4ed8;--primary-l:#dbeafe;--bg:#f4f6fb;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--success:#16a34a;--success-l:#dcfce7;--warning:#f59e0b;--warning-l:#fef3c7;--danger:#dc2626;--danger-l:#fee2e2;--secondary:#6b7280;--director:#7c3aed;--deputy:#db2777;--admin:#0891b2;--parent:#ea580c;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-hover:0 10px 30px rgba(15,23,42,.09)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#f4f6fb 0%,#eef2f9 100%);color:var(--text);line-height:1.5;min-height:100vh}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,99,235,.35)}
.btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary);box-shadow:none}
.btn-danger{background:linear-gradient(135deg,var(--danger) 0%,#b91c1c 100%)}
.btn-success{background:linear-gradient(135deg,var(--success) 0%,#15803d 100%)}
.btn-warning{background:linear-gradient(135deg,var(--warning) 0%,#d97706 100%)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);box-shadow:none}
.btn-ghost:hover{background:#f1f5f9;color:var(--text);transform:none;box-shadow:none}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-block{width:100%}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.input,.select,.textarea{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:9px;background:#fff;font-size:14px;font-family:inherit;color:var(--text);transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.input:disabled,.select:disabled{background:#f8fafc;color:var(--muted);cursor:not-allowed}
.textarea{resize:vertical;min-height:60px}
.checkbox-line{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fef3c7;border-radius:8px;font-size:13px;border:1px solid #fde68a;margin-top:6px;cursor:pointer}
.checkbox-line input[type=checkbox]{width:18px;height:18px;accent-color:var(--warning);cursor:pointer}
.checkbox-line.error{background:#fee2e2;border-color:#fecaca}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;gap:16px}
.login-card{background:var(--card);border-radius:16px;box-shadow:0 10px 40px rgba(15,23,42,.08);padding:36px 32px;width:100%;max-width:440px}
.login-card h1{font-size:22px;text-align:center;margin-bottom:26px;font-weight:700}
.login-card h1 .icon{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);color:#fff;width:42px;height:42px;border-radius:12px;margin-right:10px;font-size:22px;vertical-align:middle;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.login-card h1 .icon.warn{background:linear-gradient(135deg,var(--warning) 0%,#d97706 100%)}
.demo-box{margin-top:22px;padding:14px 16px;background:#f8fafc;border:1px dashed var(--border);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.9}
.demo-box b{color:var(--text)}
.demo-box code{background:#fff;padding:1px 7px;border-radius:5px;border:1px solid var(--border);color:var(--text);font-family:monospace;font-size:11px}
.error-msg{background:var(--danger-l);color:#991b1b;padding:11px 15px;border-radius:9px;font-size:13px;margin-bottom:16px;border:1px solid #fecaca}
.link-text{font-size:13px;color:var(--primary);text-decoration:none;cursor:pointer}
.link-text:hover{text-decoration:underline}
.app-header{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:24px;height:62px;position:sticky;top:0;z-index:100}
.app-header .logo{font-weight:800;font-size:17px;white-space:nowrap;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:8px}
.app-header .logo-mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);color:#fff;font-size:16px}
.app-nav{display:flex;gap:4px;flex:1;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.app-nav::-webkit-scrollbar{display:none}
.app-nav button{padding:8px 15px;background:transparent;border:none;border-radius:9px;font-size:14px;font-family:inherit;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:500}
.app-nav button:hover{background:#f1f5f9;color:var(--text)}
.app-nav button.active{background:rgba(37,99,235,.12);color:var(--primary);font-weight:600}
.app-nav button .tab-badge{display:inline-block;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:999px;margin-left:6px;font-weight:700}
.user-info{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.user-info .name{color:var(--text);font-weight:600}
.user-info .role{padding:3px 10px;border-radius:6px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.role-director{background:#f3e8ff;color:var(--director)}.role-deputy{background:#fce7f3;color:var(--deputy)}.role-teacher{background:var(--primary-l);color:var(--primary)}.role-student{background:var(--success-l);color:var(--success)}.role-admin{background:#cffafe;color:var(--admin)}.role-parent{background:#fed7aa;color:var(--parent)}
.container{max-width:1200px;margin:0 auto;padding:24px}
.page-title{font-size:24px;margin-bottom:4px;font-weight:700}
.page-subtitle{color:var(--muted);font-size:14px;margin-bottom:24px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow-hover)}
.card-header{padding:15px 22px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card-body{padding:22px}.card-body.p-0{padding:0}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{text-align:left;padding:12px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f8fafc;border-bottom:1px solid var(--border)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:#f8fafc}
.td-center{text-align:center}.td-end{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.badge-success{background:var(--success-l);color:#166534}.badge-warning{background:var(--warning-l);color:#92400e}.badge-secondary{background:#e2e8f0;color:#475569}.badge-danger{background:var(--danger-l);color:#991b1b}.badge-info{background:var(--primary-l);color:#1e40af}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;border-left:4px solid var(--primary)}
.kpi.success{border-left-color:var(--success)}.kpi.warning{border-left-color:var(--warning)}.kpi.danger{border-left-color:var(--danger)}.kpi.director{border-left-color:var(--director)}.kpi.deputy{border-left-color:var(--deputy)}.kpi.admin{border-left-color:var(--admin)}.kpi.parent{border-left-color:var(--parent)}
.kpi .kpi-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.kpi .kpi-value{font-size:28px;font-weight:800}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar-label{width:200px;flex-shrink:0;font-size:12px;line-height:1.3}
.bar-track{flex:1;height:20px;background:#f1f5f9;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--primary) 0%,#3b82f6 100%);border-radius:5px;transition:width .4s}
.bar-value{width:30px;text-align:right;font-weight:700;font-size:12px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:130px;height:130px;border-radius:50%;flex-shrink:0;position:relative}
.donut::after{content:'';position:absolute;inset:26px;background:#fff;border-radius:50%}
.legend{font-size:13px;line-height:1.9}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.progress{height:22px;background:#f1f5f9;border-radius:999px;overflow:hidden;position:relative;min-width:110px}
.progress-fill{height:100%;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:width .4s;white-space:nowrap;padding:0 6px}
.progress-fill.success{background:linear-gradient(90deg,var(--success) 0%,#22c55e 100%)}.progress-fill.warning{background:linear-gradient(90deg,var(--warning) 0%,#fbbf24 100%)}.progress-fill.danger{background:linear-gradient(90deg,var(--danger) 0%,#f87171 100%)}
.alert{padding:13px 17px;border-radius:10px;margin-bottom:16px;font-size:14px}
.alert-success{background:var(--success-l);color:#166534}.alert-error{background:var(--danger-l);color:#991b1b}.alert-info{background:var(--primary-l);color:#1e40af}.alert-warning{background:var(--warning-l);color:#92400e}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .empty-icon{font-size:42px;opacity:.4}
.section-title{font-size:16px;font-weight:700;margin:24px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.inline-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.inline-form .form-group{margin-bottom:0}
.log-entry{padding:11px 17px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:14px;align-items:flex-start}
.log-time{color:var(--muted);font-size:12px;white-space:nowrap;min-width:135px;font-family:monospace}
.log-user{font-weight:700}
.day-section{margin-bottom:20px}.day-header{font-weight:700;font-size:15px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between}
.lesson-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#f8fafc;border-radius:8px;margin-bottom:6px;font-size:14px}
.lesson-num{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);color:#fff;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.lesson-time{color:var(--muted);font-size:13px;font-family:monospace;min-width:105px}
.lesson-subject{font-weight:600;flex:1}
.lesson-teacher{color:var(--muted);font-size:13px}
.status-switch{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.status-switch button{padding:6px 10px;border:none;background:transparent;font-size:12px;font-family:inherit;cursor:pointer;color:var(--muted);font-weight:500}
.status-switch button.active-present{background:var(--success);color:#fff}
.status-switch button.active-late{background:var(--warning);color:#fff}
.status-switch button.active-absent{background:var(--danger);color:#fff}
.attendance-row.row-absent{background:var(--danger-l)!important}
.attendance-row.row-late{background:var(--warning-l)!important}
.quick-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px;padding:16px 18px;background:linear-gradient(135deg,#eff6ff 0%,#e0e7ff 100%);border-radius:10px;font-size:13px}
.qi-label{color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.qi-value{font-weight:700;font-size:16px}
.calendar-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.calendar-month{font-size:18px;font-weight:700}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-header{font-size:11px;text-align:center;padding:10px 4px;color:var(--muted);font-weight:700;text-transform:uppercase}
.cal-day{min-height:78px;padding:8px;border-radius:9px;background:#f8fafc;cursor:pointer;display:flex;flex-direction:column;font-size:13px;border:2px solid transparent}
.cal-day.other-month{opacity:.35}
.cal-day.today{background:var(--primary-l);border-color:var(--primary)}
.cal-day.selected{border-color:var(--primary-d);background:rgba(37,99,235,.14)}
.cal-day:hover:not(.other-month){box-shadow:var(--shadow)}
.cal-day .day-num{font-weight:700;margin-bottom:6px}
.cal-day .cal-badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.cal-day .cal-badge{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--danger);color:#fff;font-weight:700}
.cal-day .cal-badge.pending{background:var(--warning)}
.cal-day .cal-badge.late{background:#f97316}
.request-card{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.request-main{flex:1;min-width:200px}
.request-name{font-weight:700;margin-bottom:3px}
.request-meta{font-size:12px;color:var(--muted)}
.request-actions{display:flex;gap:6px}
.cert-cell{font-size:12px}
.cert-yes{color:var(--success);font-weight:700}.cert-no{color:var(--danger);font-weight:700}.cert-na{color:var(--muted)}
.sync-status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}
.sync-on{background:var(--success-l);color:#166534}.sync-wait{background:var(--warning-l);color:#92400e}.sync-off{background:var(--danger-l);color:#991b1b}
.qr-box{text-align:center;padding:24px;background:#f8fafc;border-radius:12px;border:2px dashed var(--border);margin:16px 0}
.qr-url{font-family:monospace;font-size:11px;color:var(--muted);word-break:break-all;margin-top:12px}
.qr-timer{display:inline-flex;padding:6px 14px;border-radius:999px;background:var(--warning-l);color:#92400e;font-weight:700;font-size:13px;margin-top:12px}
.sig-pad{position:relative;border:2px dashed var(--border);border-radius:10px;background:#fafbfc;width:100%;height:140px;touch-action:none;cursor:crosshair}
.sig-pad canvas{display:block;border-radius:8px}
.sig-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;pointer-events:none;font-style:italic}
.sig-pad.signed .sig-hint{display:none}
.sig-actions{display:flex;gap:8px;margin-top:8px}
.sig-thumb{max-width:200px;max-height:60px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:4px}
.bells-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.bell-card{padding:12px 14px;background:#f8fafc;border-radius:9px;border-left:3px solid var(--primary);font-size:13px}
.bell-num{font-weight:800;font-size:15px;margin-bottom:4px;color:var(--primary)}
.bell-time{font-family:monospace;font-weight:600}
.quarter-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.quarter-btns button{padding:7px 14px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text)}
.quarter-btns button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.late-tag{display:inline-block;padding:2px 8px;border-radius:5px;background:#fed7aa;color:#9a3412;font-size:11px;font-weight:700}
#debug-panel{position:fixed;bottom:0;left:0;right:0;background:#1e293b;color:#e2e8f0;font-family:monospace;font-size:11px;padding:8px 12px;max-height:120px;overflow-y:auto;z-index:10000;display:none}
#debug-panel.show{display:block}
@media(max-width:768px){
.container{padding:12px}.app-header{padding:0 12px;gap:8px;height:54px}.app-header .logo{font-size:14px}.app-nav button{padding:6px 11px;font-size:13px}
.user-info .name{display:none}.user-info .role{font-size:9px;padding:2px 6px}.page-title{font-size:19px}
.kpi-value{font-size:22px!important}.login-card{padding:24px 20px}.card-body{padding:14px}.card-header{padding:12px 14px;font-size:14px}
thead th{padding:8px 10px;font-size:10px}tbody td{padding:10px;font-size:13px}
.btn{padding:8px 12px;font-size:13px}.inline-form{grid-template-columns:1fr!important}.charts-grid{grid-template-columns:1fr}
.cal-day{min-height:50px;padding:4px;font-size:11px}.cal-day .day-num{font-size:11px}
.cal-day .cal-badge{font-size:9px;padding:0 4px}.cal-header{padding:6px 2px;font-size:10px}
.request-card{flex-direction:column;align-items:stretch}.request-actions{justify-content:stretch}.request-actions .btn{flex:1}
.input,.select,.textarea{font-size:16px}
}
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-card" id="login-main">
        <h1><span class="icon">✓</span> Посещаемость</h1>
        <div id="login-error" class="error-msg hidden"></div>
        <div id="login-status" style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px;"></div>
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="login-user">Логин</label>
                <input class="input" type="text" id="login-user" required autofocus autocomplete="username" placeholder="teacher">
            </div>
            <div class="form-group">
                <label class="form-label" for="login-pass">Пароль</label>
                <input class="input" type="password" id="login-pass" required autocomplete="current-password" placeholder="teacher123">
            </div>
            <button class="btn btn-block" type="submit" id="login-submit">Войти</button>
        </form>
        <div style="text-align:center;margin-top:14px">
            <a href="#" id="forgot-link" class="link-text">Забыли пароль?</a>
        </div>
        <div class="demo-box">
            <b>Демо-аккаунты:</b><br>
            администратор: <code>admin / admin123</code><br>
            директор: <code>director / director123</code><br>
            завуч: <code>deputy / deputy123</code><br>
            учитель: <code>teacher / teacher123</code><br>
            ученик: <code>student / student123</code><br>
            родитель: <code>parent / parent123</code>
        </div>
    </div>
    <div class="login-card hidden" id="forgot-card">
        <h1><span class="icon warn">?</span> Восстановление</h1>
        <div id="forgot-step1">
            <div class="form-group">
                <label class="form-label">Логин</label>
                <input class="input" id="forgot-user" placeholder="например, teacher">
            </div>
            <button class="btn btn-block" id="forgot-gen-btn">Получить код</button>
        </div>
        <div id="forgot-step2" class="hidden">
            <div id="forgot-code-info" style="margin-bottom:16px"></div>
            <div class="form-group">
                <label class="form-label">Код</label>
                <input class="input" id="forgot-code" placeholder="6 цифр" maxlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">Новый пароль</label>
                <input class="input" type="password" id="forgot-newpass">
            </div>
            <div class="form-group">
                <label class="form-label">Повторите пароль</label>
                <input class="input" type="password" id="forgot-newpass2">
            </div>
            <button class="btn btn-success btn-block" id="forgot-save-btn">Сбросить пароль</button>
        </div>
        <div id="forgot-msg" style="margin-top:12px"></div>
        <div style="text-align:center;margin-top:18px">
            <a href="#" id="back-to-login" class="link-text">← Вернуться ко входу</a>
        </div>

/* ============ ХЭШИРОВАНИЕ (с fallback) ============ */
function simpleHash(str){
    const s=PASSWORD_SALT+str;
    let h1=0xdeadbeef,h2=0x41c6ce57;
    for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
    h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return ((h2>>>0).toString(16).padStart(8,'0'))+((h1>>>0).toString(16).padStart(8,'0'));
}
async function hashPassword(password){
    if(window.crypto&&window.crypto.subtle&&window.crypto.subtle.digest){
        try{
            const data=new TextEncoder().encode(PASSWORD_SALT+password);
            const buf=await window.crypto.subtle.digest('SHA-256',data);
            return 'sha256:'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
        }catch(e){console.warn('[hash] crypto.subtle упал:',e);}
    }
    return 'simple:'+simpleHash(password);
}
async function verifyPassword(input,stored){
    if(!stored)return false;
    if(stored.startsWith('sha256:')||stored.startsWith('simple:')){
        const computed=await hashPassword(input);
        return computed===stored;
    }
    return input===stored;
}

function nextId(arr){return arr.reduce((m,x)=>Math.max(m,x.id||0),0)+1;}
function formatDate(iso){if(!iso)return '';const[y,m,d]=iso.split('-');return d+'.'+m+'.'+y;}
function formatDateTime(ts){const d=new Date(ts);return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}

async function handleLogin(e){
    e.preventDefault();
    const err=document.getElementById('login-error');
    const submitBtn=document.getElementById('login-submit');
    try{
        submitBtn.disabled=true;submitBtn.textContent='Вход...';
        const username=document.getElementById('login-user').value.trim();
        const password=document.getElementById('login-pass').value;
        console.log('[login] state:',state?'OK':'null','| users:',state?.users?.length||0);
        if(!state){err.textContent='Данные загружаются. Подождите 2 сек и попробуйте снова.';err.classList.remove('hidden');return;}
        if(!state.users||state.users.length===0){err.textContent='База пуста — проверьте Firebase (F12)';err.classList.remove('hidden');return;}
        const user=state.users.find(u=>u.username===username);
        console.log('[login] найден:',user?.username||'нет');
        if(!user){err.textContent='Неверный логин или пароль';err.classList.remove('hidden');return;}
        console.log('[login] stored hash type:',(user.password||'').split(':')[0]||'plain');
        const ok=await verifyPassword(password,user.password);
        console.log('[login] пароль верный:',ok);
        if(!ok){err.textContent='Неверный логин или пароль';err.classList.remove('hidden');return;}
        if(!user.password.startsWith('sha256:')&&!user.password.startsWith('simple:')){
            user.password=await hashPassword(password);save();
        }
        session={userId:user.id,role:user.role,name:user.name,username:user.username,studentId:user.studentId||null};
        saveSession();
        logAction('Вход в систему');
        err.classList.add('hidden');
        renderApp();
        if(pendingCheckin)processCheckin(pendingCheckin);
    }catch(ex){
        console.error('[login] ОШИБКА:',ex);
        err.textContent='Ошибка входа: '+ex.message+' — смотрите F12 Console';
        err.classList.remove('hidden');
    }finally{
        submitBtn.disabled=false;submitBtn.textContent='Войти';
    }
}

/* ============ QR CHECKIN ============ */
function processCheckin(token){
    pendingCheckin=null;
    const rec=state.qrTokens.find(t=>t.token===token);
    if(!rec){showToast('QR не найден','error');return;}
    if(rec.expiresAt<Date.now()){showToast('QR истёк','error');return;}
    if(session.role!=='student'){showToast('Только для ученика','error');return;}
    const student=getStudent(session.studentId);
    if(!student||student.classId!==rec.classId){showToast('QR для другого класса','error');return;}
    const today=new Date().toISOString().slice(0,10);
    if(rec.date!==today){showToast('QR не на сегодня','error');return;}
    if(state.checkins.find(c=>c.studentId===session.studentId&&c.date===today&&c.classId===rec.classId)){showToast('Вы уже отметились','info');return;}
    const now=new Date();const nowTime=now.toTimeString().slice(0,5);
    const firstBell=[...state.bells].sort((a,b)=>a.n-b.n)[0];
    const isLate=firstBell&&nowTime>firstBell.start;
    state.checkins.push({id:nextId(state.checkins),studentId:session.studentId,classId:rec.classId,token,date:today,time:nowTime,isLate});
    save();
    logAction(`QR: ${student.fullName}${isLate?' (опоздал)':''}`);
    showToast(`✓ Отметились${isLate?' (опоздание)':''} в ${nowTime}`,'success');
}
function showToast(message,type='info'){
    const colors={success:'var(--success)',error:'var(--danger)',warning:'var(--warning)',info:'var(--primary)'};
    const el=document.createElement('div');
    el.style.cssText=`position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${colors[type]};color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:10000;max-width:90vw;text-align:center`;
    el.textContent=message;
    document.body.appendChild(el);
    setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';},2500);
    setTimeout(()=>el.remove(),2900);
}

/* ============ ПОДПИСЬ ============ */
function createSignaturePad(padId,canvasId){
    const pad=document.getElementById(padId);
    const canvas=document.getElementById(canvasId);
    const dpr=window.devicePixelRatio||1;
    const rect=pad.getBoundingClientRect();
    canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
    const ctx=canvas.getContext('2d');
    ctx.scale(dpr,dpr);ctx.strokeStyle='#1e293b';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';
    let drawing=false,empty=true;
    const getPos=e=>{const r=canvas.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top};};
    const start=e=>{e.preventDefault();drawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);empty=false;pad.classList.add('signed');};
    const draw=e=>{if(!drawing)return;e.preventDefault();const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
    const end=()=>{drawing=false;};
    canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',draw);
    canvas.addEventListener('mouseup',end);canvas.addEventListener('mouseleave',end);
    canvas.addEventListener('touchstart',start,{passive:false});
    canvas.addEventListener('touchmove',draw,{passive:false});
    canvas.addEventListener('touchend',end);
    return{clear:()=>{ctx.clearRect(0,0,canvas.width,canvas.height);empty=true;pad.classList.remove('signed');},isEmpty:()=>empty,getDataUrl:()=>canvas.toDataURL('image/png')};
}

        if(!sigPad.isEmpty())state.signatures.push({id:nextId(state.signatures),absenceId:newId,dataUrl:sigPad.getDataUrl(),signerId:session.userId,signerName:session.name,type:'student-confirm',signedAt:Date.now()});
        save();logAction(`Заявка: ${formatDate(date)}`);
        document.getElementById('req-msg').innerHTML='<div class="alert alert-success">Отправлено</div>';
        e.target.reset();e.target.querySelector('[name="date"]').value=today;
        certWrap.classList.add('hidden');certCheck.checked=false;sigPad.clear();
        setTimeout(()=>renderMyRequestPage(),900);
    });
}

let quickAddState={classId:null,date:null};
function renderQuickAddPage(){
    const isTeacher=session.role==='teacher';

    if(!quickAddState.date)quickAddState.date=new Date().toISOString().slice(0,10);
    const cls=getClass(quickAddState.classId);

    const todayAbs=state.absences.filter(a=>a.date===date&&a.status==='approved'&&students.some(s=>s.id===a.studentId));

    document.getElementById('page-quick-add').innerHTML=`
        <h1 class="page-title">Посещаемость</h1>

        <div class="card"><div class="card-body">
            <div class="inline-form" style="grid-template-columns:${isTeacher?'1fr 1fr auto auto':'1fr 1fr 1fr auto auto'}">
            ${!isTeacher?`<div class="form-group"><label class="form-label">Класс</label><select class="select" id="qa-class">${allowedClasses.map(c=>`<option value="${c.id}" ${c.id===quickAddState.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}

            <div class="form-group"><button class="btn btn-success" id="qa-all-present">✓ Все присутствуют</button></div>
            <div class="form-group"><button class="btn btn-warning" id="qa-all-absent">✗ Все отсутствуют</button></div>
            </div></div></div>
        <div class="quick-info">
            <div><div class="qi-label">Класс</div><div class="qi-value">${esc(cls.name)}</div></div>
            <div><div class="qi-label">День</div><div class="qi-value">${esc(dayLabel)}</div></div>
            <div><div class="qi-label">Учеников</div><div class="qi-value">${students.length}</div></div>
            <div><div class="qi-label" style="color:var(--danger)">Отсутствуют</div><div class="qi-value" style="color:var(--danger)">${absCount}</div></div>
            <div><div class="qi-label" style="color:var(--warning)">Опоздали</div><div class="qi-value" style="color:var(--warning)">${lateCount}</div></div>
        </div>
        <div class="card"><div class="card-header"><span>Отметки на ${formatDate(date)}</span><button class="btn btn-sm btn-success" id="qa-save">💾 Сохранить</button></div>
        <div class="card-body p-0">${students.length?`<div class="table-wrap"><table><thead><tr><th>Ученик</th><th style="width:220px">Статус</th><th style="width:200px">Причина</th><th>Комментарий</th></tr></thead><tbody>${students.map(st=>{
            const ex=byStudent[st.id];const pend=pendByStudent[st.id];
            const status=ex?ex.type:'present';
            const pendBadge=pend?' <span class="badge badge-warning" style="margin-left:4px">заявка</span>':'';
            const exReason=ex?getReason(ex.reasonId):null;
            const needCert=exReason&&exReason.requiresCertificate;
            return`<tr class="attendance-row ${status==='absent'?'row-absent':status==='late'?'row-late':''}" data-row-sid="${st.id}">

                </div>${status==='late'?`<input type="time" class="input" style="margin-top:6px;padding:5px 8px;font-size:12px" data-late-for="${st.id}" value="${ex?.lateTime||new Date().toTimeString().slice(0,5)}">`:''}</td>
                <td><select class="select" data-reason-for="${st.id}" ${status!=='present'?'':'disabled'}><option value="">—</option>${state.reasons.map(r=>`<option value="${r.id}" ${ex&&ex.reasonId===r.id?'selected':''}>[${esc(r.category)}] ${esc(r.name)}</option>`).join('')}</select>
                <label class="checkbox-line ${needCert&&!ex?.hasCertificate?'error':''}" data-cert-line-for="${st.id}" style="display:${needCert?'flex':'none'}"><input type="checkbox" data-cert-for="${st.id}" ${ex?.hasCertificate?'checked':''}><span>Справка</span></label></td>

    document.getElementById('qa-all-absent').onclick=()=>{if(!confirm('Всех отсутствующими?'))return;document.querySelectorAll('[data-switch]').forEach(sw=>updateRowStatus(Number(sw.dataset.switch),'absent'));};
    document.querySelectorAll('[data-switch] button').forEach(btn=>{btn.onclick=()=>{const sw=btn.closest('[data-switch]');updateRowStatus(Number(sw.dataset.switch),btn.dataset.status);};});
    document.querySelectorAll('[data-reason-for]').forEach(sel=>{sel.onchange=()=>{const sid=Number(sel.dataset.reasonFor);const r=getReason(Number(sel.value));const cl=document.querySelector(`[data-cert-line-for="${sid}"]`);const cc=document.querySelector(`[data-cert-for="${sid}"]`);if(cl){if(r&&r.requiresCertificate){cl.style.display='flex';cl.classList.toggle('error',!cc.checked);}else{cl.style.display='none';if(cc)cc.checked=false;}}};});
    document.querySelectorAll('[data-cert-for]').forEach(chk=>{chk.onchange=()=>{const sid=Number(chk.dataset.certFor);const line=document.querySelector(`[data-cert-line-for="${sid}"]`);if(line)line.classList.toggle('error',!chk.checked);};});
    document.getElementById('qa-save').onclick=()=>{

        document.querySelectorAll('[data-switch]').forEach(sw=>{const sid=Number(sw.dataset.switch);const active=sw.querySelector('button.active-absent, button.active-late');statuses[sid]=active?active.dataset.status:'present';});
        let err='';
        Object.entries(statuses).forEach(([sid,st])=>{
            if(st==='present')return;
            const reasonId=Number(document.querySelector(`[data-reason-for="${sid}"]`).value);
            if(!reasonId){err=`«${getStudent(Number(sid)).fullName}» — не выбрана причина`;return;}
            const r=getReason(reasonId);

        if(err){document.getElementById('qa-msg').innerHTML=`<div class="alert alert-error">${esc(err)}</div>`;return;}
        state.absences=state.absences.filter(a=>!(a.date===date&&students.some(s=>s.id===a.studentId)));
        let idC=nextId(state.absences);
        Object.entries(statuses).forEach(([sid,st])=>{
            if(st==='present')return;

            const lateInput=document.querySelector(`[data-late-for="${sid}"]`);

        });
        save();
        const absN=Object.values(statuses).filter(s=>s==='absent').length;
        const lateN=Object.values(statuses).filter(s=>s==='late').length;
        logAction(`Посещаемость ${cls.name} на ${formatDate(date)}: ${absN} отсутств., ${lateN} опозд.`);
        document.getElementById('qa-msg').innerHTML=`<div class="alert alert-success">Сохранено: ${absN} отсутств., ${lateN} опозд.</div>`;
        setTimeout(()=>renderQuickAddPage(),500);
    };
}
function updateRowStatus(sid,newStatus){
    const sw=document.querySelector(`[data-switch="${sid}"]`);if(!sw)return;
    sw.querySelectorAll('button').forEach(b=>{b.classList.remove('active-present','active-late','active-absent');if(b.dataset.status===newStatus)b.classList.add('active-'+newStatus);});
    const row=document.querySelector(`.attendance-row[data-row-sid="${sid}"]`);
    row.classList.remove('row-absent','row-late');
    if(newStatus==='absent')row.classList.add('row-absent');
    if(newStatus==='late')row.classList.add('row-late');
    const reasonSel=document.querySelector(`[data-reason-for="${sid}"]`);
    const commentInp=document.querySelector(`[data-comment-for="${sid}"]`);
    reasonSel.disabled=newStatus==='present';
    commentInp.disabled=newStatus==='present';
    if(newStatus==='present'){reasonSel.value='';const cl=document.querySelector(`[data-cert-line-for="${sid}"]`);if(cl)cl.style.display='none';}
    const reasonCell=reasonSel.closest('td').previousElementSibling;
    let lateInput=document.querySelector(`[data-late-for="${sid}"]`);
    if(newStatus==='late'&&!lateInput){const inp=document.createElement('input');inp.type='time';inp.className='input';inp.style.cssText='margin-top:6px;padding:5px 8px;font-size:12px';inp.dataset.lateFor=sid;inp.value=new Date().toTimeString().slice(0,5);reasonCell.querySelector('.status-switch').after(inp);}
    else if(newStatus!=='late'&&lateInput)lateInput.remove();
}

            <div class="form-group"><button class="btn" id="qr-generate">🔄 Обновить QR</button></div>
        </div></div></div>

        <div class="card"><div class="card-header">Отметились (${checkins.length})</div><div class="card-body p-0">${checkins.length?`<div class="table-wrap"><table><thead><tr><th>Ученик</th><th>Время</th><th>Статус</th></tr></thead><tbody>${checkins.sort((a,b)=>a.time.localeCompare(b.time)).map(c=>{const st=getStudent(c.studentId);return`<tr><td>${esc(st?.fullName||'—')}</td><td>${esc(c.time)}</td><td>${c.isLate?'<span class="late-tag">опоздал</span>':'<span class="badge badge-success">вовремя</span>'}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty">Никто ещё не отметился</div>'}</div></div>`;
    document.getElementById('qr-class').onchange=e=>{quickAddState.classId=Number(e.target.value);renderQRPage();};
    document.getElementById('qr-generate').onclick=()=>generateQRToken(clsId);
    generateQRToken(clsId);

function generateQRToken(classId){
    const today=new Date().toISOString().slice(0,10);
    state.qrTokens=state.qrTokens.filter(t=>!(t.classId===classId&&t.date===today));
    const token=Math.random().toString(36).substring(2,15)+Math.random().toString(36).substring(2,10);
    const expiresAt=Date.now()+5*60*1000;
    state.qrTokens.push({token,classId,date:today,expiresAt,createdBy:session.userId});
    save();
    const baseUrl=window.location.href.split('?')[0];
    const checkinUrl=baseUrl+'?checkin='+token;
    const el=document.getElementById('qr-code');
    if(!el)return;
    el.innerHTML='';
    try{
        new QRCode(el,{text:checkinUrl,width:240,height:240,colorDark:'#1e293b',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
        document.getElementById('qr-info').innerHTML=`<div class="qr-timer">⏱ Действует 5 минут</div><div class="qr-url">${esc(checkinUrl)}</div>`;
        if(qrRefreshTimer)clearTimeout(qrRefreshTimer);
        qrRefreshTimer=setTimeout(()=>{if(currentPage==='qr')generateQRToken(classId);},5*60*1000);
    }catch(err){el.innerHTML='<div class="alert alert-error">QR не создан. Проверьте интернет.</div>';}
}

/* ============ КАЛЕНДАРЬ ============ */
let calState={year:null,month:null,selectedDay:null};
function renderCalendarPage(){
    const today=new Date();
    if(calState.year===null)calState.year=today.getFullYear();
    if(calState.month===null)calState.month=today.getMonth();
    const{year,month}=calState;
    let absences=state.absences;
    if(session.role==='student'||session.role==='parent')absences=absences.filter(a=>a.studentId===session.studentId);
    else if(session.role==='teacher'){const cls=getMyClass();if(cls){const ids=getStudentsOfClass(cls.id).map(s=>s.id);absences=absences.filter(a=>ids.includes(a.studentId));}}
    const byDate={};absences.forEach(a=>{if(!byDate[a.date])byDate[a.date]=[];byDate[a.date].push(a);});
    const first=new Date(year,month,1);
    const firstDW=(first.getDay()+6)%7;
    const dim=new Date(year,month+1,0).getDate();
    const dipm=new Date(year,month,0).getDate();
    const cells=[];
    for(let i=firstDW-1;i>=0;i--){const d=dipm-i;const m=month===0?11:month-1;const y=month===0?year-1:year;cells.push({day:d,month:m,year:y,otherMonth:true});}
    for(let d=1;d<=dim;d++)cells.push({day:d,month,year,otherMonth:false});
    while(cells.length%7!==0||cells.length<35){const idx=cells.length-firstDW-dim+1;const m=month===11?0:month+1;const y=month===11?year+1:year;cells.push({day:idx,month:m,year:y,otherMonth:true});}
    const todayIso=today.toISOString().slice(0,10);
    const cellsHTML=cells.map(cell=>{
        const iso=`${cell.year}-${String(cell.month+1).padStart(2,'0')}-${String(cell.day).padStart(2,'0')}`;
        const list=byDate[iso]||[];
        const a=list.filter(x=>x.type==='absent'&&x.status==='approved').length;
        const l=list.filter(x=>x.type==='late'&&x.status==='approved').length;
        const p=list.filter(x=>x.status==='pending').length;
        let b='';if(a)b+=`<span class="cal-badge">${a}</span>`;if(l)b+=`<span class="cal-badge late">${l}⏰</span>`;if(p)b+=`<span class="cal-badge pending">${p}?</span>`;
        return`<div class="cal-day ${cell.otherMonth?'other-month':''} ${iso===todayIso?'today':''} ${iso===calState.selectedDay?'selected':''}" data-date="${iso}"><div class="day-num">${cell.day}</div><div class="cal-badges">${b}</div></div>`;
    }).join('');
    let details='';
    if(calState.selectedDay){
        const list=byDate[calState.selectedDay]||[];
        if(list.length===0)details=`<div class="card"><div class="card-header">${formatDate(calState.selectedDay)}</div><div class="empty"><div class="empty-icon">✨</div>Пропусков нет</div></div>`;
        else details=`<div class="card"><div class="card-header">${formatDate(calState.selectedDay)} · ${list.length}</div><div class="card-body p-0"><div class="table-wrap"><table><thead><tr><th>Ученик</th><th>Класс</th><th>Тип</th><th>Причина</th><th>Справка</th><th>Статус</th></tr></thead><tbody>${list.map(a=>{const st=getStudent(a.studentId);const cls=st?getClass(st.classId):null;const r=getReason(a.reasonId);return`<tr><td>${esc(st?.fullName||'—')}</td><td><b>${esc(cls?.name||'—')}</b></td><td>${typeCell(a)||'<span class="badge badge-danger">пропуск</span>'}</td><td>${esc(r?.name||'—')}</td><td class="cert-cell">${certCell(a,r)}</td><td>${statusBadge(a.status)}</td></tr>`;}).join('')}</tbody></table></div></div></div>`;
    }
    document.getElementById('page-calendar').innerHTML=`
        <h1 class="page-title">Календарь</h1>
        <p class="page-subtitle">${session.role==='student'||session.role==='parent'?'Ваши пропуски':session.role==='teacher'?'Ваш класс':'Все'}</p>
        <div class="card"><div class="card-body">
            <div class="calendar-nav"><button class="btn btn-ghost btn-sm" id="cal-prev">←</button><div class="calendar-month">${MONTHS[month]} ${year}</div><button class="btn btn-ghost btn-sm" id="cal-next">→</button></div>
            <div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="cal-header">${d}</div>`).join('')}${cellsHTML}</div>
            <div style="margin-top:14px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap"><span><span class="cal-badge" style="display:inline-block">n</span> пропуски</span><span><span class="cal-badge late" style="display:inline-block">n⏰</span> опоздания</span><span><span class="cal-badge pending" style="display:inline-block">n?</span> на рассмотрении</span></div>
        </div></div>${details}`;
    document.getElementById('cal-prev').onclick=()=>{if(calState.month===0){calState.month=11;calState.year--;}else calState.month--;renderCalendarPage();};
    document.getElementById('cal-next').onclick=()=>{if(calState.month===11){calState.month=0;calState.year++;}else calState.month++;renderCalendarPage();};
    document.querySelectorAll('.cal-day').forEach(cell=>{cell.onclick=()=>{calState.selectedDay=cell.dataset.date;renderCalendarPage();};});
}

/* ============ РАСПИСАНИЕ ============ */
let schedState={classId:null};
function renderSchedulePage(){
    const isTeacher=session.role==='teacher';
    const isSP=session.role==='student'||session.role==='parent';

    if(!schedState.classId||!allowedClasses.some(c=>c.id===schedState.classId))schedState.classId=allowedClasses[0].id;
    const cls=getClass(schedState.classId);
    const teachers=allTeachers();
    const bells=[...state.bells].sort((a,b)=>a.n-b.n);
    let html=`<h1 class="page-title">Расписание · ${esc(cls.name)}</h1><p class="page-subtitle">${canEdit?'Редактирование':'Просмотр'}</p>`;

function barsHTML(items){const max=Math.max(...items.map(i=>i[1]),1);return items.map(([l,c])=>`<div class="bar-row"><div class="bar-label">${esc(l)}</div><div class="bar-track"><div class="bar-fill" style="width:${(c/max)*100}%"></div></div><div class="bar-value">${c}</div></div>`).join('');}
function donutHTML(cc){
    const colors={'уважительная':'#16a34a','неуважительная':'#f59e0b','особая':'#6b7280'};
    const total=Object.values(cc).reduce((a,b)=>a+b,0)||1;
    let acc=0;const seg=[];
    Object.entries(cc).forEach(([c,n])=>{const f=(acc/total)*360;acc+=n;const t=(acc/total)*360;seg.push(`${colors[c]||'#cbd5e1'} ${f}deg ${t}deg`);});
    const gradient=`conic-gradient(${seg.join(',')})`;
    const legend=Object.entries(cc).map(([c,n])=>`<div class="legend-item"><span class="legend-dot" style="background:${colors[c]||'#cbd5e1'}"></span><span>${esc(c)}: <b>${n}</b></span></div>`).join('');
    return`<div class="donut-wrap"><div class="donut" style="background:${gradient}"></div><div class="legend">${legend}</div></div>`;
}

function renderManagePage(){

    document.getElementById('page-manage').innerHTML=`
        <h1 class="page-title">Структура</h1>

        <div class="section-title">📚 Классы</div>
        <div class="card"><div class="card-body"><form id="form-add-class" class="inline-form"><div class="form-group"><label class="form-label">Название *</label><input class="input" name="name" placeholder="10В" required></div><div class="form-group"><label class="form-label">Кл.рук.</label><select class="select" name="teacherId"><option value="">—</option>${teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="form-group"><button class="btn" type="submit">+ Добавить</button></div></form></div><div class="card-body p-0"><div class="table-wrap"><table><thead><tr><th>Класс</th><th>Кл.рук.</th><th class="td-center">Уч.</th><th></th></tr></thead><tbody>${cr||'<tr><td colspan="4" class="empty">Нет</td></tr>'}</tbody></table></div></div></div>

        <div class="card"><div class="card-body"><form id="form-add-student" class="inline-form"><div class="form-group"><label class="form-label">ФИО *</label><input class="input" name="name" placeholder="Петров Пётр" required></div><div class="form-group"><label class="form-label">Класс *</label><select class="select" name="classId" required><option value="">—</option>${state.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="form-group"><button class="btn" type="submit">+ Добавить</button></div></form></div><div class="card-body p-0"><div class="table-wrap"><table><thead><tr><th>ФИО</th><th>Класс</th><th></th></tr></thead><tbody>${sr||'<tr><td colspan="3" class="empty">Нет</td></tr>'}</tbody></table></div></div></div>`;

    document.getElementById('form-add-class').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const name=(fd.get('name')||'').trim();if(!name)return;if(state.classes.some(c=>c.name.toLowerCase()===name.toLowerCase())){msg('Уже есть','error');return;}state.classes.push({id:nextId(state.classes),name,teacherId:fd.get('teacherId')?Number(fd.get('teacherId')):null});save();logAction(`Класс: ${name}`);renderManagePage();};
    document.getElementById('form-add-student').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const name=(fd.get('name')||'').trim();const classId=Number(fd.get('classId'));if(!name||!classId)return;state.students.push({id:nextId(state.students),fullName:name,classId});save();logAction(`Ученик: ${name}`);renderManagePage();};

function renderAccountsPage(){
    const rows=state.users.map(u=>{const roleBadge=`<span class="badge ${roleBadgeClass(u.role)}">${roleLabel(u.role)}</span>`;const ls=u.studentId?getStudent(u.studentId):null;return`<tr><td>${esc(u.name)}</td><td><code style="font-size:12px">${esc(u.username)}</code></td><td>${roleBadge}</td><td>${ls?esc(ls.fullName):'—'}</td><td class="td-end"><div style="display:flex;gap:4px;justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-reset-pass="${u.id}">🔑</button><button class="btn btn-ghost btn-sm" data-del-user="${u.id}">✕</button></div></td></tr>`;}).join('');
    document.getElementById('page-accounts').innerHTML=`
        <h1 class="page-title">Аккаунты</h1>
        <div id="acc-msg"></div>
        <div class="card"><div class="card-header">Добавить</div><div class="card-body"><form id="form-add-user" class="inline-form">
            <div class="form-group"><label class="form-label">ФИО *</label><input class="input" name="name" required></div>
            <div class="form-group"><label class="form-label">Логин *</label><input class="input" name="username" required></div>
            <div class="form-group"><label class="form-label">Пароль *</label><input class="input" name="password" required></div>
            <div class="form-group"><label class="form-label">Роль *</label><select class="select" name="role" id="new-user-role" required><option value="teacher">учитель</option><option value="deputy">завуч</option><option value="director">директор</option><option value="admin">администратор</option><option value="student">ученик</option><option value="parent">родитель</option></select></div>
            <div class="form-group hidden" id="new-user-student-wrap"><label class="form-label">Ученик</label><select class="select" name="studentId" id="new-user-student"><option value="">—</option>${state.students.map(s=>{const c=getClass(s.classId);return`<option value="${s.id}">${esc(s.fullName)} (${esc(c?.name||'?')})</option>`;}).join('')}</select></div>
            <div class="form-group"><button class="btn" type="submit">+ Создать</button></div>
        </form></div></div>
        <div class="card"><div class="card-header">Все (${state.users.length})</div><div class="card-body p-0"><div class="table-wrap"><table><thead><tr><th>ФИО</th><th>Логин</th><th>Роль</th><th>Ученик</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
    const msg=(t,ty='success')=>{document.getElementById('acc-msg').innerHTML=`<div class="alert alert-${ty}">${t}</div>`;};
    const roleSel=document.getElementById('new-user-role');const sw=document.getElementById('new-user-student-wrap');
    roleSel.onchange=()=>{sw.classList.toggle('hidden',roleSel.value!=='student'&&roleSel.value!=='parent');};
    document.getElementById('form-add-user').onsubmit=async e=>{
        e.preventDefault();
        const fd=new FormData(e.target);const name=(fd.get('name')||'').trim();const username=(fd.get('username')||'').trim();const password=(fd.get('password')||'').trim();const role=fd.get('role');const studentId=(role==='student'||role==='parent')&&fd.get('studentId')?Number(fd.get('studentId')):null;
        if(!name||!username||!password){msg('Заполните','error');return;}
        if(state.users.some(u=>u.username===username)){msg('Занят','error');return;}
        if((role==='student'||role==='parent')&&!studentId){msg('Выберите ученика','error');return;}
        const hash=await hashPassword(password);
        state.users.push({id:nextId(state.users),username,password:hash,role,name,studentId});
        save();logAction(`Аккаунт: ${name} (${roleLabel(role)})`);
        renderAccountsPage();
    };
    document.querySelectorAll('[data-reset-pass]').forEach(btn=>{btn.onclick=async()=>{const id=Number(btn.dataset.resetPass);const u=getUser(id);const np=prompt(`Новый пароль для «${u.name}»:`,'');if(np===null||!np.trim())return;u.password=await hashPassword(np.trim());save();msg(`Пароль для «${esc(u.name)}» изменён`);};});
    document.querySelectorAll('[data-del-user]').forEach(btn=>{btn.onclick=()=>{const id=Number(btn.dataset.delUser);if(id===session.userId){msg('Свой нельзя','error');return;}const u=getUser(id);if(!confirm(`Удалить «${u.name}»?`))return;state.users=state.users.filter(x=>x.id!==id);state.classes.forEach(c=>{if(c.teacherId===id)c.teacherId=null;});save();renderAccountsPage();};});
}

/* ============ CSV ============ */
function exportCSV(){
    const rows=[['Класс','Ученик','Дата','Тип','Причина','Категория','Справка','Время опоздания','Статус','Комментарий']];
    [...state.absences].sort((a,b)=>b.date.localeCompare(a.date)).forEach(a=>{
        const s=getStudent(a.studentId);const r=getReason(a.reasonId);const c=s?getClass(s.classId):null;
        rows.push([c?c.name:'',s?s.fullName:'',a.date,a.type==='late'?'опоздание':'пропуск',r?.name||'',r?.category||'',a.hasCertificate?'да':(r?.requiresCertificate?'нет':''),a.lateTime||'',a.status||'approved',a.comment||'']);
    });
    const csv='\ufeff'+rows.map(row=>row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='absences_'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

/* ============ ИНИЦИАЛИЗАЦИЯ ============ */
function initApp(){
    const REQUIRED=['login-screen','login-main','login-form','login-error','login-user','login-pass','forgot-link','forgot-card','forgot-step1','forgot-step2','forgot-user','forgot-gen-btn','forgot-save-btn','forgot-code-info','forgot-code','forgot-newpass','forgot-newpass2','forgot-msg','back-to-login','app-screen','app-nav','user-name','user-role','logout-btn','page-home','page-my-request','page-quick-add','page-calendar','page-schedule','page-reports','page-manage','page-accounts','page-reasons','page-log','page-sync','page-bells','page-qr'];
    const missing=REQUIRED.filter(id=>!document.getElementById(id));
    if(missing.length>0){
        console.error('[init] Отсутствуют:',missing);
        document.body.insertAdjacentHTML('afterbegin',`<div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#fee2e2;color:#991b1b;padding:16px;font-family:monospace"><b>⚠ Ошибка HTML</b><br>Не хватает элементов: <code>${missing.join(', ')}</code></div>`);
        return;
    }
    const urlParams=new URLSearchParams(window.location.search);
    const token=urlParams.get('checkin');
    if(token){pendingCheckin=token;window.history.replaceState({},'',window.location.pathname);}
    loadSession();
    try{const sp=localStorage.getItem(PAGE_KEY);if(sp&&PAGES.includes(sp))currentPage=sp;}catch(e){}

    document.getElementById('login-form').addEventListener('submit',handleLogin);
    document.getElementById('logout-btn').addEventListener('click',handleLogout);
    document.getElementById('forgot-link').addEventListener('click',e=>{e.preventDefault();showLoginPanel('forgot');});
    document.getElementById('back-to-login').addEventListener('click',e=>{e.preventDefault();showLoginPanel('main');});
    document.getElementById('forgot-gen-btn').addEventListener('click',forgotGenerate);
    document.getElementById('forgot-save-btn').addEventListener('click',forgotSave);
    document.getElementById('forgot-user').addEventListener('keypress',e=>{if(e.key==='Enter'){e.preventDefault();forgotGenerate();}});

    let waited=0;
    function tryStartFirebase(){
        if(window._firebase){
            console.log('[init] Firebase готов, стартую');
            initFirebaseSync();
            return;
        }
        waited+=100;
        if(waited>=3000){
            console.warn('[init] Firebase не загрузился за 3 сек — локально');
            loadFromLocal();
            if(!session)updateLoginStatus();
            return;
        }
        setTimeout(tryStartFirebase,100);
    }
    tryStartFirebase();

    if(session){
        const wait=setInterval(()=>{
            if(state){
                clearInterval(wait);
                renderApp();
                if(pendingCheckin)setTimeout(()=>processCheckin(pendingCheckin),500);
            }
        },100);
        setTimeout(()=>{clearInterval(wait);if(!state){loadFromLocal();renderApp();}},5000);
    }else renderLogin();
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initApp);
else initApp();
</script>
