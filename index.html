<script>
const STORAGE_KEY='school_helper_v3',SESSION_KEY='school_helper_session';
const FB_PATH='schoolData',BACKUP_PATH='backups',BACKUP_KEEP_DAYS=30;
const DAYS_OF_WEEK=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MAX_PIN_ATTEMPTS=5,LOCKOUT_MS=5*60*1000,SESSION_TTL_MS=30*24*60*60*1000;
const CLASSES=(()=>{const arr=[];for(let g=1;g<=9;g++)for(const l of ['А','Б','В'])arr.push(g+l);arr.push('10','11');return arr;})();
const SUBJECTS_JUNIOR=['Русский язык','Литературное чтение','Иностранный язык','Математика','Окружающий мир','Основы религиозных культур и светской этики','Изобразительное искусство','Музыка','Труд (технология)','Физическая культура'];
const SUBJECTS_MIDDLE=['Русский язык','Литература','Иностранный язык','Математика','Информатика','История','Обществознание (с 2026 года — с 9 класса)','География','Физика','Химия','Биология','Изобразительное искусство','Музыка','Труд (технология)','Физическая культура','Основы безопасности и защиты Родины'];
const SUBJECTS_SENIOR=['Русский язык','Литература','Иностранный язык','Математика','Информатика','История','Обществознание','Правовая культура','Экономика','География','Физика','Химия','Биология','Физическая культура','Основы безопасности и защиты Родины'];
function getSubjects(cls){const g=parseInt(cls,10);if(g<=4)return SUBJECTS_JUNIOR;if(g<=9)return SUBJECTS_MIDDLE;return SUBJECTS_SENIOR;}
const REASONS=[{id:'sick',name:'Болезнь',type:'good'},{id:'statement',name:'По заявлению родителей',type:'good'},{id:'family',name:'Семейные обстоятельства',type:'good'},{id:'sport',name:'Спорт / олимпиада',type:'good'},{id:'disrespect',name:'Неуважительная',type:'bad'},{id:'late',name:'Опоздание',type:'bad'},{id:'other',name:'Другое',type:'neutral'}];
function reasonById(id){return REASONS.find(r=>r.id===id)||REASONS[REASONS.length-1];}
const REMARK_TYPES=[{id:'late',name:'Опоздал',type:'warn'},{id:'not-ready',name:'Не готов к уроку',type:'warn'},{id:'phone',name:'Телефон на уроке',type:'warn'},{id:'talk',name:'Разговоры',type:'warn'},{id:'no-hw',name:'Не сдал ДЗ',type:'danger'},{id:'violation',name:'Нарушение',type:'danger'},{id:'other',name:'Другое',type:'warn'}];
function remarkTypeById(id){return REMARK_TYPES.find(r=>r.id===id)||REMARK_TYPES[REMARK_TYPES.length-1];}
function simpleHash(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return 'h'+Math.abs(h).toString(36);}
function generateSalt(){const arr=new Uint8Array(16);crypto.getRandomValues(arr);return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function pbkdf2Hash(str,salt){try{const enc=new TextEncoder();const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(str),{name:'PBKDF2'},false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},keyMaterial,256);return 'pbkdf2$'+salt+'$'+Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){return 'pbkdf2-fallback$'+simpleHash(str+salt);}}
async function setPinHash(pin){return await pbkdf2Hash(pin,generateSalt());}
async function verifyPin(input,storedHash){if(!storedHash)return false;if(storedHash.startsWith('pbkdf2$')){const parts=storedHash.split('$');if(parts.length!==3)return false;const computed=await pbkdf2Hash(input,parts[1]);return computed===storedHash;}if(storedHash.startsWith('pbkdf2-fallback$'))return storedHash==='pbkdf2-fallback$'+simpleHash(input);return simpleHash(input)===storedHash;}
function checkLockout(user){if(!user)return{locked:false};if(user.blockedUntil&&Date.now()<user.blockedUntil)return{locked:true,seconds:Math.ceil((user.blockedUntil-Date.now())/1000)};return{locked:false};}
function registerFailure(user){if(!user)return;user.attempts=(user.attempts||0)+1;if(user.attempts>=MAX_PIN_ATTEMPTS){user.blockedUntil=Date.now()+LOCKOUT_MS;user.attempts=0;}saveData();}
function resetAttempts(user){if(!user)return;if(user.attempts||user.blockedUntil){user.attempts=0;user.blockedUntil=null;saveData();}}
function isValidAbsenceDate(dateStr){if(!dateStr||!/^\d{4}-\d{2}-\d{2}$/.test(dateStr))return false;const d=new Date(dateStr+'T00:00:00');if(isNaN(d.getTime()))return false;const today=new Date();today.setHours(23,59,59,999);if(d>today)return false;const fiveYearsAgo=new Date();fiveYearsAgo.setFullYear(fiveYearsAgo.getFullYear()-5);if(d<fiveYearsAgo)return false;return true;}
const RECOMMENDED_RULES='{\n  "rules": {\n    "schoolData": { ".read": true, ".write": true },\n    "backups": { ".read": true, ".write": true }\n  }\n}';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function optionsHTML(items,selected,valueKey){return items.map(item=>{const val=valueKey?item[valueKey]:item;const label=valueKey?item.name:item;return '<option value="'+escapeHtml(val)+'"'+(val===selected?' selected':'')+'>'+escapeHtml(label)+'</option>';}).join('');}
function toast(msg,isError,isWarn){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.className='toast show'+(isError?' error':(isWarn?' warn':''));clearTimeout(el._t);el._t=setTimeout(()=>{el.className='toast';},2600);}
function todayISO(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function formatDate(iso){if(!iso)return '';const p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function formatDateTime(iso){if(!iso)return '';try{const d=new Date(iso);return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
function getStudentsOfClass(cls){return data.students.filter(s=>s.class===cls).sort((a,b)=>a.name.localeCompare(b.name,'ru'));}
function getDayOfWeek(dateISO){if(!dateISO)return null;try{const d=new Date(dateISO+'T00:00:00');return DAYS_OF_WEEK[(d.getDay()+6)%7];}catch(e){return null;}}

function emptyDB(){
  return {
    students:[],teachers:[],absences:[],periods:{},currentPeriod:{},schedules:{},
    homework:[],questions:[],announcements:[],remarks:[],notes:[],contacts:[],
    meetings:[],duties:[],todos:[],parentNotes:[],log:[],notifications:[],
    adminPasswordHash:null
  };
}
function buildSeedData(){
  const names=['Иванов Иван','Петрова Мария','Сидоров Пётр','Кузнецова Анна','Смирнов Дмитрий','Волкова Екатерина'];
  const students=[];
  for(const c of CLASSES)for(const n of names)students.push({id:uid(),class:c,name:n,pin:simpleHash('1234'),teacherNote:'',attempts:0,blockedUntil:null});
  return Object.assign(emptyDB(),{students});
}
function loadLocalData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)return Object.assign(emptyDB(),JSON.parse(raw));}catch(e){}return buildSeedData();}
let data=loadLocalData();
for(const k of ['students','teachers','absences','homework','questions','announcements','remarks','notes','contacts','meetings','duties','todos','parentNotes','log','notifications']){if(!Array.isArray(data[k]))data[k]=[];}
if(!data.periods)data.periods={};if(!data.currentPeriod)data.currentPeriod={};if(!data.schedules)data.schedules={};
if(data.adminPasswordHash===undefined)data.adminPasswordHash=null;
let firebaseReady=false,firebaseConnected=false,session=null;
let _seenNotifIds=new Set(),_sessionStartTime=Date.now(),_notifFilter='all';
let saveTimer=null,saveLogTimer=null,saveNotifTimer=null;

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  if(!firebaseReady||!window.firebaseDB)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      const{db,ref,set}=window.firebaseDB;
      await set(ref(db,FB_PATH+'/main'),{
        students:data.students,absences:data.absences,teachers:data.teachers,
        periods:data.periods,currentPeriod:data.currentPeriod,schedules:data.schedules,
        homework:data.homework,questions:data.questions,announcements:data.announcements,
        remarks:data.remarks,notes:data.notes,contacts:data.contacts,meetings:data.meetings,
        duties:data.duties,todos:data.todos,parentNotes:data.parentNotes,
        adminPasswordHash:data.adminPasswordHash
      });
      firebaseConnected=true;updateStatusBadge();
    }catch(e){firebaseConnected=false;updateStatusBadge();}
  },600);
}
function saveLog(){if(!firebaseReady||!window.firebaseDB)return;clearTimeout(saveLogTimer);saveLogTimer=setTimeout(async()=>{try{const{db,ref,set}=window.firebaseDB;await set(ref(db,FB_PATH+'/log'),data.log||[]);}catch(e){}},2000);}
function saveNotifications(){if(!firebaseReady||!window.firebaseDB)return;clearTimeout(saveNotifTimer);saveNotifTimer=setTimeout(async()=>{try{const{db,ref,set}=window.firebaseDB;await set(ref(db,FB_PATH+'/notifications'),data.notifications||[]);}catch(e){}},1000);}
function logAction(action,details){data.log.push({time:new Date().toISOString(),user:session?session.name:'—',role:session?session.role:'—',action,details:details||''});if(data.log.length>300)data.log=data.log.slice(-300);saveLog();}

/* ===== УВЕДОМЛЕНИЯ ===== */
const NOTIF_TYPES={
  homework:{icon:'📚',title:'Новое ДЗ'},question:{icon:'❓',title:'Новый вопрос'},
  warning:{icon:'⚠️',title:'Внимание'},message:{icon:'💬',title:'Сообщение'},
  absence:{icon:'📝',title:'Пропуск'},info:{icon:'ℹ️',title:'Уведомление'}
};
function notifType(t){return NOTIF_TYPES[t]||NOTIF_TYPES.info;}
function playNotifSound(){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx();const now=ctx.currentTime;[[880,0],[1175,.12]].forEach(([freq,delay])=>{const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0,now+delay);gain.gain.linearRampToValueAtTime(.10,now+delay+.01);gain.gain.exponentialRampToValueAtTime(.001,now+delay+.26);osc.connect(gain).connect(ctx.destination);osc.start(now+delay);osc.stop(now+delay+.28);});setTimeout(()=>ctx.close(),600);}catch(e){}}
async function requestNotificationPermission(showToast){if(!('Notification' in window)){if(showToast)toast('Не поддерживается',true);return;}if(Notification.permission==='granted'){if(showToast)toast('Уже включены');return;}if(Notification.permission==='denied'){if(showToast)toast('Заблокированы',true);return;}try{const p=await Notification.requestPermission();if(showToast)toast(p==='granted'?'Включены':'Отклонено',p!=='granted');if(p==='granted')renderApp();}catch(e){}}
function showNativeNotification(title,body){if(!('Notification' in window)||Notification.permission!=='granted')return;try{new Notification(title,{body,tag:'school-helper'});}catch(e){}}
function pushNotification(toRole,toUser,message,detail,type){
  data.notifications.push({id:uid(),toRole,toUser,message,detail:detail||'',type:type||'info',
    from:session?session.name:'—',fromRole:session?session.role:'—',time:new Date().toISOString(),read:false});
  if(data.notifications.length>200)data.notifications=data.notifications.slice(-200);
  saveNotifications();
  if(session&&session.role===toRole&&session.name===toUser&&!_seenNotifIds.has(data.notifications[data.notifications.length-1].id)){
    const n=data.notifications[data.notifications.length-1];_seenNotifIds.add(n.id);showNativeNotification('Классный · '+notifType(type).title,message);
  }
}
function getMyNotifications(){if(!session)return[];return data.notifications.filter(n=>n.toRole===session.role&&n.toUser===session.name).sort((a,b)=>(b.time||'').localeCompare(a.time||''));}
function unreadCount(){return getMyNotifications().filter(n=>!n.read).length;}
function markRead(id){let c=false;data.notifications.forEach(n=>{if(n.id===id&&!n.read){n.read=true;c=true;}});if(c)saveNotifications();}
function markAllRead(){let c=false;data.notifications.forEach(n=>{if(n.toRole===session.role&&n.toUser===session.name&&!n.read){n.read=true;c=true;}});if(c)saveNotifications();}

async function initFirebaseSync(){if(!window.firebaseDB){firebaseReady=true;return false;}firebaseReady=true;return true;}
function subscribeToFirebase(){
  if(!window.firebaseDB)return;
  const{db,ref,onValue,set}=window.firebaseDB;
  onValue(ref(db,FB_PATH+'/main'),(snap)=>{
    const inc=snap.val();
    if(!inc){const seed=buildSeedData();set(ref(db,FB_PATH+'/main'),{students:seed.students,absences:[],teachers:[],periods:{},currentPeriod:{},schedules:{},homework:[],questions:[],announcements:[],remarks:[],notes:[],contacts:[],meetings:[],duties:[],todos:[],parentNotes:[],adminPasswordHash:null});return;}
    for(const k of ['students','absences','teachers','homework','questions','announcements','remarks','notes','contacts','meetings','duties','todos','parentNotes']){data[k]=inc[k]||[];}
    data.periods=inc.periods||{};data.currentPeriod=inc.currentPeriod||{};data.schedules=inc.schedules||{};
    data.adminPasswordHash=inc.adminPasswordHash||null;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    firebaseConnected=true;updateStatusBadge();
    if(session)renderApp();
  },()=>{firebaseConnected=false;updateStatusBadge();});
  onValue(ref(db,FB_PATH+'/log'),s=>{data.log=s.val()||[];});
  onValue(ref(db,FB_PATH+'/notifications'),s=>{data.notifications=s.val()||[];if(session)processIncomingNotifications();});
}
function updateStatusBadge(){const b=document.getElementById('syncStatus');if(!b)return;if(!firebaseReady)b.innerHTML='<span class="status-dot offline"></span>Локально';else if(firebaseConnected)b.innerHTML='<span class="status-dot online"></span>Синхронизировано';else b.innerHTML='<span class="status-dot offline"></span>Офлайн';}
async function runAutoBackup(force){if(!window.firebaseDB)return;const today=todayISO();if(!force&&localStorage.getItem('last_backup_v3')===today)return;try{const{db,ref,set,get,remove}=window.firebaseDB;const snap=await get(ref(db,BACKUP_PATH));const ex=snap.val()||{};const keys=Object.keys(ex).sort();while(keys.length>=BACKUP_KEEP_DAYS){try{await remove(ref(db,BACKUP_PATH+'/'+keys.shift()));}catch(e){}}await set(ref(db,BACKUP_PATH+'/'+today),{time:new Date().toISOString(),data:{students:data.students,absences:data.absences,teachers:data.teachers,periods:data.periods,currentPeriod:data.currentPeriod,schedules:data.schedules,homework:data.homework,questions:data.questions,announcements:data.announcements,remarks:data.remarks,notes:data.notes,contacts:data.contacts,meetings:data.meetings,duties:data.duties,todos:data.todos,parentNotes:data.parentNotes,adminPasswordHash:data.adminPasswordHash}});localStorage.setItem('last_backup_v3',today);}catch(e){}}
async function listBackups(){if(!window.firebaseDB)return[];try{const{db,ref,get}=window.firebaseDB;const snap=await get(ref(db,BACKUP_PATH));const v=snap.val()||{};return Object.entries(v).map(([d,i])=>({date:d,time:i.time})).sort((a,b)=>b.date.localeCompare(a.date));}catch(e){return[];}}
async function restoreBackup(date){if(!window.firebaseDB)return false;try{const{db,ref,get}=window.firebaseDB;const snap=await get(ref(db,BACKUP_PATH+'/'+date));const v=snap.val();if(!v||!v.data)return false;Object.assign(data,v.data);localStorage.setItem(STORAGE_KEY,JSON.stringify(data));saveData();return true;}catch(e){return false;}}

/* ===== Периоды и расписание ===== */
function defaultPeriodsForClass(cls){const g=parseInt(cls,10);const year=new Date().getFullYear();const y1=new Date().getMonth()>=7?year:year-1;const y2=y1+1;if(g>=10)return[{name:'I полугодие',start:y1+'-09-01',end:y1+'-12-28'},{name:'II полугодие',start:y2+'-01-09',end:y2+'-05-25'},{name:'Весь год',start:y1+'-09-01',end:y2+'-05-31'}];return[{name:'I четверть',start:y1+'-09-01',end:y1+'-10-27'},{name:'II четверть',start:y1+'-11-05',end:y1+'-12-28'},{name:'III четверть',start:y2+'-01-09',end:y2+'-03-22'},{name:'IV четверть',start:y2+'-04-01',end:y2+'-05-25'},{name:'Весь год',start:y1+'-09-01',end:y2+'-05-31'}];}
function ensurePeriods(cls){if(!data.periods[cls])data.periods[cls]=defaultPeriodsForClass(cls);if(data.currentPeriod[cls]===undefined)data.currentPeriod[cls]=data.periods[cls].length-1;saveData();}
function getCurrentPeriod(cls){ensurePeriods(cls);return data.periods[cls][data.currentPeriod[cls]];}
function filterByPeriod(rows,cls){const p=getCurrentPeriod(cls);if(!p)return rows;return rows.filter(a=>a.date>=p.start&&a.date<=p.end);}
function periodSelectorHTML(cls){ensurePeriods(cls);const ps=data.periods[cls],cur=data.currentPeriod[cls];return '<select id="periodSelect" class="period-select" style="padding:8px 32px 8px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:var(--bg-elevated);cursor:pointer;font-weight:600">'+ps.map((p,i)=>'<option value="'+i+'"'+(i===cur?' selected':'')+'>'+escapeHtml(p.name)+'</option>').join('')+'</select>';}
function ensureSchedule(cls){if(!data.schedules[cls]){const e={};DAYS_OF_WEEK.forEach(d=>e[d]=[]);data.schedules[cls]=e;saveData();}}
function getLessonsFor(cls,dateISO){const day=getDayOfWeek(dateISO);if(!day)return getSubjects(cls);const s=data.schedules[cls]&&data.schedules[cls][day];return s&&s.length?s:getSubjects(cls);}

/* ===== Флаги внимания ===== */
function getStudentFlags(studentName,cls){
  const flags=[];
  const abs=filterByPeriod(data.absences.filter(a=>a.class===cls&&a.studentName===studentName),cls);
  const hw=data.homework.filter(h=>h.class===cls&&(!h.deadline||h.deadline<=todayISO()));
  const notDone=hw.filter(h=>!(h.done||[]).includes(studentName));
  const rem=filterByPeriod(data.remarks.filter(r=>r.class===cls&&r.studentName===studentName),cls);
  if(abs.length>=3)flags.push({type:'danger',text:'Пропусков: '+abs.length+' за период'});
  if(notDone.length>=3)flags.push({type:'danger',text:'Не сдал ДЗ: '+notDone.length+' работ'});
  else if(notDone.length>=1)flags.push({type:'warn',text:'Долг по ДЗ: '+notDone.length});
  if(rem.length>=3)flags.push({type:'warn',text:'Замечаний: '+rem.length});
  return flags;
}
function getClassAttention(cls){
  const items=[];
  const pendingAbs=filterByPeriod(data.absences.filter(a=>a.class===cls&&a.status==='pending'),cls);
  if(pendingAbs.length)items.push({type:'danger',text:'Пропусков на рассмотрении: '+pendingAbs.length,block:'attendance'});
  const students=getStudentsOfClass(cls);
  const hw=data.homework.filter(h=>h.class===cls&&h.deadline&&h.deadline<=todayISO());
  const debtors=students.filter(s=>hw.filter(h=>!(h.done||[]).includes(s.name)).length>=3);
  if(debtors.length)items.push({type:'danger',text:'Учеников с долгами по ДЗ: '+debtors.length,block:'homework'});
  const openQ=data.questions.filter(q=>q.class===cls&&!q.answered);
  if(openQ.length)items.push({type:'info',text:'Вопросов без ответа: '+openQ.length,block:'questions'});
  const todayDuties=(data.duties||[]).filter(d=>d.class===cls&&d.date===todayISO());
  if(todayDuties.length)items.push({type:'info',text:'Сегодня дежурит: '+todayDuties.map(d=>d.studentName).join(', '),block:'duties'});
  const upcoming=data.meetings.filter(m=>m.class===cls&&m.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date));
  if(upcoming.length)items.push({type:'info',text:'Ближайшее собрание: '+formatDate(upcoming[0].date)+' — '+upcoming[0].topic,block:'meetings'});
  return items;
}

function openNotifPanel(){
  document.getElementById('notifPanel')?.remove();
  const all=getMyNotifications();const unread=all.filter(n=>!n.read).length;
  const shown=_notifFilter==='unread'?all.filter(n=>!n.read):all;
  const panel=document.createElement('div');panel.className='notif-panel';panel.id='notifPanel';
  let bodyHTML='';
  if(!shown.length)bodyHTML='<div class="notif-empty">'+(_notifFilter==='unread'?'Непрочитанных нет':'Уведомлений нет')+'</div>';
  else{
    const groups={today:[],yesterday:[],older:[]};
    const now=new Date();const tS=now.toISOString().slice(0,10);const yS=new Date(now.getTime()-86400000).toISOString().slice(0,10);
    shown.forEach(n=>{const d=(n.time||'').slice(0,10);if(d===tS)groups.today.push(n);else if(d===yS)groups.yesterday.push(n);else groups.older.push(n);});
    const renderGroup=(label,items)=>{if(!items.length)return '';return '<div class="notif-date-group">'+label+'</div>'+items.map(n=>{const t=notifType(n.type);return '<div class="notif-item'+(n.read?'':' unread')+'" data-notif-id="'+n.id+'" data-notif-type="'+(n.type||'info')+'">'+
      '<div class="notif-icon '+(n.type||'info')+'">'+t.icon+'</div>'+
      '<div class="notif-body"><div class="notif-head"><div class="n-title">'+escapeHtml(n.message)+'</div>'+
      '<div class="notif-actions">'+(n.read?'':'<button class="notif-btn" data-mark-read="'+n.id+'">✓</button>')+
      '<button class="notif-btn" data-del-notif="'+n.id+'">✕</button></div></div>'+
      (n.detail?'<div class="n-text">'+escapeHtml(n.detail)+'</div>':'')+
      '<div class="n-time">'+escapeHtml(formatDateTime(n.time))+' · '+escapeHtml(n.from||'—')+'</div></div></div>';}).join('');};
    bodyHTML=renderGroup('Сегодня',groups.today)+renderGroup('Вчера',groups.yesterday)+renderGroup('Ранее',groups.older);
  }
  panel.innerHTML='<div class="notif-header"><div class="notif-tabs">'+
    '<button class="notif-tab'+(_notifFilter==='all'?' active':'')+'" data-notif-filter="all">Все ('+all.length+')</button>'+
    '<button class="notif-tab'+(_notifFilter==='unread'?' active':'')+'" data-notif-filter="unread">Непрочитанные ('+unread+')</button></div>'+
    '<button class="notif-close" id="notifCloseBtn">×</button></div>'+bodyHTML+
    (all.length?'<div class="notif-footer">'+(unread>0?'<button class="btn btn-secondary btn-sm" id="markAllReadBtn">Прочитать все</button>':'')+
    '<button class="btn btn-secondary btn-sm" id="clearAllNotifsBtn">Очистить</button></div>':'');
  document.body.appendChild(panel);
  document.getElementById('notifCloseBtn').addEventListener('click',()=>panel.remove());
  panel.querySelectorAll('[data-notif-filter]').forEach(t=>t.addEventListener('click',()=>{_notifFilter=t.dataset.notifFilter;openNotifPanel();}));
  panel.querySelectorAll('[data-mark-read]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();markRead(b.dataset.markRead);openNotifPanel();renderApp();}));
  panel.querySelectorAll('[data-del-notif]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();deleteNotification(b.dataset.delNotif);openNotifPanel();renderApp();}));
  panel.querySelectorAll('[data-notif-id]').forEach(item=>item.addEventListener('click',e=>{
    if(e.target.closest('[data-mark-read],[data-del-notif]'))return;
    markRead(item.dataset.notifId);panel.remove();renderApp();
  }));
  document.getElementById('markAllReadBtn')?.addEventListener('click',e=>{e.stopPropagation();markAllRead();openNotifPanel();renderApp();});
  document.getElementById('clearAllNotifsBtn')?.addEventListener('click',e=>{e.stopPropagation();if(!confirm('Удалить все?'))return;clearAllNotifications();openNotifPanel();renderApp();});
  setTimeout(()=>{const close=ev=>{if(!panel.contains(ev.target)){panel.remove();document.removeEventListener('click',close);}};document.addEventListener('click',close);},10);
}

    '<button class="role-tab '+(loginState.role==='parent'?'active':'')+'" data-role="parent">Родитель</button>'+
    '<button class="role-tab '+(loginState.role==='admin'?'active':'')+'" data-role="admin">Админ</button></div>'+
    '<form id="loginForm">'+formHTML+'<button type="submit" class="btn btn-full">Войти</button>'+
    '<button type="button" id="forgotPinBtn" class="forgot-link">🔑 Забыли PIN?</button>'+
    '<div style="text-align:center;margin-top:12px;font-size:12px;color:var(--text-dim)" id="syncStatus"></div></form></div></div>';
  updateStatusBadge();
  document.querySelectorAll('.role-tab').forEach(t=>t.addEventListener('click',()=>{loginState.role=t.dataset.role;renderLogin();}));
  const tName=document.getElementById('tName'),sClass=document.getElementById('sClass'),sName=document.getElementById('sName');
  if(tName)tName.addEventListener('input',()=>loginState.teacherName=tName.value);
  if(sClass)sClass.addEventListener('change',()=>{loginState.studentClass=sClass.value;renderLogin();});
  if(sName)sName.addEventListener('change',()=>loginState.studentName=sName.value);
  document.getElementById('forgotPinBtn').addEventListener('click',openResetPasswordModal);
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    if(loginState.role==='teacher'){
      const name=(tName.value||'').trim(),pin=(document.getElementById('tPin')?.value||'').trim();
      if(!name||!pin)return toast('Заполните поля',true);
      const t=findTeacher(name);if(!t)return toast('Учитель не найден',true);
      const lk=checkLockout(t);if(lk.locked)return toast('Заблокировано на '+lk.seconds+'с',true);
      const ok=await verifyPin(pin,t.pin);if(!ok){registerFailure(t);document.getElementById('tPin').value='';return toast('Неверный PIN',true);}
      if(!t.pin.startsWith('pbkdf2')){t.pin=await setPinHash(pin);saveData();}
      resetAttempts(t);
      session={role:'teacher',name:t.name,class:t.class,expiresAt:Date.now()+SESSION_TTL_MS};
    }else if(loginState.role==='admin'){
      const pwd=document.getElementById('adminPwd').value;
      const ok=await isAdminPassword(pwd);if(!ok)return toast('Неверный пароль',true);
      session={role:'admin',name:'Администратор',expiresAt:Date.now()+SESSION_TTL_MS};
    }else{
      if(!loginState.studentName)return toast('Выберите ученика',true);
      const st=data.students.find(s=>s.class===sClass.value&&s.name===loginState.studentName);
      if(!st)return toast('Не найден',true);
      const pv=(document.getElementById('sPin')?.value||'').trim();
      if(!pv)return toast('Введите PIN',true);
      const lk=checkLockout(st);if(lk.locked)return toast('Заблокировано на '+lk.seconds+'с',true);
      const ok=await verifyPin(pv,st.pin);if(!ok){registerFailure(st);document.getElementById('sPin').value='';return toast('Неверный PIN',true);}
      if(!st.pin.startsWith('pbkdf2')){st.pin=await setPinHash(pv);saveData();}
      resetAttempts(st);
      session={role:loginState.role,name:loginState.studentName,class:sClass.value,expiresAt:Date.now()+SESSION_TTL_MS};
    }
    ensurePeriods(session.class||'5А');
    saveSession();
    _sessionStartTime=Date.now();_seenNotifIds.clear();
    currentView='home';uiState={filterReason:'',filterStudent:'',filterDate:'',newStudentName:'',adminSelectedClass:CLASSES[0],searchQuery:''};
    logAction('login',session.role+' вошёл');
    renderApp();runAutoBackup(false);
  });
}
function openResetPasswordModal(){
  document.getElementById('resetPasswordOverlay')?.remove();
  const o=document.createElement('div');o.className='modal-overlay';o.id='resetPasswordOverlay';
  o.innerHTML='<div class="modal" style="max-width:480px"><div class="modal-header"><h3>🔑 Восстановление доступа</h3><button class="modal-close" id="rpClose">×</button></div><div class="modal-body">'+
    '<div style="background:var(--primary-soft);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px">PIN сбрасывается на 1234. Нужен мастер-пароль.</div>'+
    '<label>ФИО</label><input type="text" id="rpName" autocomplete="off"><label>Мастер-пароль</label><input type="password" id="rpMaster" autocomplete="off">'+
    '<div id="rpResult" style="margin-top:12px;padding:10px;border-radius:8px;font-size:13px;display:none"></div></div>'+
    '<div class="modal-footer"><button class="btn btn-secondary" id="rpCancel">Отмена</button><button class="btn" id="rpConfirm">Сбросить</button></div></div>';
  document.body.appendChild(o);
  const close=()=>o.remove();
  document.getElementById('rpClose').addEventListener('click',close);
  document.getElementById('rpCancel').addEventListener('click',close);
  o.addEventListener('click',e=>{if(e.target===o)close();});
  document.getElementById('rpConfirm').addEventListener('click',async()=>{
    const name=(document.getElementById('rpName').value||'').trim(),master=(document.getElementById('rpMaster').value||'').trim();
    const res=document.getElementById('rpResult');const err=t=>{res.style.display='block';res.style.background='var(--danger-soft)';res.style.color='#991b1b';res.textContent=t;};
    if(!name)return err('Введите ФИО');if(master!=='school21')return err('Неверный мастер-пароль');
    let t=findTeacher(name);
    if(!t)t=data.students.find(s=>s.name.toLowerCase()===name.toLowerCase());
    if(!t)return err('Не найден');
    t.pin=await setPinHash('1234');t.attempts=0;t.blockedUntil=null;saveData();
    res.style.display='block';res.style.background='var(--success-soft)';res.style.color='#065f46';res.textContent='✅ PIN сброшен на 1234';
    setTimeout(close,1500);
  });
}

/* ===== RENDER APP ===== */
function renderApp(){
  if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');
  else document.body.classList.remove('dark');
  if(!session){renderLogin();return;}
  const titleMap={teacher:'Классный — панель учителя',student:'Классный — ученик',parent:'Классный — родитель',admin:'Классный — админ'};
  const extra='';
  let body='';
  if(session.role==='teacher')body=renderTeacherView();
  else if(session.role==='student')body=renderStudentView();
  else if(session.role==='parent')body=renderParentView();
  else if(session.role==='admin')body=renderAdminView();
  document.getElementById('app').innerHTML=topbarHTML(titleMap[session.role],extra)+renderSubnav()+'<div class="container">'+body+'</div>';
  bindLogout();bindBell();bindThemeToggle();bindSubnav();
  // charts
  setTimeout(()=>{if(currentView==='reports')drawReportsCharts();},50);
  renderMobileNav();
}

/* ===== VIEW: TEACHER ===== */
function renderTeacherView(){
  if(currentView==='home')return renderTeacherHome();

    (attention.length?'<div class="card"><h3>🔔 Требует внимания</h3><div class="attention-list">'+
      attention.map(a=>'<div class="attention-item '+(a.type||'info')+'" data-attention-block="'+a.block+'">'+

      '</div></div>':'')+

function warningBannerHTML(cls){
  const absAll=filterByPeriod(data.absences.filter(a=>a.class===cls),cls);
  const problemStudents={};absAll.forEach(a=>{problemStudents[a.studentName]=(problemStudents[a.studentName]||0)+1;});
  const problems=Object.entries(problemStudents).filter(([_,n])=>n>=10);
  if(!problems.length)return '';
  return '<div class="warning-banner"><div class="warn-icon">⚠️</div><div class="warn-text"><b>Много пропусков (≥10) у '+problems.length+' учеников</b><br>'+problems.slice(0,5).map(p=>escapeHtml(p[0])+' ('+p[1]+')').join(', ')+'</div></div>';
}

function drawReportsCharts(){
  if(typeof Chart==='undefined')return;
  const cls=session.class;
  const isDark=document.body.classList.contains('dark');
  const tc=isDark?'#a8b3cc':'#6b7490';
  const gc=isDark?'rgba(255,255,255,.06)':'rgba(11,18,41,.06)';
  if(window._charts)window._charts.forEach(c=>c.destroy());
  window._charts=[];
  const abs=filterByPeriod(data.absences.filter(a=>a.class===cls),cls);
  const weeks={};
  abs.forEach(a=>{const d=new Date(a.date+'T00:00:00');const y=new Date(d);y.setDate(d.getDate()-d.getDay());const k=y.toISOString().slice(0,10);weeks[k]=(weeks[k]||0)+1;});
  const wk=Object.keys(weeks).sort();
  const c1=document.getElementById('attChart');
  if(c1)window._charts.push(new Chart(c1,{type:'bar',data:{labels:wk.map(w=>formatDate(w)),datasets:[{label:'Пропусков',data:wk.map(w=>weeks[w]),backgroundColor:'rgba(99,102,241,.85)',borderRadius:8,maxBarThickness:40}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{color:tc,precision:0},grid:{color:gc}},x:{ticks:{color:tc,font:{size:10}},grid:{display:false}}}}}));
  const hw=data.homework.filter(h=>h.class===cls);
  const students=getStudentsOfClass(cls);
  const debt=students.map(s=>({name:s.name,count:hw.filter(h=>!(h.done||[]).includes(s.name)&&h.deadline&&h.deadline<=todayISO()).length})).sort((a,b)=>b.count-a.count).slice(0,8);
  const c2=document.getElementById('hwChart');
  if(c2)window._charts.push(new Chart(c2,{type:'bar',data:{labels:debt.map(d=>d.name),datasets:[{label:'Долгов',data:debt.map(d=>d.count),backgroundColor:'rgba(239,68,68,.8)',borderRadius:8,maxBarThickness:40}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{color:tc,precision:0},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10}},grid:{display:false}}}}}));
}

        log.map(l=>'<tr><td data-label="Время">'+formatDateTime(l.time)+'</td><td data-label="Кто">'+escapeHtml(l.user)+'</td>'+
          '<td data-label="Действие"><span class="tag neutral">'+escapeHtml(l.action)+'</span></td><td data-label="Детали">'+escapeHtml(l.details||'')+'</td></tr>').join('')+
        '</tbody></table></div>':'<div class="empty">Пусто</div>')+'</div>';
  }
  return '';
}

/* ===== МОДАЛКА: КАРТОЧКА УЧЕНИКА ===== */
function openStudentProfile(name){
  const cls=session.class;
  const st=data.students.find(s=>s.class===cls&&s.name===name);
  if(!st)return toast('Не найден',true);
  const abs=filterByPeriod(data.absences.filter(a=>a.class===cls&&a.studentName===name),cls).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const hw=data.homework.filter(h=>h.class===cls&&h.deadline&&h.deadline<=todayISO());
  const notDone=hw.filter(h=>!(h.done||[]).includes(name));
  const remarks=filterByPeriod(data.remarks.filter(r=>r.class===cls&&r.studentName===name),cls);
  const notes=data.notes.filter(n=>n.teacherName===session.name&&n.studentName===name);
  const contacts=data.contacts.filter(c=>c.studentName===name);
  const o=document.createElement('div');o.className='modal-overlay';o.id='profileOverlay';
  o.innerHTML='<div class="modal" style="max-width:720px"><div class="modal-header"><h3>👤 '+escapeHtml(name)+'</h3><button class="modal-close" id="prClose">×</button></div><div class="modal-body">'+
    '<div class="stats" style="margin-bottom:16px"><div class="stat"><div class="num">'+abs.length+'</div><div class="lbl">Пропусков</div></div>'+
    '<div class="stat"><div class="num'+(notDone.length?' warn':' ok')+'">'+notDone.length+'</div><div class="lbl">Долгов ДЗ</div></div>'+
    '<div class="stat"><div class="num'+(remarks.length?' warn':'')+'">'+remarks.length+'</div><div class="lbl">Замечаний</div></div></div>'+
    '<h4 style="margin:16px 0 8px;font-size:13px;color:var(--text-mid)">📋 Пропуски ('+abs.length+')</h4>'+
    (abs.length?abs.slice(0,10).map(a=>'<div style="padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--border)">'+formatDate(a.date)+' · '+escapeHtml(a.subject)+' · <span class="tag '+reasonById(a.reason).type+'">'+escapeHtml(reasonById(a.reason).name)+'</span></div>').join(''):'<div style="color:var(--text-dim);font-size:12.5px">Нет</div>')+
    '<h4 style="margin:16px 0 8px;font-size:13px;color:var(--text-mid)">📚 Не сдано ДЗ ('+notDone.length+')</h4>'+
    (notDone.length?notDone.slice(0,10).map(h=>'<div style="padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--border)">'+escapeHtml(h.subject)+' · '+formatDate(h.date)+'</div>').join(''):'<div style="color:var(--text-dim);font-size:12.5px">Нет</div>')+
    '<h4 style="margin:16px 0 8px;font-size:13px;color:var(--text-mid)">⚠️ Замечания ('+remarks.length+')</h4>'+
    (remarks.length?remarks.map(r=>'<div style="padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--border)">'+formatDate(r.date)+' · '+escapeHtml(remarkTypeById(r.type).name)+(r.text?' — '+escapeHtml(r.text):'')+'</div>').join(''):'<div style="color:var(--text-dim);font-size:12.5px">Нет</div>')+
    '<h4 style="margin:16px 0 8px;font-size:13px;color:var(--text-mid)">📝 Мои заметки ('+notes.length+')</h4>'+
    (notes.length?notes.map(n=>'<div style="padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--border)">'+formatDateTime(n.time)+' — '+escapeHtml(n.text)+'</div>').join(''):'<div style="color:var(--text-dim);font-size:12.5px">Нет</div>')+

function exportCSV(type){
  const cls=session.class;
  let rows=[],name='data';
  if(type==='absences'){name='пропуски';rows=[['Дата','ФИО','Класс','Предмет','Причина','Статус','Примечание']];
    filterByPeriod(data.absences.filter(a=>a.class===cls),cls).forEach(a=>rows.push([a.date,a.studentName,a.class,a.subject,reasonById(a.reason).name,a.status||'approved',a.note||'']));}
  if(type==='homework'){name='ДЗ';rows=[['Дата','Предмет','Текст','Сдать до','Сдали']];
    data.homework.filter(h=>h.class===cls).forEach(h=>rows.push([h.date,h.subject,h.text,h.deadline||'','"'+(h.done||[]).join(', ')+'"']));
  if(type==='remarks'){name='замечания';rows=[['Дата','ФИО','Тип','Текст']];
    data.remarks.filter(r=>r.class===cls).forEach(r=>rows.push([r.date,r.studentName,remarkTypeById(r.type).name,r.text||'']));}
  const csv='\uFEFF'+rows.map(r=>r.join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'_'+cls+'_'+todayISO()+'.csv';a.click();
  toast('Скачано');
}

async function loadBackupList(){
  const el=document.getElementById('backupList');if(!el)return;
  el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">Загрузка...</div>';
  const list=await listBackups();
  if(!list.length){el.innerHTML='<div class="empty">Нет копий</div>';return;}
  el.innerHTML=list.map(b=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)"><div><b>'+escapeHtml(b.date)+'</b><br><span style="font-size:11px;color:var(--text-dim)">'+escapeHtml(formatDateTime(b.time))+'</span></div><button class="btn btn-secondary btn-sm" data-restore="'+escapeHtml(b.date)+'">Восстановить</button></div>').join('');
  document.querySelectorAll('[data-restore]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Восстановить?'))return;const ok=await restoreBackup(b.dataset.restore);if(ok){toast('Восстановлено');renderApp();}else toast('Ошибка',true);}));
}

// Переопределяем renderApp для вызова bindAllEvents
const _origRenderApp=renderApp;
renderApp=function(){
  if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');
  else document.body.classList.remove('dark');
  if(!session){renderLogin();return;}
  const titleMap={teacher:'Классный — панель учителя',student:'Классный — ученик',parent:'Классный — родитель',admin:'Классный — админ'};
  let body='';
  if(session.role==='teacher')body=renderTeacherView();
  else if(session.role==='student')body=renderStudentView();
  else if(session.role==='parent')body=renderParentView();
  else if(session.role==='admin')body=renderAdminView();
  document.getElementById('app').innerHTML=topbarHTML(titleMap[session.role],'')+renderSubnav()+'<div class="container">'+body+'</div>';
  bindLogout();bindBell();bindThemeToggle();bindSubnav();bindAllEvents();
  setTimeout(()=>{if(currentView==='reports')drawReportsCharts();},50);
};

(async function startApp(){
  if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');
  session=loadSession();
  renderApp();
  setTimeout(async()=>{
    await new Promise(r=>{const s=Date.now();const c=()=>{if(window.firebaseDB!==undefined)return r();if(Date.now()-s>3000)return r();setTimeout(c,50);};c();});
    await initFirebaseSync();
    subscribeToFirebase();
    updateStatusBadge();
    setTimeout(()=>runAutoBackup(false),5000);
  },100);
})();
</script>
