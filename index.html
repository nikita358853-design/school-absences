/* ================================================================
   2. ХЭШИРОВАНИЕ ПАРОЛЕЙ (SHA-256 + соль)
   ================================================================ */
const PASSWORD_SALT = 'school_attendance_salt_v1_';

async function hashPassword(password) {
    const data = new TextEncoder().encode(PASSWORD_SALT + password);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return 'sha256:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyPassword(input, stored) {
    if (stored.startsWith('sha256:')) {
        return (await hashPassword(input)) === stored;
    }
    // legacy plain password
    return input === stored;
}

function initFirebaseSync() {
    if (!window._firebase) {
        console.warn('Firebase SDK не загружен. Работаем локально.');
        loadFromLocal();
        return;
    }
    const dataRef = window._firebase.dataRef;

    window._firebase.onValue(dataRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.students && data.classes) {
            state = data;
            migrateState();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            firebaseReady = true;
        } else {
            state = JSON.parse(JSON.stringify(SEED));
            state.absences = generateDemoAbsences();
            migrateState();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            window._firebase.set(dataRef, state).catch(err => console.error(err));
            firebaseReady = true;
        }
        if (session) renderApp();
        else if (!document.getElementById('login-screen').classList.contains('hidden')) {}
        else renderLogin();
    }, (error) => {
        console.error('Ошибка Firebase:', error);
        loadFromLocal();
    });
}

function loadFromLocal() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { try { state = JSON.parse(raw); } catch { state = null; } }
    if (!state || !state.students) {
        state = JSON.parse(JSON.stringify(SEED));
        state.absences = generateDemoAbsences();
    }
    migrateState();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function migrateState() {
    if (!state) return;
    ['reasons','resetTokens','log','schedule','bells','qrTokens','checkins','signatures'].forEach(k => {
        if (!state[k]) state[k] = [];
    });

            { n: 6, start: '13:15', end: '14:00' },
            { n: 7, start: '14:10', end: '14:55' }
        ];
    }
    state.reasons.forEach(r => {
        if (r.requiresCertificate === undefined) {
            const n = (r.name || '').toLowerCase();
            r.requiresCertificate = n.includes('болезн') || n.includes('справк');
        }
    });
    (state.absences || []).forEach(a => {
        if (!a.status) a.status = 'approved';
        if (a.hasCertificate === undefined) a.hasCertificate = false;
        if (!a.type) a.type = 'absent';
    });
}

function save() {

}

function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
}
function getStudent(id) { return state.students.find(s => s.id === id); }
function getClass(id) { return state.classes.find(c => c.id === id); }
function getReason(id) { return state.reasons.find(r => r.id === id); }

function getTeacherOfClass(classId) {
    const c = getClass(classId); if (!c || !c.teacherId) return null;
    const u = getUser(c.teacherId); return u && u.role === 'teacher' ? u : null;
}
function allTeachers() { return state.users.filter(u => u.role === 'teacher'); }
function nextId(arr) { return arr.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1; }
function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-'); return d + '.' + m + '.' + y;
}
function formatDateTime(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
function getDayOfWeek(isoDate) {
    const d = new Date(isoDate + 'T00:00:00');
    return d.getDay() === 0 ? 7 : d.getDay();
}
function dayName(n) { return DAYS[n] || '?'; }
function getLessonsForDay(classId, isoDate) {
    const dw = getDayOfWeek(isoDate);
    return state.schedule
        .filter(l => l.classId === classId && l.dayOfWeek === dw)
        .sort((a, b) => a.lessonNumber - b.lessonNumber);
}
function workdaysBetween(fromIso, toIso) {
    const from = new Date(fromIso), to = new Date(toIso);
    let count = 0; const d = new Date(from);
    while (d <= to) {
        const day = d.getDay();
        if (day !== 0 && day !== 6) count++;
        d.setDate(d.getDate() + 1);
    }
    return count;
}
function categoryBadge(cat) {
    if (cat === 'уважительная') return '<span class="badge badge-success">уважительная</span>';
    if (cat === 'неуважительная') return '<span class="badge badge-warning">неуважительная</span>';
    return '<span class="badge badge-secondary">' + esc(cat) + '</span>';
}
function statusBadge(st) {

}

function roleBadgeClass(role) { return 'role-' + role; }
function getApprovedAbsences() {
    return state.absences.filter(a => (a.status || 'approved') === 'approved' && a.type === 'absent');
}
function getApprovedLates() {
    return state.absences.filter(a => (a.status || 'approved') === 'approved' && a.type === 'late');
}
function calcAttendance(studentId, startIso, endIso) {
    const workdays = workdaysBetween(startIso, endIso);
    const absences = getApprovedAbsences().filter(a =>
        a.studentId === studentId && a.date >= startIso && a.date <= endIso
    ).length;
    return workdays > 0 ? Math.max(0, ((workdays - absences) / workdays) * 100) : 100;
}
function countLates(studentId, startIso, endIso) {
    return getApprovedLates().filter(a =>
        a.studentId === studentId && a.date >= startIso && a.date <= endIso
    ).length;
}
function classAvgAttendance(classId, startIso, endIso) {
    const students = getStudentsOfClass(classId);
    if (students.length === 0) return 100;
    const total = students.reduce((sum, s) => sum + calcAttendance(s.id, startIso, endIso), 0);
    return Math.round((total / students.length) * 10) / 10;
}
function getMyClass() {
    if (session.role === 'teacher') return state.classes.find(c => c.teacherId === session.userId) || null;
    if (session.role === 'student' || session.role === 'parent') {
        const s = getStudent(session.studentId); return s ? getClass(s.classId) : null;
    }
    return null;
}
function getPendingForClass(classId) {
    const ids = getStudentsOfClass(classId).map(s => s.id);
    return state.absences.filter(a => a.status === 'pending' && ids.includes(a.studentId));
}

function getQuarterDates(quarterNumber) {
    const now = new Date();
    const year = now.getFullYear();
    // Учебный год начинается в сентябре: если сейчас до сентября — это прошлый учебный год
    const startYear = now.getMonth() >= 8 ? year : year - 1;
    const ranges = {
        1: { start: `${startYear}-09-01`,   end: `${startYear}-10-27` },
        2: { start: `${startYear}-11-06`,   end: `${startYear}-12-30` },
        3: { start: `${startYear+1}-01-11`, end: `${startYear+1}-03-22` },
        4: { start: `${startYear+1}-04-01`, end: `${startYear+1}-05-31` }
    };
    return ranges[quarterNumber];
}

async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pass').value;
    const err = document.getElementById('login-error');
    const user = state.users.find(u => u.username === username);

    if (!user) {
        err.textContent = 'Неверный логин или пароль';
        err.classList.remove('hidden');
        return;
    }

    const ok = await verifyPassword(password, user.password);
    if (!ok) {
        err.textContent = 'Неверный логин или пароль';
        err.classList.remove('hidden');
        return;
    }

    // Ленивая миграция: если пароль был в открытом виде — хэшируем
    if (!user.password.startsWith('sha256:')) {
        user.password = await hashPassword(password);
        save();
    }

    session = {
        userId: user.id, role: user.role, name: user.name,
        username: user.username, studentId: user.studentId || null
    };
    saveSession();
    logAction('Вход в систему');
    err.classList.add('hidden');
    renderApp();

    // Если ждёт отметка по QR
    if (pendingCheckin) processCheckin(pendingCheckin);
}

function handleLogout() {

    session = null; saveSession(); renderLogin();

        </div>`;

async function forgotSave() {
    const code = document.getElementById('forgot-code').value.trim();
    const p1 = document.getElementById('forgot-newpass').value;
    const p2 = document.getElementById('forgot-newpass2').value;
    const msgEl = document.getElementById('forgot-msg');
    msgEl.innerHTML = '';
    if (!resetFlowUser) { msgEl.innerHTML = '<div class="alert alert-error">Сначала запросите код</div>'; return; }
    if (!code) { msgEl.innerHTML = '<div class="alert alert-error">Введите код</div>'; return; }
    if (!p1) { msgEl.innerHTML = '<div class="alert alert-error">Введите новый пароль</div>'; return; }
    if (p1 !== p2) { msgEl.innerHTML = '<div class="alert alert-error">Пароли не совпадают</div>'; return; }
    if (p1.length < 4) { msgEl.innerHTML = '<div class="alert alert-error">Пароль слишком короткий</div>'; return; }
    const token = state.resetTokens.find(t => t.username === resetFlowUser);
    if (!token) { msgEl.innerHTML = '<div class="alert alert-error">Код не найден</div>'; return; }
    if (token.code !== code) { msgEl.innerHTML = '<div class="alert alert-error">Неверный код</div>'; return; }
    if (token.expiresAt < Date.now()) { msgEl.innerHTML = '<div class="alert alert-error">Код истёк</div>'; return; }

    const user = state.users.find(u => u.username === resetFlowUser);
    if (user) user.password = await hashPassword(p1);
    state.resetTokens = state.resetTokens.filter(t => t.username !== resetFlowUser);
    save();
    resetFlowUser = null;
    showLoginPanel('main');
    const errEl = document.getElementById('login-error');
    errEl.classList.remove('hidden');
    errEl.style.background = 'var(--success-l)';
    errEl.style.color = '#166534';
    errEl.style.borderColor = '#86efac';
    errEl.textContent = 'Пароль изменён. Войдите с новым паролем.';
    setTimeout(() => {
        errEl.classList.add('hidden');
        errEl.style.background = ''; errEl.style.color = ''; errEl.style.borderColor = '';
    }, 4000);
}

/* ================================================================
   8. QR-Код: обработка checkin
   ================================================================ */
function processCheckin(token) {
    pendingCheckin = null;
    const rec = state.qrTokens.find(t => t.token === token);
    if (!rec) {
        showToast('QR-код не найден', 'error');
        return;
    }
    if (rec.expiresAt < Date.now()) {
        showToast('QR-код истёк. Попросите учителя обновить', 'error');
        return;
    }
    if (session.role !== 'student') {
        showToast('Отметиться может только ученик', 'error');
        return;
    }
    // Проверяем что ученик из нужного класса
    const student = getStudent(session.studentId);
    if (!student || student.classId !== rec.classId) {
        showToast('Этот QR-код для другого класса', 'error');
        return;
    }
    // Проверяем что сегодня
    const today = new Date().toISOString().slice(0, 10);
    if (rec.date !== today) {
        showToast('QR-код для другой даты', 'error');
        return;
    }
    // Уже отмечался?
    const existing = state.checkins.find(c => c.studentId === session.studentId && c.date === today && c.classId === rec.classId);
    if (existing) {
        showToast('Вы уже отметились сегодня', 'info');
        return;
    }
    // Определяем: опоздал или вовремя
    const now = new Date();
    const nowTime = now.toTimeString().slice(0, 5);
    // Первый звонок из bells
    const firstBell = state.bells.sort((a,b) => a.n - b.n)[0];
    const isLate = firstBell && nowTime > firstBell.start;
    state.checkins.push({
        id: nextId(state.checkins),
        studentId: session.studentId,
        classId: rec.classId,
        token,
        date: today,
        time: nowTime,
        isLate
    });
    save();
    logAction(`Отметился(ась) по QR: ${student.fullName}, ${isLate ? 'опоздал(а)' : 'вовремя'}`);
    showToast(`✓ Вы отметились${isLate ? ' (опоздание)' : ''} в ${nowTime}`, 'success');
}

function showToast(message, type = 'info') {
    const colors = {
        success: 'var(--success)', error: 'var(--danger)',
        warning: 'var(--warning)', info: 'var(--primary)'
    };
    const el = document.createElement('div');
    el.style.cssText = `
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: ${colors[type]}; color: #fff; padding: 12px 22px;
        border-radius: 10px; font-weight: 600; font-size: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,.2); z-index: 10000;
        max-width: 90vw; text-align: center;
    `;
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3000);
    setTimeout(() => el.remove(), 3400);
}

/* ================================================================
   11. КОМПОНЕНТ ПОДПИСИ (canvas)
   ================================================================ */
function createSignaturePad(padId, canvasId) {
    const pad = document.getElementById(padId);
    const canvas = document.getElementById(canvasId);
    const dpr = window.devicePixelRatio || 1;
    const rect = pad.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let drawing = false;
    let empty = true;

    function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const point = e.touches ? e.touches[0] : e;
        return { x: point.clientX - r.left, y: point.clientY - r.top };
    }
    function start(e) {
        e.preventDefault();
        drawing = true;
        const p = getPos(e);
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        empty = false;
        pad.classList.add('signed');
    }
    function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const p = getPos(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }
    function end(e) {
        drawing = false;
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', end);

    return {
        clear: () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            empty = true;
            pad.classList.remove('signed');
        },
        isEmpty: () => empty,
        getDataUrl: () => canvas.toDataURL('image/png')
    };
}

function renderMyRequestPage() {
    const student = getStudent(session.studentId);
    const cls = student ? getClass(student.classId) : null;
    const teacher = cls ? getTeacherOfClass(cls.id) : null;
    const today = new Date().toISOString().slice(0, 10);

    const myReqs = state.absences
        .filter(a => a.studentId === session.studentId && a.status !== 'approved')
        .sort((a, b) => b.date.localeCompare(a.date));

    document.getElementById('page-my-request').innerHTML = `
        <h1 class="page-title">Сообщить о пропуске</h1>
        <p class="page-subtitle">
            ${teacher ? 'Классный руководитель: ' + esc(teacher.name) : 'Поступит классному руководителю'}
        </p>

        <div class="card">
            <div class="card-body">
                <div id="req-msg"></div>
                <form id="form-my-request">
                    <div class="form-group">
                        <label class="form-label">Дата пропуска *</label>
                        <input class="input" type="date" name="date" value="${today}" required max="${today}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Причина *</label>
                        <select class="select" name="reasonId" id="req-reason" required>
                            <option value="">— выберите —</option>
                            ${state.reasons.map(r =>
                                `<option value="${r.id}">[${esc(r.category)}] ${esc(r.name)}${r.requiresCertificate ? ' (справка обязательна)' : ''}</option>`
                            ).join('')}
                        </select>
                    </div>
                    <div class="form-group hidden" id="req-cert-wrap">
                        <label class="checkbox-line" id="req-cert-line">
                            <input type="checkbox" id="req-cert-check">
                            <span>У меня есть справка от врача</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Комментарий</label>
                        <textarea class="textarea" name="comment"
                            placeholder="Например: был у врача, справку принесу завтра"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Подпись (необязательно)</label>
                        <div class="sig-pad" id="req-sig-pad">
                            <div class="sig-hint">Поставьте подпись для подтверждения</div>
                            <canvas id="req-canvas"></canvas>
                        </div>
                        <div class="sig-actions">
                            <button type="button" class="btn btn-ghost btn-sm" id="req-sig-clear">Очистить</button>
                        </div>
                    </div>
                    <button class="btn btn-block" type="submit">Отправить на рассмотрение</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Мои заявки (не подтверждённые)</div>
            <div class="card-body p-0">
                ${myReqs.length ? `
                <div class="table-wrap"><table>
                    <thead><tr>
                        <th>Дата</th><th>Причина</th><th>Справка</th>
                        <th>Подпись</th><th>Статус</th>
                    </tr></thead>
                    <tbody>${myReqs.map(a => {
                        const r = getReason(a.reasonId);
                        const sig = state.signatures.find(s => s.absenceId === a.id);
                        return `<tr>
                            <td>${formatDate(a.date)}</td>
                            <td>${esc(r?.name || '—')}</td>
                            <td class="cert-cell">${certCell(a, r)}</td>
                            <td>${sig ? '<img src="'+sig.dataUrl+'" class="sig-thumb">' : '—'}</td>
                            <td>${statusBadge(a.status)}</td>
                        </tr>`;
                    }).join('')}</tbody>
                </table></div>` : '<div class="empty"><div class="empty-icon">📭</div>Нет активных заявок</div>'}
            </div>
        </div>
    `;

    const reasonSel = document.getElementById('req-reason');
    const certWrap = document.getElementById('req-cert-wrap');
    const certCheck = document.getElementById('req-cert-check');
    const certLine = document.getElementById('req-cert-line');
    const sigPad = createSignaturePad('req-sig-pad', 'req-canvas');
    document.getElementById('req-sig-clear').onclick = () => sigPad.clear();

    reasonSel.addEventListener('change', () => {
        const r = getReason(Number(reasonSel.value));
        if (r && r.requiresCertificate) certWrap.classList.remove('hidden');
        else {
            certWrap.classList.add('hidden');
            certCheck.checked = false;
            certLine.classList.remove('error');
        }
    });

    document.getElementById('form-my-request').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const date = fd.get('date');
        const reasonId = Number(fd.get('reasonId'));
        const comment = (fd.get('comment') || '').trim();
        if (!date || !reasonId) return;

        const r = getReason(reasonId);
        if (r && r.requiresCertificate && !certCheck.checked) {
            certLine.classList.add('error');
            document.getElementById('req-msg').innerHTML =
                '<div class="alert alert-error">Отметьте наличие справки</div>';
            return;
        }

        const newId = nextId(state.absences);
        state.absences.push({
            id: newId, studentId: session.studentId, date, reasonId, comment,
            status: 'pending', type: 'absent',
            hasCertificate: !!(r && r.requiresCertificate && certCheck.checked),
            createdAt: Date.now()
        });

        if (!sigPad.isEmpty()) {
            state.signatures.push({
                id: nextId(state.signatures), absenceId: newId,
                dataUrl: sigPad.getDataUrl(), signerId: session.userId,
                signerName: session.name, type: 'student-confirm', signedAt: Date.now()
            });
        }

        save();
        logAction(`Подал(а) заявку: ${formatDate(date)}`);
        document.getElementById('req-msg').innerHTML =
            '<div class="alert alert-success">Заявка отправлена</div>';
        e.target.reset();
        e.target.querySelector('[name="date"]').value = today;
        certWrap.classList.add('hidden');
        certCheck.checked = false;
        sigPad.clear();
        setTimeout(() => renderMyRequestPage(), 900);
    });
}

/* ================================================================
   13. ПОСЕЩАЕМОСТЬ (quick-add с QR + массовой отметкой + опозданиями)
   ================================================================ */
let quickAddState = { classId: null, date: null, statuses: {} };

function renderQuickAddPage() {
    const isTeacher = session.role === 'teacher';
    const allowedClasses = isTeacher
        ? (getMyClass() ? [getMyClass()] : [])
        : state.classes;
    if (allowedClasses.length === 0) {
        document.getElementById('page-quick-add').innerHTML = `
            <h1 class="page-title">Отметить посещаемость</h1>
            <div class="alert alert-warning">Вам не назначен класс.</div>`;
        return;
    }
    if (!quickAddState.classId || !allowedClasses.some(c => c.id === quickAddState.classId)) {
        quickAddState.classId = allowedClasses[0].id;
    }
    if (!quickAddState.date) quickAddState.date = new Date().toISOString().slice(0, 10);

    const cls = getClass(quickAddState.classId);
    const date = quickAddState.date;
    const lessons = getLessonsForDay(cls.id, date);
    const students = getStudentsOfClass(cls.id).sort((a, b) => a.fullName.localeCompare(b.fullName));
    const todayAbs = state.absences.filter(a =>
        a.date === date && a.status === 'approved' && students.some(s => s.id === a.studentId)
    );
    const pendingToday = state.absences.filter(a =>
        a.date === date && a.status === 'pending' && students.some(s => s.id === a.studentId)
    );
    const byStudent = {};
    todayAbs.forEach(a => { byStudent[a.studentId] = a; });
    const pendByStudent = {};
    pendingToday.forEach(a => { pendByStudent[a.studentId] = a; });

    const dayLabel = dayName(getDayOfWeek(date));
    const absCount = todayAbs.filter(a => a.type === 'absent').length;
    const lateCount = todayAbs.filter(a => a.type === 'late').length;

    document.getElementById('page-quick-add').innerHTML = `
        <h1 class="page-title">Отметить посещаемость</h1>
        <p class="page-subtitle">Отметьте отсутствующих и опоздавших</p>

        <div class="card">
            <div class="card-body">
                <div class="inline-form" style="grid-template-columns: ${isTeacher ? '1fr 1fr auto auto' : '1fr 1fr 1fr auto auto'};">
                    ${!isTeacher ? `
                    <div class="form-group">
                        <label class="form-label">Класс</label>
                        <select class="select" id="qa-class">
                            ${allowedClasses.map(c =>
                                `<option value="${c.id}" ${c.id === quickAddState.classId ? 'selected' : ''}>${esc(c.name)}</option>`
                            ).join('')}
                        </select>
                    </div>` : ''}
                    <div class="form-group">
                        <label class="form-label">Дата</label>
                        <input class="input" type="date" id="qa-date" value="${date}">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-success" id="qa-all-present" title="Отметить всех присутствующими">✓ Все присутствуют</button>
                    </div>
                    <div class="form-group">
                        <button class="btn btn-warning" id="qa-all-absent" title="Отметить всех отсутствующими">✗ Все отсутствуют</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="quick-info">
            <div class="qi-item"><div class="qi-label">Класс</div><div class="qi-value">${esc(cls.name)}</div></div>
            <div class="qi-item"><div class="qi-label">День</div><div class="qi-value">${esc(dayLabel)}</div></div>
            <div class="qi-item"><div class="qi-label">Учеников</div><div class="qi-value">${students.length}</div></div>
            <div class="qi-item"><div class="qi-label" style="color:var(--danger);">Отсутствуют</div><div class="qi-value" style="color:var(--danger);">${absCount}</div></div>
            <div class="qi-item"><div class="qi-label" style="color:var(--warning);">Опоздали</div><div class="qi-value" style="color:var(--warning);">${lateCount}</div></div>
            ${pendingToday.length ? `<div class="qi-item"><div class="qi-label">Заявок</div><div class="qi-value">${pendingToday.length}</div></div>` : ''}
        </div>

        <div class="card">
            <div class="card-header">
                <span>Отметки на ${formatDate(date)}</span>
                <button class="btn btn-sm btn-success" id="qa-save">💾 Сохранить</button>
            </div>
            <div class="card-body p-0">
                ${students.length ? `
                <div class="table-wrap"><table>
                    <thead><tr>
                        <th>Ученик</th>
                        <th style="width:220px;">Статус</th>
                        <th style="width:200px;">Причина</th>
                        <th>Комментарий</th>
                    </tr></thead>
                    <tbody>
                        ${students.map(st => {
                            const ex = byStudent[st.id];
                            const pend = pendByStudent[st.id];
                            const status = ex ? ex.type : 'present';
                            const pendBadge = pend ? ` <span class="badge badge-warning" style="margin-left:4px;">заявка</span>` : '';
                            const exReason = ex ? getReason(ex.reasonId) : null;
                            const needCert = exReason && exReason.requiresCertificate;
                            return `<tr class="attendance-row ${status === 'absent' ? 'row-absent' : status === 'late' ? 'row-late' : ''}" data-row-sid="${st.id}">
                                <td>${esc(st.fullName)}${pendBadge}</td>
                                <td>
                                    <div class="status-switch" data-switch="${st.id}">
                                        <button data-status="present" class="${status === 'present' ? 'active-present' : ''}">✓</button>
                                        <button data-status="late" class="${status === 'late' ? 'active-late' : ''}">⏰</button>
                                        <button data-status="absent" class="${status === 'absent' ? 'active-absent' : ''}">✗</button>
                                    </div>
                                    ${status === 'late' ? `<input type="time" class="input" style="margin-top:6px;padding:5px 8px;font-size:12px;" data-late-for="${st.id}" value="${ex?.lateTime || new Date().toTimeString().slice(0,5)}">` : ''}
                                </td>
                                <td>
                                    <select class="select" data-reason-for="${st.id}" ${status !== 'present' ? '' : 'disabled'}>
                                        <option value="">—</option>
                                        ${state.reasons.map(r =>
                                            `<option value="${r.id}" ${ex && ex.reasonId === r.id ? 'selected' : ''}>[${esc(r.category)}] ${esc(r.name)}</option>`
                                        ).join('')}
                                    </select>
                                    <label class="checkbox-line ${needCert && !ex?.hasCertificate ? 'error' : ''}" data-cert-line-for="${st.id}" style="display:${needCert ? 'flex' : 'none'};">
                                        <input type="checkbox" data-cert-for="${st.id}" ${ex?.hasCertificate ? 'checked' : ''}>
                                        <span>Справка</span>
                                    </label>
                                </td>
                                <td>
                                    <input type="text" class="input" data-comment-for="${st.id}"
                                           value="${ex?.comment ? esc(ex.comment) : ''}"
                                           ${status !== 'present' ? '' : 'disabled'}
                                           placeholder="—">
                                </td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table></div>` : '<div class="empty">Нет учеников</div>'}
            </div>
        </div>

        <div id="qa-msg"></div>
    `;

    // Привязка: класс, дата
    const classSel = document.getElementById('qa-class');
    if (classSel) classSel.addEventListener('change', () => {
        quickAddState.classId = Number(classSel.value);
        renderQuickAddPage();
    });
    document.getElementById('qa-date').addEventListener('change', e => {
        quickAddState.date = e.target.value;
        renderQuickAddPage();
    });

    // Массовые кнопки
    document.getElementById('qa-all-present').onclick = () => {
        document.querySelectorAll('[data-switch]').forEach(sw => {
            const sid = Number(sw.dataset.switch);
            updateRowStatus(sid, 'present');
        });
    };
    document.getElementById('qa-all-absent').onclick = () => {
        if (!confirm('Отметить всех отсутствующими? Каждому нужна причина.')) return;
        document.querySelectorAll('[data-switch]').forEach(sw => {
            const sid = Number(sw.dataset.switch);
            updateRowStatus(sid, 'absent');
        });
    };

    // Переключатели статуса
    document.querySelectorAll('[data-switch] button').forEach(btn => {
        btn.onclick = () => {
            const sw = btn.closest('[data-switch]');
            const sid = Number(sw.dataset.switch);
            updateRowStatus(sid, btn.dataset.status);
        };
    });

    // Причина → показать справку
    document.querySelectorAll('[data-reason-for]').forEach(sel => {
        sel.addEventListener('change', () => {
            const sid = Number(sel.dataset.reasonFor);
            const r = getReason(Number(sel.value));
            const certLine = document.querySelector(`[data-cert-line-for="${sid}"]`);
            const certChk = document.querySelector(`[data-cert-for="${sid}"]`);
            if (certLine) {
                if (r && r.requiresCertificate) {
                    certLine.style.display = 'flex';
                    certLine.classList.toggle('error', !certChk.checked);
                } else {
                    certLine.style.display = 'none';
                    if (certChk) certChk.checked = false;
                }
            }
        });
    });
    document.querySelectorAll('[data-cert-for]').forEach(chk => {
        chk.addEventListener('change', () => {
            const sid = Number(chk.dataset.certFor);
            const line = document.querySelector(`[data-cert-line-for="${sid}"]`);
            if (line) line.classList.toggle('error', !chk.checked);
        });
    });

    // Сохранить
    document.getElementById('qa-save').onclick = () => {
        const statuses = {};
        document.querySelectorAll('[data-switch]').forEach(sw => {
            const sid = Number(sw.dataset.switch);
            const active = sw.querySelector('button.active-absent, button.active-late');
            statuses[sid] = active ? active.dataset.status : 'present';
        });

        // Валидация
        let err = '';
        Object.entries(statuses).forEach(([sid, st]) => {
            if (st === 'present') return;
            const reasonId = Number(document.querySelector(`[data-reason-for="${sid}"]`).value);
            if (!reasonId) { err = `Для «${getStudent(Number(sid)).fullName}» не выбрана причина`; return; }
            const r = getReason(reasonId);
            const cert = document.querySelector(`[data-cert-for="${sid}"]`);
            if (r && r.requiresCertificate && (!cert || !cert.checked)) {
                err = `Для «${getStudent(Number(sid)).fullName}» нужна справка`;
            }
        });
        if (err) {
            document.getElementById('qa-msg').innerHTML = `<div class="alert alert-error">${esc(err)}</div>`;
            return;
        }

        // Удаляем старые записи за этот день
        state.absences = state.absences.filter(a =>
            !(a.date === date && students.some(s => s.id === a.studentId))
        );

        let idCounter = nextId(state.absences);
        Object.entries(statuses).forEach(([sid, st]) => {
            if (st === 'present') return;
            const reasonId = Number(document.querySelector(`[data-reason-for="${sid}"]`).value);
            const comment = document.querySelector(`[data-comment-for="${sid}"]`).value.trim();
            const cert = document.querySelector(`[data-cert-for="${sid}"]`);
            const lateInput = document.querySelector(`[data-late-for="${sid}"]`);
            state.absences.push({
                id: idCounter++, studentId: Number(sid), date, reasonId, comment,
                status: 'approved', type: st,
                lateTime: st === 'late' ? (lateInput?.value || '') : null,
                hasCertificate: !!(cert && cert.checked),
                reviewedBy: session.userId, reviewedAt: Date.now()
            });
        });

        save();
        const absN = Object.values(statuses).filter(s => s === 'absent').length;
        const lateN = Object.values(statuses).filter(s => s === 'late').length;
        logAction(`Отметил(а) ${cls.name} на ${formatDate(date)}: отсутств. ${absN}, опозд. ${lateN}`);
        document.getElementById('qa-msg').innerHTML =
            `<div class="alert alert-success">Сохранено: ${absN} отсутствующих, ${lateN} опоздавших</div>`;
        setTimeout(() => renderQuickAddPage(), 500);
    };
}

function updateRowStatus(sid, newStatus) {
    const sw = document.querySelector(`[data-switch="${sid}"]`);
    if (!sw) return;
    sw.querySelectorAll('button').forEach(b => {
        b.classList.remove('active-present', 'active-late', 'active-absent');
        if (b.dataset.status === newStatus) {
            b.classList.add('active-' + newStatus);
        }
    });
    const row = document.querySelector(`.attendance-row[data-row-sid="${sid}"]`);
    row.classList.remove('row-absent', 'row-late');
    if (newStatus === 'absent') row.classList.add('row-absent');
    if (newStatus === 'late') row.classList.add('row-late');

    // Активируем/деактивируем поля
    const reasonSel = document.querySelector(`[data-reason-for="${sid}"]`);
    const commentInp = document.querySelector(`[data-comment-for="${sid}"]`);
    reasonSel.disabled = newStatus === 'present';
    commentInp.disabled = newStatus === 'present';
    if (newStatus === 'present') {
        reasonSel.value = '';
        const certLine = document.querySelector(`[data-cert-line-for="${sid}"]`);
        if (certLine) certLine.style.display = 'none';
    }

    // Обновляем input для времени опоздания
    const reasonCell = reasonSel.closest('td').previousElementSibling;
    let lateInput = document.querySelector(`[data-late-for="${sid}"]`);
    if (newStatus === 'late' && !lateInput) {
        const inp = document.createElement('input');
        inp.type = 'time';
        inp.className = 'input';
        inp.style.cssText = 'margin-top:6px;padding:5px 8px;font-size:12px;';
        inp.dataset.lateFor = sid;
        inp.value = new Date().toTimeString().slice(0,5);
        reasonCell.querySelector('.status-switch').after(inp);
    } else if (newStatus !== 'late' && lateInput) {
        lateInput.remove();
    }

    // Показываем/скрываем QR-обновление
}

let qrRefreshTimer = null;

function renderQRPage() {

        return;
    }

                    </div>
                </div>
            </div>
        </div>

            <div class="card-body" style="text-align:center;">
                <div id="qr-code" class="qr-box"></div>

                    <thead><tr>
                        <th>Ученик</th><th>Время</th><th>Статус</th>
                    </tr></thead>
                    <tbody>${checkins.sort((a,b) => a.time.localeCompare(b.time)).map(c => {
                        const st = getStudent(c.studentId);
                        return `<tr>
                            <td>${esc(st?.fullName || '—')}</td>
                            <td>${esc(c.time)}</td>
                            <td>${c.isLate ? '<span class="late-tag">опоздал</span>' : '<span class="badge badge-success">вовремя</span>'}</td>

                    }).join('')}</tbody>
                </table></div>` : '<div class="empty">Пока никто не отметился</div>'}

        </div>
    `;

    document.getElementById('qr-class').onchange = (e) => {
        quickAddState.classId = Number(e.target.value);

    // Автогенерация при открытии

function generateQRToken(classId) {
    // Удаляем старые токены этого класса на сегодня
    const today = new Date().toISOString().slice(0, 10);
    state.qrTokens = state.qrTokens.filter(t => !(t.classId === classId && t.date === today));
    const token = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 10);
    const expiresAt = Date.now() + 5 * 60 * 1000;
    state.qrTokens.push({ token, classId, date: today, expiresAt, createdBy: session.userId });
    save();

    const baseUrl = window.location.origin + window.location.pathname;
    const checkinUrl = baseUrl + '?checkin=' + token;

    const el = document.getElementById('qr-code');
    if (!el) return;
    el.innerHTML = '';
    try {
        new QRCode(el, {
            text: checkinUrl,
            width: 240,
            height: 240,
            colorDark: '#1e293b',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
        document.getElementById('qr-info').innerHTML = `
            <div class="qr-timer">⏱ Действует 5 минут</div>
            <div class="qr-url">${esc(checkinUrl)}</div>
        `;
        if (qrRefreshTimer) clearTimeout(qrRefreshTimer);
        qrRefreshTimer = setTimeout(() => {
            if (currentPage === 'qr') {
                showToast('QR-код обновлён', 'info');
                generateQRToken(classId);
            }
        }, 5 * 60 * 1000);
    } catch (err) {
        el.innerHTML = '<div class="alert alert-error">Не удалось сгенерировать QR-код</div>';
    }
}

let calState = { year: null, month: null, selectedDay: null };

function renderCalendarPage() {
    const today = new Date();
    if (calState.year === null)  calState.year = today.getFullYear();
    if (calState.month === null) calState.month = today.getMonth();
    const { year, month } = calState;

    let absences = state.absences;
    if (session.role === 'student' || session.role === 'parent') {
        absences = absences.filter(a => a.studentId === session.studentId);
    } else if (session.role === 'teacher') {
        const cls = getMyClass();
        if (cls) {
            const ids = getStudentsOfClass(cls.id).map(s => s.id);
            absences = absences.filter(a => ids.includes(a.studentId));
        }
    }

    const byDate = {};
    absences.forEach(a => {
        if (!byDate[a.date]) byDate[a.date] = [];
        byDate[a.date].push(a);
    });

    const first = new Date(year, month, 1);
    const firstDayOfWeek = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const cells = [];
    for (let i = firstDayOfWeek - 1; i >= 0; i--) {
        const d = daysInPrevMonth - i;
        const m = month === 0 ? 11 : month - 1;
        const y = month === 0 ? year - 1 : year;
        cells.push({ day: d, month: m, year: y, otherMonth: true });
    }
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, month, year, otherMonth: false });
    while (cells.length % 7 !== 0 || cells.length < 35) {
        const idx = cells.length - firstDayOfWeek - daysInMonth + 1;
        const m = month === 11 ? 0 : month + 1;
        const y = month === 11 ? year + 1 : year;
        cells.push({ day: idx, month: m, year: y, otherMonth: true });
    }
    const todayIso = today.toISOString().slice(0, 10);

    const dayCellsHTML = cells.map(cell => {
        const iso = `${cell.year}-${String(cell.month + 1).padStart(2, '0')}-${String(cell.day).padStart(2, '0')}`;
        const list = byDate[iso] || [];
        const absents = list.filter(a => a.type === 'absent' && a.status === 'approved').length;
        const lates = list.filter(a => a.type === 'late' && a.status === 'approved').length;
        const pend = list.filter(a => a.status === 'pending').length;
        let badges = '';
        if (absents) badges += `<span class="cal-badge">${absents}</span>`;
        if (lates) badges += `<span class="cal-badge late">${lates}⏰</span>`;
        if (pend) badges += `<span class="cal-badge pending">${pend}?</span>`;
        return `<div class="cal-day ${cell.otherMonth ? 'other-month' : ''} ${iso === todayIso ? 'today' : ''} ${iso === calState.selectedDay ? 'selected' : ''}" data-date="${iso}">
            <div class="day-num">${cell.day}</div>
            <div class="cal-badges">${badges}</div>
        </div>`;
    }).join('');

    let detailsHTML = '';
    if (calState.selectedDay) {
        const list = (byDate[calState.selectedDay] || []).slice();
        if (list.length === 0) {
            detailsHTML = `<div class="card">
                <div class="card-header">${formatDate(calState.selectedDay)}</div>
                <div class="empty"><div class="empty-icon">✨</div>Пропусков нет</div>
            </div>`;
        } else {
            detailsHTML = `<div class="card">
                <div class="card-header">${formatDate(calState.selectedDay)} · ${list.length} записей</div>
                <div class="card-body p-0"><div class="table-wrap"><table>
                    <thead><tr>
                        <th>Ученик</th><th>Класс</th><th>Тип</th>
                        <th>Причина</th><th>Справка</th><th>Статус</th>
                    </tr></thead>
                    <tbody>${list.map(a => {
                        const st = getStudent(a.studentId);
                        const cls = st ? getClass(st.classId) : null;
                        const r = getReason(a.reasonId);
                        return `<tr>
                            <td>${esc(st?.fullName || '—')}</td>
                            <td><b>${esc(cls?.name || '—')}</b></td>
                            <td>${typeCell(a) || '<span class="badge badge-danger">пропуск</span>'}</td>
                            <td>${esc(r?.name || '—')}</td>
                            <td class="cert-cell">${certCell(a, r)}</td>
                            <td>${statusBadge(a.status)}</td>
                        </tr>`;
                    }).join('')}</tbody>
                </table></div></div>
            </div>`;
        }
    }

    document.getElementById('page-calendar').innerHTML = `
        <h1 class="page-title">Календарь</h1>
        <p class="page-subtitle">
            ${session.role === 'student' || session.role === 'parent' ? 'Ваши пропуски' :
              session.role === 'teacher' ? 'Ваш класс' : 'Все классы'}
        </p>

        <div class="card">
            <div class="card-body">
                <div class="calendar-nav">
                    <button class="btn btn-ghost btn-sm" id="cal-prev">← Назад</button>
                    <div class="calendar-month">${MONTHS[month]} ${year}</div>
                    <button class="btn btn-ghost btn-sm" id="cal-next">Вперёд →</button>
                </div>
                <div class="calendar">
                    ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<div class="cal-header">${d}</div>`).join('')}
                    ${dayCellsHTML}
                </div>
                <div style="margin-top:14px; font-size:12px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap;">
                    <span><span class="cal-badge" style="display:inline-block;">n</span> пропуски</span>
                    <span><span class="cal-badge late" style="display:inline-block;">n⏰</span> опоздания</span>
                    <span><span class="cal-badge pending" style="display:inline-block;">n?</span> на рассмотрении</span>
                </div>
            </div>
        </div>

        ${detailsHTML}
    `;

    document.getElementById('cal-prev').onclick = () => {
        if (calState.month === 0) { calState.month = 11; calState.year--; }
        else calState.month--;
        renderCalendarPage();
    };
    document.getElementById('cal-next').onclick = () => {
        if (calState.month === 11) { calState.month = 0; calState.year++; }
        else calState.month++;
        renderCalendarPage();
    };
    document.querySelectorAll('.cal-day').forEach(cell => {
        cell.onclick = () => { calState.selectedDay = cell.dataset.date; renderCalendarPage(); };
    });
}

let schedState = { classId: null };

    }

        schedState.classId = allowedClasses[0].id;
    }
    const cls = getClass(schedState.classId);

                    ${bells.map(b => `

                </div>

    let html = `<h1 class="page-title">Расписание · ${esc(cls.name)}</h1>

    if (!isTeacher && !isStudentOrParent) {
        html += `<div class="card"><div class="card-body">
            <div class="form-group" style="margin:0; max-width:300px;">
                <label class="form-label">Класс</label>
                <select class="select" id="sched-class">
                    ${allowedClasses.map(c =>

                    ).join('')}

    if (canEdit) {

            <div class="card-header">Добавить урок</div>
            <div class="card-body">
                <form id="form-add-lesson" class="inline-form">
                    <div class="form-group">
                        <label class="form-label">День *</label>
                        <select class="select" name="dayOfWeek" required>
                            ${[1,2,3,4,5,6].map(d => `<option value="${d}">${DAYS[d]}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">№ урока *</label>
                        <select class="select" name="lessonNumber" required>
                            ${bells.map(b => `<option value="${b.n}">${b.n} (${b.start}-${b.end})</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Предмет *</label>
                        <input class="input" name="subject" placeholder="Математика" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Учитель</label>
                        <select class="select" name="teacherId">
                            <option value="">—</option>
                            ${teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><button class="btn" type="submit">+ Добавить</button></div>
                </form>
                <div id="sched-msg" style="margin-top:12px;"></div>
            </div>
        </div>`;
    }

    const byDay = {};
    for (let d = 1; d <= 6; d++) byDay[d] = [];
    state.schedule.filter(l => l.classId === cls.id).forEach(l => {
        if (byDay[l.dayOfWeek]) byDay[l.dayOfWeek].push(l);
    });
    Object.values(byDay).forEach(arr => arr.sort((a, b) => a.lessonNumber - b.lessonNumber));

    html += `<div class="card"><div class="card-body">`;
    for (let d = 1; d <= 6; d++) {
        const lessons = byDay[d];
        html += `<div class="day-section">
            <div class="day-header"><span>${DAYS[d]}</span>
            <span class="day-count">${lessons.length} уроков</span></div>
            ${lessons.length ? lessons.map(l => {
                const t = l.teacherId ? getUser(l.teacherId) : null;
                const bell = bells.find(b => b.n === l.lessonNumber);
                return `<div class="lesson-row">
                    <div class="lesson-num">${l.lessonNumber}</div>
                    <div class="lesson-time">${bell ? esc(bell.start)+'–'+esc(bell.end) : esc(l.startTime)+'–'+esc(l.endTime)}</div>
                    <div class="lesson-subject">${esc(l.subject)}</div>
                    <div class="lesson-teacher">${t ? esc(t.name) : ''}</div>
                    ${canEdit ? `<button class="btn btn-ghost btn-sm" data-del-lesson="${l.id}">✕</button>` : ''}

        </div>`;

    html += `</div></div>`;

    document.getElementById('page-schedule').innerHTML = html;

    const classSel = document.getElementById('sched-class');
    if (classSel) classSel.onchange = (e) => {
        schedState.classId = Number(e.target.value);
        renderSchedulePage();
    };

    if (canEdit) {
        document.getElementById('form-add-lesson').onsubmit = (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const dayOfWeek = Number(fd.get('dayOfWeek'));
            const lessonNumber = Number(fd.get('lessonNumber'));
            const subject = (fd.get('subject') || '').trim();
            const teacherId = fd.get('teacherId') ? Number(fd.get('teacherId')) : null;
            if (!subject) return;
            if (state.schedule.some(l => l.classId === cls.id &&
                l.dayOfWeek === dayOfWeek && l.lessonNumber === lessonNumber)) {
                document.getElementById('sched-msg').innerHTML =
                    `<div class="alert alert-error">На ${DAYS[dayOfWeek]} уже есть урок №${lessonNumber}</div>`;
                return;
            }
            state.schedule.push({
                id: nextId(state.schedule), classId: cls.id,
                dayOfWeek, lessonNumber, subject, teacherId,
                startTime: bells[lessonNumber-1]?.start || '08:30',
                endTime: bells[lessonNumber-1]?.end || '09:15'
            });
            save();
            logAction(`Добавил(а) урок: ${cls.name}, ${DAYS[dayOfWeek]}, №${lessonNumber}`);
            renderSchedulePage();
        };
        document.querySelectorAll('[data-del-lesson]').forEach(btn => {
            btn.onclick = () => {
                const id = Number(btn.dataset.delLesson);
                const l = state.schedule.find(x => x.id === id);
                if (!confirm(`Удалить урок «${l.subject}»?`)) return;
                state.schedule = state.schedule.filter(x => x.id !== id);
                save();
                logAction(`Удалил(а) урок: ${cls.name}, ${DAYS[l.dayOfWeek]}`);
                renderSchedulePage();
            };
        });
    }
}

function barsHTML(items) {
    const max = Math.max(...items.map(i => i[1]), 1);
    return items.map(([label, count]) => `
        <div class="bar-row">
            <div class="bar-label">${esc(label)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(count / max) * 100}%"></div></div>
            <div class="bar-value">${count}</div>
        </div>
    `).join('');
}
function donutHTML(catCount) {
    const colors = { 'уважительная': '#16a34a', 'неуважительная': '#f59e0b', 'особая': '#6b7280' };
    const total = Object.values(catCount).reduce((a, b) => a + b, 0) || 1;
    let acc = 0; const segments = [];
    Object.entries(catCount).forEach(([cat, count]) => {
        const from = (acc / total) * 360;
        acc += count;
        const to = (acc / total) * 360;
        segments.push(`${colors[cat] || '#cbd5e1'} ${from}deg ${to}deg`);
    });
    const gradient = `conic-gradient(${segments.join(',')})`;
    const legend = Object.entries(catCount).map(([cat, count]) => `
        <div class="legend-item">
            <span class="legend-dot" style="background:${colors[cat] || '#cbd5e1'};"></span>
            <span>${esc(cat)}: <b>${count}</b></span>
        </div>
    `).join('');
    return `<div class="donut-wrap"><div class="donut" style="background:${gradient};"></div><div class="legend">${legend}</div></div>`;
}

            const cnt = getStudentsOfClass(id).length;
            if (cnt > 0) { msg(`Нельзя удалить: в классе ${cnt} учеников`, 'error'); return; }
            if (!confirm(`Удалить класс «${c.name}»?`)) return;
            state.classes = state.classes.filter(x => x.id !== id);
            save();
            logAction(`Удалил(а) класс: ${c.name}`);
            renderManagePage();
        };
    });
    document.querySelectorAll('[data-del-student]').forEach(btn => {
        btn.onclick = () => {
            const id = Number(btn.dataset.delStudent);
            const s = getStudent(id);
            if (!confirm(`Удалить ученика «${s.fullName}»?`)) return;
            state.students = state.students.filter(x => x.id !== id);
            state.absences = state.absences.filter(a => a.studentId !== id);
            state.users.forEach(u => { if (u.studentId === id) u.studentId = null; });
            save();
            logAction(`Удалил(а) ученика: ${s.fullName}`);
            renderManagePage();
        };
    });
}

                    </div>
                    <div class="form-group hidden" id="new-user-student-wrap">
                        <label class="form-label">Связанный ученик</label>
                        <select class="select" name="studentId" id="new-user-student">

                    <div class="form-group"><button class="btn" type="submit">+ Создать</button></div>
                </form>
            </div>
        </div>
        <div class="card">
            <div class="card-header">Все аккаунты (${state.users.length})</div>
            <div class="card-body p-0"><div class="table-wrap"><table>
                <thead><tr><th>ФИО</th><th>Логин</th><th>Роль</th><th>Ученик</th><th></th></tr></thead>
                <tbody>${userRows}</tbody>
            </table></div></div>
        </div>
    `;
    const msg = (text, type = 'success') => {
        document.getElementById('acc-msg').innerHTML = `<div class="alert alert-${type}">${text}</div>`;
    };
    const roleSel = document.getElementById('new-user-role');
    const studentWrap = document.getElementById('new-user-student-wrap');
    roleSel.onchange = () => {
        studentWrap.classList.toggle('hidden', roleSel.value !== 'student' && roleSel.value !== 'parent');
    };
    document.getElementById('form-add-user').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const name = (fd.get('name') || '').trim();
        const username = (fd.get('username') || '').trim();
        const password = (fd.get('password') || '').trim();
        const role = fd.get('role');
        const studentId = (role === 'student' || role === 'parent') && fd.get('studentId')
            ? Number(fd.get('studentId')) : null;
        if (!name || !username || !password) { msg('Заполните все поля', 'error'); return; }
        if (state.users.some(u => u.username === username)) { msg('Логин занят', 'error'); return; }
        if ((role === 'student' || role === 'parent') && !studentId) {
            msg('Выберите связанного ученика', 'error'); return;
        }
        const hash = await hashPassword(password);
        state.users.push({ id: nextId(state.users), username, password: hash, role, name, studentId });
        save();
        logAction(`Создал(а) аккаунт: ${name} (${roleLabel(role)})`);
        renderAccountsPage();
    };
    document.querySelectorAll('[data-reset-pass]').forEach(btn => {
        btn.onclick = async () => {
            const id = Number(btn.dataset.resetPass);
            const u = getUser(id);

            msg(`Пароль для «${esc(u.name)}» изменён`);

    });
    document.querySelectorAll('[data-del-user]').forEach(btn => {
        btn.onclick = () => {

            if (!confirm(`Удалить аккаунт «${u.name}»?`)) return;
            state.users = state.users.filter(x => x.id !== id);
            state.classes.forEach(c => { if (c.teacherId === id) c.teacherId = null; });
            save();
            logAction(`Удалил(а) аккаунт: ${u.name}`);
            renderAccountsPage();
        };
    });
}

/* ================================================================

function exportCSV() {
    const rows = [['Класс', 'Ученик', 'Дата', 'Тип', 'Причина', 'Категория', 'Справка', 'Время опоздания', 'Статус', 'Комментарий']];
    [...state.absences].sort((a, b) => b.date.localeCompare(a.date)).forEach(a => {
        const s = getStudent(a.studentId);
        const r = getReason(a.reasonId);
        const c = s ? getClass(s.classId) : null;
        rows.push([
            c ? c.name : '', s ? s.fullName : '', a.date,
            a.type === 'late' ? 'опоздание' : 'пропуск',
            r?.name || '', r?.category || '',
            a.hasCertificate ? 'да' : (r?.requiresCertificate ? 'нет' : ''),
            a.lateTime || '', a.status || 'approved', a.comment || ''
        ]);
    });
    const csv = '\ufeff' + rows.map(row =>
        row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';')
    ).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'absences_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

/* ================================================================
   22. СТАРТ
   ================================================================ */
document.addEventListener('DOMContentLoaded', () => {
    // Проверяем ?checkin=...
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('checkin');
    if (token) {
        pendingCheckin = token;
        window.history.replaceState({}, '', window.location.pathname);
    }

    loadSession();
    try {
        const savedPage = localStorage.getItem(PAGE_KEY);
        if (savedPage && PAGES.includes(savedPage)) currentPage = savedPage;
    } catch (e) {}

    document.getElementById('login-form').addEventListener('submit', handleLogin);
    document.getElementById('logout-btn').addEventListener('click', handleLogout);
    document.getElementById('forgot-link').addEventListener('click', e => {
        e.preventDefault(); showLoginPanel('forgot');
    });
    document.getElementById('back-to-login').addEventListener('click', e => {
        e.preventDefault(); showLoginPanel('main');
    });
    document.getElementById('forgot-gen-btn').addEventListener('click', forgotGenerate);
    document.getElementById('forgot-save-btn').addEventListener('click', forgotSave);
    document.getElementById('forgot-user').addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); forgotGenerate(); }
    });

    function tryStartFirebase() {
        if (window._firebase) initFirebaseSync();
        else setTimeout(tryStartFirebase, 100);
    }
    tryStartFirebase();

    if (session) {
        const wait = setInterval(() => {
            if (state) {
                clearInterval(wait);
                renderApp();
                if (pendingCheckin) {
                    // Отмечаем через 0.5 сек после рендера
                    setTimeout(() => processCheckin(pendingCheckin), 500);
                }
            }
        }, 100);
        setTimeout(() => {
            clearInterval(wait);
            if (!state) { loadFromLocal(); renderApp(); }
        }, 5000);
    } else {
        renderLogin();
    }
});
