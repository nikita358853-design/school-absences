<body>
<div id="app">
  <div class="loading">

    <div>Загрузка данных…</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   КОНСТАНТЫ
   ============================================================ */
const STORAGE_KEY = 'school_absence_v2';
const SESSION_KEY = 'school_absence_session';
const FB_PATH = 'schoolData';

const CLASSES = (() => {
  const arr = [];
  for (let g = 1; g <= 9; g++) for (const l of ['А','Б','В']) arr.push(g + l);
  arr.push('10', '11');
  return arr;
})();

const SUBJECTS_JUNIOR = ['Русский язык','Литературное чтение','Иностранный язык','Математика','Окружающий мир','Основы религиозных культур и светской этики','Изобразительное искусство','Музыка','Труд (технология)','Физическая культура'];
const SUBJECTS_MIDDLE = ['Русский язык','Литература','Иностранный язык','Математика','Информатика','История','Обществознание (с 2026 года — с 9 класса)','География','Физика','Химия','Биология','Изобразительное искусство','Музыка','Труд (технология)','Физическая культура','Основы безопасности и защиты Родины'];
const SUBJECTS_SENIOR = ['Русский язык','Литература','Иностранный язык','Математика','Информатика','История','Обществознание','Правовая культура','Экономика','География','Физика','Химия','Биология','Физическая культура','Основы безопасности и защиты Родины'];

function getSubjects(cls) {
  const g = parseInt(cls, 10);
  if (g <= 4) return SUBJECTS_JUNIOR;
  if (g <= 9) return SUBJECTS_MIDDLE;
  return SUBJECTS_SENIOR;
}

const REASONS = [
  { id: 'sick',       name: 'Болезнь',                    type: 'good' },
  { id: 'statement',  name: 'По заявлению родителей',     type: 'good' },
  { id: 'family',     name: 'Семейные обстоятельства',    type: 'good' },
  { id: 'sport',      name: 'Спортивные соревнования',    type: 'good' },
  { id: 'olymp',      name: 'Олимпиада / конкурс',        type: 'good' },
  { id: 'disrespect', name: 'Неуважительная причина',     type: 'bad' },
  { id: 'late',       name: 'Опоздание',                  type: 'bad' },
  { id: 'other',      name: 'Другое',                     type: 'neutral' }
];

function reasonById(id) { return REASONS.find(r => r.id === id) || REASONS[REASONS.length - 1]; }

/* ============================================================
   БАЗОВЫЕ УТИЛИТЫ
   ============================================================ */
function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
  return 'h' + Math.abs(h).toString(36);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function buildSeedData() {
  const names = ['Иванов Иван','Петрова Мария','Сидоров Пётр','Кузнецова Анна','Смирнов Дмитрий','Волкова Екатерина'];
  const students = [];
  for (const c of CLASSES) for (const n of names) students.push({ id: uid(), class: c, name: n, pin: simpleHash('1234') });
  return { students, absences: [], teachers: [], parents: [], periods: {}, currentPeriod: {}, log: [], notifications: [] };
}
function loadLocalData() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return buildSeedData();
}

let data = loadLocalData();
if (!data.teachers) data.teachers = [];
if (!data.parents) data.parents = [];
if (!data.periods) data.periods = {};
if (!data.currentPeriod) data.currentPeriod = {};
if (!data.log) data.log = [];
if (!data.notifications) data.notifications = [];

let firebaseReady = false;
let firebaseConnected = false;

/* ============================================================
   СОХРАНЕНИЕ (локально + Firebase)
   ============================================================ */
let saveTimer = null;
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  if (!firebaseReady || !window.firebaseDB) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const { db, ref, set } = window.firebaseDB;
      await set(ref(db, FB_PATH), data);
      firebaseConnected = true; updateStatusBadge();
    } catch (e) {
      firebaseConnected = false; updateStatusBadge();
      console.error('Firebase save error:', e);
    }
  }, 400);
}

/* ============================================================
   ИСТОРИЯ ИЗМЕНЕНИЙ
   ============================================================ */
function logAction(action, details) {
  if (!data.log) data.log = [];
  data.log.push({
    time: new Date().toISOString(),
    user: session ? session.name : '—',
    role: session ? session.role : '—',
    action: action,
    details: details || ''
  });
  if (data.log.length > 500) data.log = data.log.slice(-500);
  saveData();
}

/* ============================================================
   УВЕДОМЛЕНИЯ
   ============================================================ */
function requestNotificationPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission().then(p => {
      if (p === 'granted') toast('Уведомления включены');
    });
  } else if (Notification.permission === 'granted') {
    toast('Уведомления уже включены');
  } else {
    toast('Уведомления заблокированы в браузере', true);
  }
}

function showNativeNotification(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  try {
    new Notification(title, { body: body, icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>' });
  } catch (e) {}
}

function pushNotification(toRole, toUser, message, detail) {
  if (!data.notifications) data.notifications = [];
  data.notifications.push({
    id: uid(),
    toRole, toUser, message, detail: detail || '',
    from: session ? session.name : '—',
    time: new Date().toISOString(),
    read: false
  });
  if (data.notifications.length > 100) data.notifications = data.notifications.slice(-100);
  saveData();

  // Если текущий пользователь — получатель, показать native уведомление
  if (session && session.role === toRole && session.name === toUser) {
    showNativeNotification('Учёт пропусков', message);
  }
}

function getMyNotifications() {
  if (!session || !data.notifications) return [];
  return data.notifications
    .filter(n => n.toRole === session.role && n.toUser === session.name)
    .sort((a, b) => (b.time || '').localeCompare(a.time || ''));
}

function unreadCount() {
  return getMyNotifications().filter(n => !n.read).length;
}

function markAllRead() {
  if (!data.notifications) return;
  let changed = false;
  data.notifications.forEach(n => {
    if (n.toRole === session.role && n.toUser === session.name && !n.read) {
      n.read = true; changed = true;
    }
  });
  if (changed) saveData();
}

/* ============================================================
   СИНХРОНИЗАЦИЯ С FIREBASE
   ============================================================ */
async function initFirebaseSync() {
  if (!window.firebaseDB) { firebaseReady = true; return false; }
  const { db, ref, set, onValue } = window.firebaseDB;
  const dataRef = ref(db, FB_PATH);

  return new Promise((resolve) => {
    let firstLoad = true;
    onValue(dataRef, (snap) => {
      const incoming = snap.val();
      if (!incoming) {
        const seeded = buildSeedData();
        set(dataRef, seeded).then(() => {});
        return;
      }
      if (incoming.students || incoming.absences) {
        data = {
          students: incoming.students || [],
          absences: incoming.absences || [],
          teachers: incoming.teachers || [],
          parents: incoming.parents || [],
          periods: incoming.periods || {},
          currentPeriod: incoming.currentPeriod || {},
          log: incoming.log || [],
          notifications: incoming.notifications || []
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
      firebaseConnected = true;
      updateStatusBadge();
      if (firstLoad) { firstLoad = false; resolve(true); }
      else if (session) renderApp();
    }, (error) => {
      console.error('Firebase subscribe error:', error);
      firebaseConnected = false; updateStatusBadge(); resolve(false);
    });
    setTimeout(() => resolve(false), 5000);
  });
}

function updateStatusBadge() {
  const badge = document.getElementById('syncStatus');
  if (!badge) return;
  if (!firebaseReady) badge.innerHTML = '<span class="status-dot offline"></span>Локально';
  else if (firebaseConnected) badge.innerHTML = '<span class="status-dot online"></span>Онлайн — синхронизация с облаком';
  else badge.innerHTML = '<span class="status-dot offline"></span>Офлайн — нет связи';
}

function defaultPeriodsForClass(cls) {
  const grade = parseInt(cls, 10);
  const year = new Date().getFullYear();
  const startYear = new Date().getMonth() >= 7 ? year : year - 1;
  const y1 = startYear, y2 = startYear + 1;
  if (grade >= 10) return [
    { name: 'I полугодие',  start: y1 + '-09-01', end: y1 + '-12-28' },
    { name: 'II полугодие', start: y2 + '-01-09', end: y2 + '-05-25' },
    { name: 'Весь год',     start: y1 + '-09-01', end: y2 + '-05-31' }
  ];
  return [
    { name: 'I четверть',   start: y1 + '-09-01', end: y1 + '-10-27' },
    { name: 'II четверть',  start: y1 + '-11-05', end: y1 + '-12-28' },
    { name: 'III четверть', start: y2 + '-01-09', end: y2 + '-03-22' },
    { name: 'IV четверть',  start: y2 + '-04-01', end: y2 + '-05-25' },
    { name: 'Весь год',     start: y1 + '-09-01', end: y2 + '-05-31' }
  ];
}

function ensurePeriods(cls) {
  if (!data.periods) data.periods = {};
  if (!data.periods[cls]) data.periods[cls] = defaultPeriodsForClass(cls);
  if (!data.currentPeriod) data.currentPeriod = {};
  if (data.currentPeriod[cls] === undefined) data.currentPeriod[cls] = data.periods[cls].length - 1;
  saveData();
}
function getCurrentPeriod(cls) { ensurePeriods(cls); return data.periods[cls][data.currentPeriod[cls]]; }
function filterByPeriod(rows, cls) {
  const p = getCurrentPeriod(cls);
  if (!p) return rows;
  return rows.filter(a => a.date >= p.start && a.date <= p.end);
}
function periodSelectorHTML(cls) {
  ensurePeriods(cls);
  const periods = data.periods[cls];
  const cur = data.currentPeriod[cls];
  const options = periods.map((p, i) => '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + escapeHtml(p.name) + '</option>').join('');
  return '<select id="periodSelect" class="period-select">' + options + '</select>' +
    '<span class="period-dates">' + escapeHtml(formatDate(periods[cur].start)) + ' — ' + escapeHtml(formatDate(periods[cur].end)) + '</span>';
}

/* ============================================================
   УТИЛИТЫ (HTML)
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function optionsHTML(items, selected, valueKey) {
  return items.map(item => {
    const val = valueKey ? item[valueKey] : item;
    const label = valueKey ? item.name : item;
    return '<option value="' + escapeHtml(val) + '"' + (val === selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
  }).join('');
}
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, 2200);
}
function todayISO() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function formatDate(iso) { if (!iso) return ''; const p = iso.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function formatDateTime(iso) {
  if (!iso) return '';
  try { const d = new Date(iso); return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); } catch (e) { return iso; }
}
function getStudentsOfClass(cls) { return data.students.filter(s => s.class === cls).sort((a, b) => a.name.localeCompare(b.name, 'ru')); }

/* ============================================================

   ============================================================ */
function drawCharts(absences, canvasPrefix) {
  if (typeof Chart === 'undefined') return;
  if (window._charts) window._charts.forEach(c => c.destroy());
  window._charts = [];

  const reasonCounts = {};
  absences.forEach(a => { const n = reasonById(a.reason).name; reasonCounts[n] = (reasonCounts[n] || 0) + 1; });
  const pieCanvas = document.getElementById(canvasPrefix + 'ReasonChart');
  if (pieCanvas) {
    const colors = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
    window._charts.push(new Chart(pieCanvas, {
      type: 'doughnut',
      data: { labels: Object.keys(reasonCounts), datasets: [{ data: Object.values(reasonCounts), backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } }
    }));
  }
  const monthCounts = {};
  absences.forEach(a => { const m = a.date.slice(0, 7); monthCounts[m] = (monthCounts[m] || 0) + 1; });
  const sortedMonths = Object.keys(monthCounts).sort();
  const monthNames = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const monthLabels = sortedMonths.map(m => { const p = m.split('-'); return monthNames[+p[1] - 1] + ' ' + p[0].slice(2); });
  const barCanvas = document.getElementById(canvasPrefix + 'MonthChart');
  if (barCanvas) {
    window._charts.push(new Chart(barCanvas, {
      type: 'bar',
      data: { labels: monthLabels, datasets: [{ label: 'Пропусков', data: sortedMonths.map(m => monthCounts[m]), backgroundColor: '#3b82f6', borderRadius: 6 }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    }));
  }
}

let uiState = {
  filterReason: '', filterStudent: '', filterDate: '',
  newStudentName: '',
  adminSelectedClass: CLASSES[0],
  searchQuery: '',
  sortBy: 'date',   // 'date' | 'name' | 'reason' | 'subject'
  sortDir: 'desc',
  logFilter: ''
};

function sortAbsences(rows) {
  const dir = uiState.sortDir === 'asc' ? 1 : -1;
  return [...rows].sort((a, b) => {
    let va, vb;
    if (uiState.sortBy === 'date') { va = a.date || ''; vb = b.date || ''; }
    else if (uiState.sortBy === 'name') { va = a.studentName || ''; vb = b.studentName || ''; }
    else if (uiState.sortBy === 'reason') { va = reasonById(a.reason).name; vb = reasonById(b.reason).name; }
    else if (uiState.sortBy === 'subject') { va = a.subject || ''; vb = b.subject || ''; }
    else { va = a.date || ''; vb = b.date || ''; }
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
}

function applySearch(rows) {
  const q = (uiState.searchQuery || '').toLowerCase().trim();
  if (!q) return rows;
  return rows.filter(a => (a.studentName || '').toLowerCase().includes(q));
}

/* ============================================================
   ОБЩАЯ ТАБЛИЦА ПРОПУСКОВ
   ============================================================ */
function renderAbsencesTable(rows, withActions, withParentComment) {
  if (!rows.length) return '<div class="empty">Записей нет</div>';
  const arrowDate = uiState.sortBy === 'date' ? (uiState.sortDir === 'asc' ? '▲' : '▼') : '↕';
  const arrowName = uiState.sortBy === 'name' ? (uiState.sortDir === 'asc' ? '▲' : '▼') : '↕';
  const arrowReason = uiState.sortBy === 'reason' ? (uiState.sortDir === 'asc' ? '▲' : '▼') : '↕';

  const body = rows.map(a => {
    const r = reasonById(a.reason);
    const srcLabel = a.addedByRole === 'student'
      ? '<span class="source-tag student">добавил ученик</span>'
      : '<span class="source-tag teacher">добавил учитель</span>';
    const commentHTML = a.parentComment ? '<span class="parent-comment-tag">💬 Родитель: ' + escapeHtml(a.parentComment) + '</span>' : '';

    let row = '<tr>';
    row += '<td data-label="Дата">' + escapeHtml(formatDate(a.date)) + '</td>';
    row += '<td data-label="ФИО">' + escapeHtml(a.studentName) + '</td>';
    row += '<td data-label="Класс">' + escapeHtml(a.class) + '</td>';
    row += '<td data-label="Предмет">' + escapeHtml(a.subject) + '</td>';
    row += '<td data-label="Причина"><span class="reason-tag ' + r.type + '">' + escapeHtml(r.name) + '</span>' + srcLabel + '</td>';
    row += '<td data-label="Примечание">' + escapeHtml(a.note || '—') + commentHTML + '</td>';
    if (withParentComment && session.role === 'parent') {
      row += '<td><button class="btn btn-secondary btn-sm" data-parent-comment="' + a.id + '">💬 Комментарий</button></td>';
    }
    if (withActions) row += '<td><button class="btn btn-danger btn-sm" data-del-abs="' + a.id + '">Удалить</button></td>';
    row += '</tr>';
    return row;
  }).join('');

  const parentCol = withParentComment && session.role === 'parent' ? '<th></th>' : '';

  return '<table><thead><tr>' +
    '<th class="sortable" data-sort="date">Дата<span class="sort-arrow ' + (uiState.sortBy === 'date' ? 'active' : '') + '">' + arrowDate + '</span></th>' +
    '<th class="sortable" data-sort="name">ФИО ученика<span class="sort-arrow ' + (uiState.sortBy === 'name' ? 'active' : '') + '">' + arrowName + '</span></th>' +
    '<th>Класс</th>' +
    '<th class="sortable" data-sort="subject">Предмет</th>' +
    '<th class="sortable" data-sort="reason">Причина<span class="sort-arrow ' + (uiState.sortBy === 'reason' ? 'active' : '') + '">' + arrowReason + '</span></th>' +
    '<th>Примечание</th>' +
    parentCol +
    (withActions ? '<th></th>' : '') +
    '</tr></thead><tbody>' + body + '</tbody></table>';
}

function bindSortHandlers() {
  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (uiState.sortBy === key) {
        uiState.sortDir = uiState.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        uiState.sortBy = key;
        uiState.sortDir = 'desc';
      }
      renderApp();
    });
  });
}

function bellHTML() {
  const count = unreadCount();
  if (count === 0) return '<div class="bell-wrap"><button class="bell-btn" id="bellBtn">🔔</button></div>';
  return '<div class="bell-wrap"><button class="bell-btn" id="bellBtn">🔔<span class="bell-count">' + count + '</span></button></div>';
}

function bindBell() {
  const btn = document.getElementById('bellBtn');
  if (!btn) return;
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const existing = document.getElementById('notifPanel');
    if (existing) { existing.remove(); return; }
    const notifs = getMyNotifications();
    const panel = document.createElement('div');
    panel.className = 'notif-panel';
    panel.id = 'notifPanel';
    if (!notifs.length) {
      panel.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">Уведомлений нет</div>';
    } else {
      panel.innerHTML = notifs.slice(0, 20).map(n =>
        '<div class="notif-item' + (n.read ? '' : ' unread') + '">' +
        '<div class="n-title">' + escapeHtml(n.message) + '</div>' +
        (n.detail ? '<div class="n-text">' + escapeHtml(n.detail) + '</div>' : '') +
        '<div class="n-time">' + escapeHtml(formatDateTime(n.time)) + '</div>' +
        '</div>'
      ).join('');
    }
    document.body.appendChild(panel);
    markAllRead();
    setTimeout(() => {
      document.addEventListener('click', function close() {
        const p = document.getElementById('notifPanel');
        if (p) p.remove();
        document.removeEventListener('click', close);
      });
    }, 10);
  });
}

let session = null;

function saveSession() {
  if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  else localStorage.removeItem(SESSION_KEY);
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s.role === 'teacher') {
      const t = data.teachers.find(x => x.name === s.name);
      if (!t) return null;
      s.class = t.class;
    }
    if (s.role === 'student') {
      const st = data.students.find(x => x.class === s.class && x.name === s.name);
      if (!st) return null;
    }
    if (s.role === 'parent') {
      const st = data.students.find(x => x.class === s.class && x.name === s.name);
      if (!st) return null;
    }
    return s;
  } catch (e) { return null; }
}

let loginState = { role: 'teacher', teacherName: '', teacherClass: CLASSES[0], studentClass: CLASSES[0], studentName: '' };

/* ============================================================

const ADMIN_PASSWORD_HASH = simpleHash('admin1441');
function isAdminPassword(pwd) { return simpleHash(pwd) === ADMIN_PASSWORD_HASH; }

/* ============================================================
   ГЛАВНЫЙ РЕНДЕР
   ============================================================ */
function renderApp() {
  if (!session) { renderLogin(); return; }
  if (session.role === 'admin') renderAdmin();
  else if (session.role === 'teacher') renderTeacher();
  else if (session.role === 'student') renderStudent();
  else if (session.role === 'parent') renderParent();
  else { session = null; saveSession(); renderLogin(); }
}

/* ============================================================
   ЛОГИН
   ============================================================ */
function renderLogin() {
  const app = document.getElementById('app');
  const studentNames = getStudentsOfClass(loginState.studentClass).map(s => s.name);
  if (!studentNames.includes(loginState.studentName)) loginState.studentName = studentNames[0] || '';

  let formHTML = '';
  if (loginState.role === 'teacher') {
    formHTML = '<label for="tName">ФИО классного руководителя</label>' +
      '<input type="text" id="tName" placeholder="Иванова И.И." value="' + escapeHtml(loginState.teacherName) + '" required>' +
      '<label for="tPin">PIN-код</label>' +
      '<input type="password" id="tPin" placeholder="••••" inputmode="numeric" maxlength="8" required autocomplete="off">';
  } else if (loginState.role === 'admin') {
    formHTML = '<label for="adminPwd">Пароль администратора</label>' +
      '<input type="password" id="adminPwd" placeholder="••••••••" required autocomplete="off">';
  } else if (loginState.role === 'student' || loginState.role === 'parent') {
    const sNamesHTML = studentNames.length
      ? optionsHTML(studentNames, loginState.studentName)
      : '<option>— в классе нет учеников —</option>';
    formHTML = '<label for="sClass">Класс</label>' +
      '<select id="sClass">' + optionsHTML(CLASSES, loginState.studentClass) + '</select>' +
      '<label for="sName">ФИО ' + (loginState.role === 'parent' ? 'ребёнка' : 'ученика') + '</label>' +
      '<select id="sName"' + (studentNames.length ? '' : ' disabled') + '>' + sNamesHTML + '</select>';
  }

  app.innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
    '<h1>Учёт пропусков</h1>' +
    '<p class="subtitle">Школьная система учёта пропусков и причин</p>' +
    '<div class="role-tabs">' +
      '<button class="role-tab ' + (loginState.role === 'teacher' ? 'active' : '') + '" data-role="teacher">Учитель</button>' +
      '<button class="role-tab ' + (loginState.role === 'student' ? 'active' : '') + '" data-role="student">Ученик</button>' +
      '<button class="role-tab ' + (loginState.role === 'parent' ? 'active' : '') + '" data-role="parent">Родитель</button>' +
      '<button class="role-tab ' + (loginState.role === 'admin' ? 'active' : '') + '" data-role="admin">Админ</button>' +
    '</div>' +
    '<form id="loginForm">' + formHTML +
    '<button type="submit" class="btn btn-full">Войти в систему</button>' +
    '<div style="text-align:center; margin-top:14px;"><a href="#" id="forgotPin" style="color:#2563eb; font-size:13px; text-decoration:none;">Забыли PIN?</a></div>' +
    '<div style="text-align:center; margin-top:12px; font-size:12px; color:#64748b;" id="syncStatus"></div>' +
    '</form></div></div>';

  updateStatusBadge();

  document.querySelectorAll('.role-tab').forEach(tab => {
    tab.addEventListener('click', () => { loginState.role = tab.dataset.role; renderLogin(); });
  });

  const tName = document.getElementById('tName');
  const sClass = document.getElementById('sClass');
  const sName = document.getElementById('sName');
  if (tName) tName.addEventListener('input', () => loginState.teacherName = tName.value);
  if (sClass) sClass.addEventListener('change', () => { loginState.studentClass = sClass.value; renderLogin(); });
  if (sName) sName.addEventListener('change', () => loginState.studentName = sName.value);

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();

    if (loginState.role === 'teacher') {
      const name = (tName.value || '').trim();
      const pinValue = (document.getElementById('tPin')?.value || '').trim();
      if (!name) return toast('Введите ФИО', true);
      if (!pinValue) return toast('Введите PIN-код', true);
      const teacher = findTeacher(name);
      if (!teacher) return toast('Учитель не зарегистрирован. Обратитесь к администратору.', true);
      if (simpleHash(pinValue) !== teacher.pin) {
        document.getElementById('tPin').value = '';
        return toast('Неверный PIN-код', true);
      }
      session = { role: 'teacher', name: teacher.name, class: teacher.class };
      logAction('login', 'Учитель вошёл в систему');
    } else if (loginState.role === 'admin') {
      const pwd = document.getElementById('adminPwd').value;
      if (!pwd) return toast('Введите пароль', true);
      if (!isAdminPassword(pwd)) return toast('Неверный пароль администратора', true);
      session = { role: 'admin', name: 'Администратор' };
      logAction('login', 'Администратор вошёл в систему');

      if (!loginState.studentName) return toast('Выберите ученика', true);
      const st = data.students.find(s => s.class === sClass.value && s.name === loginState.studentName);

      const entered = prompt('Введите PIN для "' + st.name + '"\n\nЕсли не меняли — введите 1234');
      if (entered === null) return;
      if (simpleHash(entered) !== st.pin) return toast('Неверный PIN. Попробуйте 1234', true);
      session = { role: loginState.role, name: loginState.studentName, class: sClass.value };
      logAction('login', (loginState.role === 'parent' ? 'Родитель' : 'Ученик') + ' вошёл как ' + loginState.studentName);
    }

    ensurePeriods(session.class);
    saveSession();
    uiState = { filterReason: '', filterStudent: '', filterDate: '', newStudentName: '', adminSelectedClass: CLASSES[0], searchQuery: '', sortBy: 'date', sortDir: 'desc', logFilter: '' };
    renderApp();
  });

  const forgot = document.getElementById('forgotPin');

    forgot.addEventListener('click', (e) => {
      e.preventDefault();
      const master = prompt('Введите мастер-пароль для сброса PIN\n(по умолчанию: school21)');
      if (master !== 'school21') return toast('Неверный мастер-пароль', true);
      const targetName = prompt('Чьё ФИО сбросить?');
      if (!targetName) return;
      const t = findTeacher(targetName);
      const s = data.students.find(st => st.name.toLowerCase() === targetName.toLowerCase());
      if (t) { t.pin = simpleHash('1234'); saveData(); logAction('upd', 'Сброшен PIN учителя ' + t.name); toast('PIN учителя сброшен на 1234'); }
      else if (s) { s.pin = simpleHash('1234'); saveData(); logAction('upd', 'Сброшен PIN ученика ' + s.name); toast('PIN ученика сброшен на 1234'); }
      else toast('Пользователь не найден', true);
    });
  }
}

function findTeacher(name) {
  if (!data.teachers) data.teachers = [];
  return data.teachers.find(t => t.name.toLowerCase() === name.toLowerCase());
}

function bindTeacherEvents() {
  document.getElementById('logoutBtn').addEventListener('click', () => {
    logAction('login', 'Выход из системы');
    session = null; saveSession(); renderApp();
  });

  document.getElementById('periodSelect')?.addEventListener('change', e => {
    data.currentPeriod[session.class] = parseInt(e.target.value, 10);
    saveData(); renderTeacher();
  });

  document.getElementById('printBtn')?.addEventListener('click', () => {
    const period = getCurrentPeriod(session.class);
    printJournal(session.class, period.name);
  });

  document.getElementById('notifyPermBtn')?.addEventListener('click', requestNotificationPermission);

  document.getElementById('changeTeacherPinBtn')?.addEventListener('click', () => {
    const teacher = findTeacher(session.name);
    if (!teacher) return toast('Ошибка: учитель не найден', true);
    const oldPin = prompt('Текущий PIN:');
    if (oldPin === null) return;
    if (simpleHash(oldPin) !== teacher.pin) return toast('Неверный текущий PIN', true);
    const newPin = prompt('Новый PIN (минимум 4 цифры):');
    if (newPin === null) return;
    if (!/^\d{4,}$/.test(newPin)) return toast('PIN должен быть минимум 4 цифры', true);
    const confirmPin = prompt('Повторите новый PIN:');
    if (confirmPin !== newPin) return toast('PIN не совпадает', true);
    teacher.pin = simpleHash(newPin);
    saveData();
    logAction('upd', 'Учитель сменил PIN');
    toast('PIN изменён');
  });

  document.getElementById('absenceForm').addEventListener('submit', e => {
    e.preventDefault();
    const date = document.getElementById('aDate').value;
    const studentName = document.getElementById('aStudent').value;
    const subject = document.getElementById('aSubject').value;
    const reason = document.getElementById('aReason').value;
    const note = document.getElementById('aNote').value.trim();
    if (!date || !studentName || !subject || !reason) return toast('Заполните все поля', true);
    data.absences.push({ id: uid(), date, class: session.class, studentName, subject, reason, note, addedBy: session.name, addedByRole: 'teacher' });
    logAction('add', 'Добавлен пропуск: ' + studentName + ' (' + date + ') — ' + reasonById(reason).name);
    saveData();
    toast('Запись добавлена');
    renderTeacher();
  });

  document.getElementById('searchInput')?.addEventListener('input', e => {
    uiState.searchQuery = e.target.value;
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => {
      const input = document.getElementById('searchInput');
      const val = input ? input.value : '';
      const pos = input ? input.selectionStart : 0;
      renderTeacher();
      const newInput = document.getElementById('searchInput');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(pos, pos); }
    }, 300);
  });

  document.getElementById('fStudent').addEventListener('change', e => { uiState.filterStudent = e.target.value; renderTeacher(); });
  document.getElementById('fReason').addEventListener('change', e => { uiState.filterReason = e.target.value; renderTeacher(); });
  document.getElementById('fDate').addEventListener('change', e => { uiState.filterDate = e.target.value; renderTeacher(); });
  document.getElementById('clearFilters').addEventListener('click', () => {
    uiState.filterReason = ''; uiState.filterStudent = ''; uiState.filterDate = ''; uiState.searchQuery = '';
    renderTeacher();
  });

  document.querySelectorAll('[data-reset-pin]').forEach(btn => {
    btn.addEventListener('click', () => {
      const st = data.students.find(s => s.id === btn.dataset.resetPin);
      if (!st) return;
      if (!confirm('Сбросить PIN для "' + st.name + '"?')) return;
      st.pin = simpleHash('1234');
      logAction('upd', 'Сброшен PIN ученика ' + st.name);
      saveData();
      toast('PIN сброшен на 1234');
    });
  });

  document.querySelectorAll('[data-del-abs]').forEach(btn => {
    btn.addEventListener('click', () => {
      const abs = data.absences.find(a => a.id === btn.dataset.delAbs);
      if (!abs) return;
      if (!confirm('Удалить запись?')) return;
      data.absences = data.absences.filter(a => a.id !== btn.dataset.delAbs);
      logAction('del', 'Удалён пропуск: ' + abs.studentName + ' (' + formatDate(abs.date) + ')');
      saveData();
      toast('Запись удалена');
      renderTeacher();
    });
  });

  document.getElementById('addStudentForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = (document.getElementById('newStudentName').value || '').trim();
    if (!name) return toast('Введите ФИО', true);
    const exists = data.students.some(s => s.class === session.class && s.name.toLowerCase() === name.toLowerCase());
    if (exists) return toast('Такой ученик уже есть', true);
    data.students.push({ id: uid(), class: session.class, name, pin: simpleHash('1234') });
    logAction('add', 'Добавлен ученик ' + name + ' в ' + session.class);
    saveData();
    uiState.newStudentName = '';
    toast('Ученик добавлен (PIN 1234)');
    renderTeacher();
  });
  document.getElementById('newStudentName').addEventListener('input', e => { uiState.newStudentName = e.target.value; });

  document.querySelectorAll('[data-del-student]').forEach(btn => {
    btn.addEventListener('click', () => {
      const st = data.students.find(s => s.id === btn.dataset.delStudent);
      if (!st) return;
      if (!confirm('Удалить ученика "' + st.name + '"?')) return;
      data.students = data.students.filter(s => s.id !== st.id);
      data.absences = data.absences.filter(a => !(a.class === st.class && a.studentName === st.name));
      logAction('del', 'Удалён ученик ' + st.name + ' из ' + st.class);
      saveData();
      toast('Ученик удалён');
      renderTeacher();
    });
  });

  document.querySelectorAll('[data-pname]').forEach(inp => {
    inp.addEventListener('change', e => { data.periods[session.class][+e.target.dataset.pname].name = e.target.value.trim(); saveData(); });
  });
  document.querySelectorAll('[data-pstart]').forEach(inp => {
    inp.addEventListener('change', e => { data.periods[session.class][+e.target.dataset.pstart].start = e.target.value; saveData(); });
  });
  document.querySelectorAll('[data-pend]').forEach(inp => {
    inp.addEventListener('change', e => { data.periods[session.class][+e.target.dataset.pend].end = e.target.value; saveData(); });
  });
  document.querySelectorAll('[data-pdel]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.pdel;
      if (!confirm('Удалить период "' + data.periods[session.class][i].name + '"?')) return;
      data.periods[session.class].splice(i, 1);
      if (data.currentPeriod[session.class] >= data.periods[session.class].length) data.currentPeriod[session.class] = data.periods[session.class].length - 1;
      saveData(); renderTeacher();
    });
  });
  document.getElementById('addPeriodBtn')?.addEventListener('click', () => {
    const list = data.periods[session.class];
    const last = list[list.length - 1];
    list.push({ name: 'Новый период', start: last?.end || todayISO(), end: last?.end || todayISO() });
    saveData(); renderTeacher();
  });
}

    '</div>';

  document.getElementById('logoutBtn').addEventListener('click', () => {
    session = null; saveSession(); renderApp();
  });

  document.getElementById('changePinBtn')?.addEventListener('click', () => {
    const st = data.students.find(s => s.class === session.class && s.name === session.name);
    if (!st) return toast('Ошибка', true);
    const oldPin = prompt('Текущий PIN:');
    if (oldPin === null) return;
    if (simpleHash(oldPin) !== st.pin) return toast('Неверный PIN', true);
    const newPin = prompt('Новый PIN (минимум 4 цифры):');
    if (newPin === null) return;
    if (!/^\d{4,}$/.test(newPin)) return toast('Минимум 4 цифры', true);
    const confirmPin = prompt('Повторите новый PIN:');
    if (confirmPin !== newPin) return toast('Не совпадает', true);
    st.pin = simpleHash(newPin);

    toast('PIN изменён');

    const date = document.getElementById('saDate').value;
    const subject = document.getElementById('saSubject').value;
    const reason = document.getElementById('saReason').value;

  app.innerHTML =
    topbarHTML('Кабинет родителя', '') +

      '<div class="stats">' +
        '<div class="stat"><div class="num">' + total + '</div><div class="lbl">Всего пропусков</div></div>' +

        '</div>' +

        '<div class="print-signature" id="printSignature"></div>' +
      '</div>' +
    '</div>';

  document.getElementById('logoutBtn').addEventListener('click', () => {
    session = null; saveSession(); renderApp();
  });

  document.getElementById('periodSelect')?.addEventListener('change', e => {
    data.currentPeriod[session.class] = parseInt(e.target.value, 10);
    saveData(); renderParent();
  });

  document.getElementById('parentPrintBtn')?.addEventListener('click', () => {
    const period = getCurrentPeriod(cls);
    printJournal(cls, period.name, { studentName: childName });
  });

  // Комментарии к пропускам
  document.querySelectorAll('[data-parent-comment]').forEach(btn => {
    btn.addEventListener('click', () => {
      const abs = data.absences.find(a => a.id === btn.dataset.parentComment);
      if (!abs) return;
      const current = abs.parentComment || '';
      const comment = prompt('Комментарий родителя к пропуску от ' + formatDate(abs.date) + ':\n\n(оставьте пустым, чтобы удалить)', current);
      if (comment === null) return;
      if (comment.trim()) {
        abs.parentComment = comment.trim();
        logAction('upd', 'Родитель ' + childName + ' оставил комментарий к пропуску от ' + formatDate(abs.date));
      } else {
        delete abs.parentComment;
        logAction('upd', 'Родитель ' + childName + ' удалил комментарий к пропуску от ' + formatDate(abs.date));
      }
      saveData();
      toast(comment.trim() ? 'Комментарий сохранён' : 'Комментарий удалён');
      renderParent();
    });
  });

  bindSortHandlers();
}

function renderAllClassesSummary() {
  const rows = CLASSES.map(cls => {
    ensurePeriods(cls);
    const absences = filterByPeriod(data.absences.filter(a => a.class === cls), cls);
    const total = absences.length;
    const good = absences.filter(a => reasonById(a.reason).type === 'good').length;
    const bad = absences.filter(a => reasonById(a.reason).type === 'bad').length;
    const students = data.students.filter(s => s.class === cls).length;
    const teacher = (data.teachers || []).find(t => t.class === cls);
    return { cls, total, good, bad, students, teacher: teacher ? teacher.name : '—' };
  });
  const grandTotal = rows.reduce((s, r) => s + r.total, 0);
  const grandGood = rows.reduce((s, r) => s + r.good, 0);
  const grandBad = rows.reduce((s, r) => s + r.bad, 0);

  const body = rows.map(r =>
    '<tr><td data-label="Класс"><b>' + escapeHtml(r.cls) + '</b></td>' +
    '<td data-label="Кл. рук." style="font-size:13px; color:#64748b;">' + escapeHtml(r.teacher) + '</td>' +
    '<td data-label="Учеников">' + r.students + '</td>' +
    '<td data-label="Всего">' + r.total + '</td>' +
    '<td data-label="Уваж." style="color:#166534;">' + r.good + '</td>' +
    '<td data-label="Неуваж." style="color:#991b1b;">' + r.bad + '</td></tr>'
  ).join('');

  return '<div class="card"><h3>Сводная по всем классам</h3>' +
    '<div class="table-wrap"><table><thead><tr>' +
    '<th>Класс</th><th>Классный руководитель</th><th>Учеников</th><th>Всего</th><th>Уважительных</th><th>Неуважительных</th>' +
    '</tr></thead><tbody>' + body +
    '<tr style="font-weight:700; background:#f1f5f9;"><td colspan="3" data-label="">ИТОГО</td>' +
    '<td data-label="Всего">' + grandTotal + '</td>' +
    '<td data-label="Уваж." style="color:#166534;">' + grandGood + '</td>' +
    '<td data-label="Неуваж." style="color:#991b1b;">' + grandBad + '</td></tr>' +
    '</tbody></table></div></div>';
}

function renderAdminClassStats(selectedClass) {
  ensurePeriods(selectedClass);
  const absences = filterByPeriod(data.absences.filter(a => a.class === selectedClass), selectedClass).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const total = absences.length;
  const good = absences.filter(a => reasonById(a.reason).type === 'good').length;
  const bad = absences.filter(a => reasonById(a.reason).type === 'bad').length;
  const neutral = total - good - bad;
  const uniqueStudents = new Set(absences.map(a => a.studentName)).size;
  const studentsInClass = data.students.filter(s => s.class === selectedClass).length;

  const byStudent = {};
  absences.forEach(a => { byStudent[a.studentName] = (byStudent[a.studentName] || 0) + 1; });
  const topStudents = Object.entries(byStudent).sort((a, b) => b[1] - a[1]).slice(0, 5);

  let topHTML = '';
  if (topStudents.length) {
    const rows = topStudents.map(([name, count], i) => '<tr><td data-label="#">' + (i + 1) + '</td><td data-label="Ученик">' + escapeHtml(name) + '</td><td data-label="Пропусков"><b>' + count + '</b></td></tr>').join('');
    topHTML = '<h4 style="margin:20px 0 10px; font-size:14px; color:#475569;">Топ-5 учеников</h4>' +
      '<div class="table-wrap" style="margin-bottom:20px;"><table>' +
      '<thead><tr><th>#</th><th>Ученик</th><th>Пропусков</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  return '<div class="card">' +
    '<div class="print-header" id="printHeader"></div>' +
    '<div class="journal-header"><h3>Статистика класса</h3>' +
      '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">' +
        '<select id="adminClassSelect" class="period-select">' + optionsHTML(CLASSES, selectedClass) + '</select>' +
        periodSelectorHTML(selectedClass) +
        '<button class="btn btn-secondary btn-sm" id="adminExportBtn">Скачать CSV</button>' +
        '<button class="btn btn-secondary btn-sm" id="adminPrintBtn">🖨 Печать</button>' +
      '</div>' +
    '</div>' +
    '<div class="stats" style="margin-bottom:20px;">' +
      '<div class="stat"><div class="num">' + total + '</div><div class="lbl">Всего</div></div>' +
      '<div class="stat"><div class="num">' + good + '</div><div class="lbl">Уваж.</div></div>' +
      '<div class="stat"><div class="num">' + bad + '</div><div class="lbl">Неуваж.</div></div>' +
      '<div class="stat"><div class="num">' + neutral + '</div><div class="lbl">Прочих</div></div>' +
      '<div class="stat"><div class="num">' + uniqueStudents + '</div><div class="lbl">Учеников</div></div>' +
      '<div class="stat"><div class="num">' + studentsInClass + '</div><div class="lbl">В классе</div></div>' +
    '</div>' +
    topHTML +
    '<h4 style="margin:20px 0 10px; font-size:14px; color:#475569;">Журнал за период</h4>' +
    '<div class="table-wrap">' + renderAbsencesTable(absences, false, false) + '</div>' +
    '<div class="print-signature" id="printSignature"></div>' +
    '</div>';
}

function renderHistoryLog() {
  const log = (data.log || []).slice().sort((a, b) => (b.time || '').localeCompare(a.time || ''));
  const q = (uiState.logFilter || '').toLowerCase();
  const filtered = q ? log.filter(l => (l.user || '').toLowerCase().includes(q) || (l.details || '').toLowerCase().includes(q)) : log;

  const rows = filtered.slice(0, 100).map(l => {
    let actionClass = 'upd';
    if (l.action === 'add') actionClass = 'add';
    else if (l.action === 'del') actionClass = 'del';
    else if (l.action === 'login') actionClass = 'login';
    return '<tr class="log-row">' +
      '<td data-label="Время">' + escapeHtml(formatDateTime(l.time)) + '</td>' +
      '<td data-label="Кто">' + escapeHtml(l.user) + '</td>' +
      '<td data-label="Роль">' + escapeHtml(l.role) + '</td>' +
      '<td data-label="Действие"><span class="log-action ' + actionClass + '">' + escapeHtml(l.action) + '</span></td>' +
      '<td data-label="Детали">' + escapeHtml(l.details || '') + '</td>' +
    '</tr>';
  }).join('');

  return '<div class="card">' +
    '<div class="journal-header"><h3>История изменений (только админ)</h3>' +
      '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">' +
        '<input type="text" id="logSearch" placeholder="🔍 Поиск..." value="' + escapeHtml(uiState.logFilter) + '" style="min-width:200px;">' +
        '<button class="btn btn-secondary btn-sm" id="clearLogBtn">Очистить историю</button>' +
      '</div>' +
    '</div>' +
    '<p style="font-size:12px; color:#64748b; margin:0 0 12px;">Всего записей: ' + log.length + ' (показано последние 100)</p>' +
    (filtered.length
      ? '<div class="table-wrap"><table><thead><tr><th>Время</th><th>Пользователь</th><th>Роль</th><th>Действие</th><th>Детали</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty">Записей нет</div>') +
    '</div>';
}

function renderAdmin() {
  if (!data.teachers) data.teachers = [];
  const teachers = [...data.teachers].sort((a, b) => a.name.localeCompare(b.name, 'ru'));

  let teachersCardHTML = '';
  if (teachers.length === 0) teachersCardHTML = '<div class="empty">Пока нет зарегистрированных учителей</div>';
  else {
    const rows = teachers.map(t =>
      '<tr><td data-label="ФИО"><b>' + escapeHtml(t.name) + '</b></td>' +
      '<td data-label="Класс"><select data-tclass="' + escapeHtml(t.name) + '" style="padding:6px 10px;">' + optionsHTML(CLASSES, t.class) + '</select></td>' +
      '<td data-label="PIN"><button class="btn btn-secondary btn-sm" data-treset="' + escapeHtml(t.name) + '">Сбросить на 1234</button></td>' +
      '<td><button class="btn btn-danger btn-sm" data-tdel="' + escapeHtml(t.name) + '">Удалить</button></td></tr>'
    ).join('');
    teachersCardHTML = '<div class="table-wrap"><table><thead><tr><th>ФИО</th><th>Класс</th><th>PIN</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  const app = document.getElementById('app');
  app.innerHTML =
    topbarHTML('Панель администратора', '') +

    '<div class="container">' +
      '<div class="card"><h3>Зарегистрировать учителя</h3><form id="addTeacherForm">' +
        '<div class="form-grid">' +
          '<div><label for="newTeacherName">ФИО учителя</label><input type="text" id="newTeacherName" placeholder="Иванова Ирина Ивановна" required></div>' +
          '<div><label for="newTeacherClass">Класс</label><select id="newTeacherClass" required>' + optionsHTML(CLASSES, CLASSES[0]) + '</select></div>' +
          '<div><label for="newTeacherPin">PIN (пусто = 1234)</label><input type="text" id="newTeacherPin" placeholder="1234" maxlength="8"></div>' +
        '</div>' +
        '<button type="submit" class="btn" style="margin-top:16px;">Добавить учителя</button>' +
      '</form></div>' +

      '<div class="card"><h3>Учителя (' + teachers.length + ')</h3>' + teachersCardHTML + '</div>' +

      renderAllClassesSummary() +
      renderAdminClassStats(uiState.adminSelectedClass || CLASSES[0]) +
      renderHistoryLog() +
    '</div>';

  document.getElementById('logoutBtn').addEventListener('click', () => {
    logAction('login', 'Администратор вышел');
    session = null; saveSession(); renderApp();
  });

  document.getElementById('addTeacherForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('newTeacherName').value.trim();
    const cls = document.getElementById('newTeacherClass').value;
    const pinRaw = document.getElementById('newTeacherPin').value.trim();
    if (!name) return toast('Введите ФИО', true);
    if (findTeacher(name)) return toast('Учитель с таким ФИО уже есть', true);
    const pin = pinRaw || '1234';
    if (!/^\d{4,8}$/.test(pin)) return toast('PIN 4–8 цифр', true);
    data.teachers.push({ name, class: cls, pin: simpleHash(pin), createdAt: new Date().toISOString() });
    logAction('add', 'Зарегистрирован учитель ' + name + ' (класс ' + cls + ')');
    saveData();
    toast('Учитель ' + name + ' добавлен');
    renderAdmin();
  });

  document.querySelectorAll('[data-tclass]').forEach(sel => {
    sel.addEventListener('change', e => {
      const t = findTeacher(sel.dataset.tclass);
      if (!t) return;
      const old = t.class;
      t.class = e.target.value;
      logAction('upd', 'Класс учителя ' + t.name + ' изменён с ' + old + ' на ' + t.class);
      saveData();
      toast('Класс изменён на ' + e.target.value);
    });
  });

  document.querySelectorAll('[data-treset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.treset;
      const t = findTeacher(name);
      if (!t) return;
      if (!confirm('Сбросить PIN "' + name + '"?')) return;
      t.pin = simpleHash('1234');
      logAction('upd', 'Сброшен PIN учителя ' + name);
      saveData();
      toast('PIN сброшен на 1234');
    });
  });

  document.querySelectorAll('[data-tdel]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.tdel;
      if (!confirm('Удалить учителя "' + name + '"?')) return;
      data.teachers = data.teachers.filter(t => t.name !== name);
      logAction('del', 'Удалён учитель ' + name);
      saveData();
      toast('Учитель удалён');
      renderAdmin();
    });
  });

  document.getElementById('adminClassSelect')?.addEventListener('change', e => {
    uiState.adminSelectedClass = e.target.value;
    renderAdmin();
  });

  document.getElementById('periodSelect')?.addEventListener('change', e => {
    const cls = uiState.adminSelectedClass || CLASSES[0];
    data.currentPeriod[cls] = parseInt(e.target.value, 10);
    saveData(); renderAdmin();
  });

  document.getElementById('adminExportBtn')?.addEventListener('click', () => {
    const cls = uiState.adminSelectedClass || CLASSES[0];
    ensurePeriods(cls);
    const period = getCurrentPeriod(cls);
    const rows = [['Дата', 'ФИО', 'Класс', 'Предмет', 'Причина', 'Примечание']];
    filterByPeriod(data.absences.filter(a => a.class === cls), cls).forEach(a => {
      rows.push([a.date, a.studentName, a.class, a.subject, reasonById(a.reason).name, a.note || '']);
    });
    const csv = '\uFEFF' + rows.map(r => r.join(';')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'пропуски_' + cls + '_' + period.name + '.csv';
    link.click();
    toast('Файл скачан');
  });

  document.getElementById('adminPrintBtn')?.addEventListener('click', () => {
    const cls = uiState.adminSelectedClass || CLASSES[0];
    const period = getCurrentPeriod(cls);
    printJournal(cls, period.name);
  });

  document.getElementById('logSearch')?.addEventListener('input', e => {
    uiState.logFilter = e.target.value;
    clearTimeout(window._logTimer);
    window._logTimer = setTimeout(() => {
      const input = document.getElementById('logSearch');
      const pos = input ? input.selectionStart : 0;
      renderAdmin();
      const newInput = document.getElementById('logSearch');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(pos, pos); }
    }, 300);
  });

  document.getElementById('clearLogBtn')?.addEventListener('click', () => {
    if (!confirm('Очистить всю историю изменений?')) return;
    data.log = [];
    saveData();
    toast('История очищена');
    renderAdmin();
  });

  bindSortHandlers();
  bindBell();
}

/* ============================================================
   СТАРТ
   ============================================================ */
(async function startApp() {
  await new Promise(resolve => {
    const start = Date.now();
    const check = () => {
      if (window.firebaseDB !== undefined) return resolve();
      if (Date.now() - start > 3000) return resolve();
      setTimeout(check, 50);
    };
    check();
  });

  await initFirebaseSync();
  firebaseReady = true;
  updateStatusBadge();

  session = loadSession();
  renderApp();
})();
</script>
</body>
</html>
