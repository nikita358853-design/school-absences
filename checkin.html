<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Отметка посещаемости</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100vh;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(160deg,#eef3fb 0%,#e0e8f8 50%,#d6e2f7 100%);
  color:#0b1229;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  min-height:100vh;
  min-height:100dvh;
}
.card{
  background:#fff;
  border-radius:24px;
  padding:32px 24px 28px;
  width:100%;
  max-width:420px;
  box-shadow:0 20px 60px rgba(30,50,100,.18), 0 4px 12px rgba(30,50,100,.08);
  text-align:center;
  position:relative;
  animation:cardIn .4s cubic-bezier(.2,.9,.3,1.2);
  border:1px solid rgba(255,255,255,.6);
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(20px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.type-tag{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  background:#eef2ff;
  color:#4f46e5;
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:16px;
}
.type-tag.entrance{background:#dbeafe;color:#1e40af;}
.type-tag.classroom{background:#f3e8ff;color:#6d28d9;}
.type-tag.error{background:#fee2e2;color:#991b1b;}
h1{
  margin:0 0 6px;
  font-size:26px;
  font-weight:800;
  letter-spacing:-.025em;
  color:#0b1229;
}
.sub{
  color:#6b7490;
  font-size:14px;
  margin:0 0 24px;
  line-height:1.5;
}
.clock{
  font-size:52px;
  font-weight:800;
  letter-spacing:-.04em;
  background:linear-gradient(135deg,#4f46e5,#06b6d4);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:6px;
  line-height:1;
}
input[type="password"]{
  width:100%;
  padding:16px;
  border:1.5px solid #e8ebf3;
  border-radius:14px;
  font-size:22px;
  text-align:center;
  letter-spacing:10px;
  font-family:'Courier New',monospace;
  font-weight:500;
  color:#0b1229;
  background:#fbfcff;
  margin-bottom:14px;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{
  outline:none;
  border-color:#4f46e5;
  box-shadow:0 0 0 4px rgba(79,70,229,.12);
}
button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#4f46e5 0%,#6366f1 50%,#06b6d4 100%);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
  letter-spacing:-.01em;
  box-shadow:0 8px 24px rgba(79,70,229,.3);
  transition:transform .15s,box-shadow .15s;
}
button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(79,70,229,.4);}
button:active{transform:translateY(0);}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.result{
  padding:16px;
  border-radius:14px;
  margin-top:16px;
  font-size:14px;
  font-weight:600;
  display:none;
  line-height:1.5;
}
.result.ok{display:block;background:#d1fae5;color:#065f46;border:1px solid #a7f3d0;}
.result.err{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;}
.result.warn{display:block;background:#fef3c7;color:#92400e;border:1px solid #fde68a;}
.gps{
  font-size:11px;
  color:#9aa3bd;
  margin-top:14px;
  min-height:16px;
  line-height:1.4;
}
.success-screen{
  display:none;
  text-align:center;
  padding:20px 0;
}
.success-screen.active{
  display:block;
  animation:successIn .5s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes successIn{
  from{opacity:0;transform:scale(.9);}
  to{opacity:1;transform:scale(1);}
}
.success-icon{
  width:100px;
  height:100px;
  border-radius:50%;
  background:linear-gradient(135deg,#10b981,#34d399);
  color:#fff;
  font-size:56px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 22px;
  box-shadow:0 16px 40px rgba(16,185,129,.4);
  animation:checkPop .6s cubic-bezier(.2,.9,.3,1.6) .1s both;
}
@keyframes checkPop{
  0%{transform:scale(0) rotate(-180deg);}
  60%{transform:scale(1.15) rotate(10deg);}
  100%{transform:scale(1) rotate(0);}
}
.success-title{
  font-size:24px;
  font-weight:800;
  color:#065f46;
  margin-bottom:8px;
  letter-spacing:-.02em;
}
.success-room{
  font-size:18px;
  font-weight:700;
  color:#0b1229;
  margin-bottom:4px;
}
.success-subject{
  font-size:15px;
  color:#6b7490;
  margin-bottom:20px;
  font-weight:500;
}
.success-time{
  display:inline-block;
  padding:10px 22px;
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  border-radius:12px;
  color:#065f46;
  font-size:20px;
  font-weight:800;
  letter-spacing:-.01em;
  font-family:'Courier New',monospace;
}
.success-meta{
  font-size:12px;
  color:#9aa3bd;
  margin-top:20px;
  line-height:1.5;
}
.success-meta.warn{color:#92400e;}
@media(max-width:380px){
  .clock{font-size:44px;}
  h1{font-size:22px;}
  .success-icon{width:80px;height:80px;font-size:44px;}
  .success-title{font-size:20px;}
}
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div id="pinStep">
    <div class="clock" id="clock">--:--</div>
    <div id="typeTag" class="type-tag">Загрузка…</div>
    <h1 id="title">Отметка</h1>
    <p class="sub" id="subtitle">Введите PIN-код</p>
    <input type="password" id="pin" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <button id="submitBtn" disabled>Отметиться</button>
    <div class="gps" id="gpsInfo">📍 Определяем местоположение…</div>
    <div class="result" id="result"></div>
  </div>
  <div id="successStep" class="success-screen">
    <div class="success-icon">✓</div>
    <div class="success-title" id="successTitle">Вы в школе</div>
    <div class="success-room" id="successRoom"></div>
    <div class="success-subject" id="successSubject"></div>
    <div class="success-time" id="successTime"></div>
    <div class="success-meta" id="successMeta"></div>
  </div>
</div>
<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const STORAGE_KEY = 'school_absence_v2';
let geo = null;
let checkinType = null;
let classroomNumber = null;
let classroomSubjects = [];
let resolvedSubject = null;

function tick(){
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 1000);

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    pos => { geo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
             document.getElementById('gpsInfo').textContent = '📍 Геолокация получена'; },
    () =>  { document.getElementById('gpsInfo').textContent = '⚠️ Геолокация недоступна — отметка с флагом'; },
    { timeout: 5000, enableHighAccuracy: true }
  );
} else {
  document.getElementById('gpsInfo').textContent = '⚠️ GPS не поддерживается';
}

function loadLocal(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function todayISO(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function inTimeWindow(start, end){
  const d = new Date();
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  const cur = d.getHours() * 60 + d.getMinutes();
  return cur >= sh * 60 + sm && cur <= eh * 60 + em;
}
function showResult(type, text){
  const el = document.getElementById('result');
  el.className = 'result ' + type;
  el.textContent = text;
}
function simpleHash(str){
  let h = 0;
  for(let i = 0; i < str.length; i++){ h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
  return 'h' + Math.abs(h).toString(36);
}
async function verifyPin(input, storedHash){
  if(!storedHash) return false;
  if(storedHash.startsWith('pbkdf2$')){
    const parts = storedHash.split('$');
    if(parts.length !== 3) return false;
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(input), {name:'PBKDF2'}, false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      {name:'PBKDF2', salt: enc.encode(parts[1]), iterations:100000, hash:'SHA-256'}, km, 256);
    const computed = 'pbkdf2$' + parts[1] + '$' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2,'0')).join('');
    return computed === storedHash;
  }
  return simpleHash(input) === storedHash;
}

(function determineType(){
  const data = loadLocal();
  if(!TOKEN){
    document.getElementById('typeTag').textContent = '⚠️ Ошибка';
    document.getElementById('typeTag').className = 'type-tag error';
    document.getElementById('title').textContent = 'Нет токена';
    document.getElementById('subtitle').textContent = 'Отсканируйте QR-код на двери';
    return;
  }
  if(TOKEN === data.schoolToken){
    checkinType = 'entrance';
    document.getElementById('typeTag').textContent = '🚪 Вход в школу';
    document.getElementById('typeTag').className = 'type-tag entrance';
    document.getElementById('title').textContent = 'Вы в школе';
    document.getElementById('submitBtn').disabled = false;
    return;
  }
  for(const [room, info] of Object.entries(data.classrooms || {})){
    if(info.token === TOKEN){
      checkinType = 'classroom';
      classroomNumber = room;
      classroomSubjects = info.subjects || [];
      document.getElementById('typeTag').textContent = '📚 Кабинет ' + room;
      document.getElementById('typeTag').className = 'type-tag classroom';
      document.getElementById('title').textContent = 'Кабинет ' + room;
      document.getElementById('subtitle').textContent = classroomSubjects.length
        ? classroomSubjects.join(' · ')
        : 'Введите PIN для отметки';
      document.getElementById('submitBtn').disabled = false;
      return;
    }
  }
  document.getElementById('typeTag').textContent = '⚠️ Неизвестный QR';
  document.getElementById('typeTag').className = 'type-tag error';
  document.getElementById('title').textContent = 'QR не распознан';
  document.getElementById('subtitle').textContent = 'Код устарел или не принадлежит школе';
})();

function resolveSubjectForRoom(data, student, room, atTime){
  try{
    const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    const dayKey = days[new Date().getDay()];
    if(dayKey === 'Вс') return null;
    const classSchedule = (data.schedules || {})[student.class];
    if(!classSchedule) return null;
    const dayLessons = classSchedule[dayKey] || [];
    if(!dayLessons.length) return null;
    const now = new Date();
    const curMin = now.getHours() * 60 + now.getMinutes();
    const slots = [
      { start: 8*60+30, end: 9*60+15 },
      { start: 9*60+25, end: 10*60+10 },
      { start: 10*60+30, end: 11*60+15 },
      { start: 11*60+35, end: 12*60+20 },
      { start: 12*60+40, end: 13*60+25 },
      { start: 13*60+45, end: 14*60+30 },
      { start: 14*60+40, end: 15*60+25 }
    ];
    for(let i = 0; i < dayLessons.length && i < slots.length; i++){
      const slot = slots[i];
      if(curMin >= slot.start - 10 && curMin <= slot.end){
        const subject = dayLessons[i];
        const roomInfo = data.classrooms[room];
        if(roomInfo && roomInfo.subjects && roomInfo.subjects.length){
          if(roomInfo.subjects.includes(subject)) return subject;
          return { subject, mismatch: true };
        }
        return subject;
      }
    }
    return null;
  }catch(e){ return null; }
}

function showSuccess(data){
  document.getElementById('pinStep').style.display = 'none';
  const step = document.getElementById('successStep');
  step.classList.add('active');
  if(checkinType === 'entrance'){
    document.getElementById('successTitle').textContent = 'Вы вошли в школу';
    document.getElementById('successRoom').textContent = '';
    document.getElementById('successSubject').textContent = '';
  } else {
    document.getElementById('successTitle').textContent = 'Вы в кабинете';
    document.getElementById('successRoom').textContent = 'Кабинет ' + classroomNumber;
    document.getElementById('successSubject').textContent = resolvedSubject
      ? 'Предмет: ' + resolvedSubject
      : (classroomSubjects.length ? classroomSubjects.join(' · ') : '');
  }
  document.getElementById('successTime').textContent = data.time;
  const meta = document.getElementById('successMeta');
  if(!data.gps){
    meta.textContent = '⚠️ Отметка без геолокации — учитель увидит флаг';
    meta.className = 'success-meta warn';
  } else {
    meta.textContent = '📍 Местоположение подтверждено';
    meta.className = 'success-meta';
  }
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const pin = (document.getElementById('pin').value || '').trim();
  if(!pin) return showResult('err', 'Введите PIN');
  if(!checkinType) return showResult('err', 'Ошибка QR');
  const data = loadLocal();
  const today = todayISO();

  if(checkinType === 'entrance'){
    if(!inTimeWindow(data.checkinWindow.entranceStart, data.checkinWindow.entranceEnd)){
      return showResult('warn',
        'Окно входа ' + data.checkinWindow.entranceStart + '–' +
        data.checkinWindow.entranceEnd + ' закрыто');
    }
  } else {
    const now = new Date();
    const curMin = now.getHours() * 60 + now.getMinutes();
    if(curMin < 7*60+30 || curMin > 19*60){
      return showResult('warn', 'Сейчас не время уроков');
    }
  }

  let student = null;
  for(const s of (data.students || [])){
    if(await verifyPin(pin, s.pin)){ student = s; break; }
  }
  if(!student) return showResult('err', 'PIN не найден');

  data.checkins[today] = data.checkins[today] || {};
  const rec = data.checkins[today][student.id] || {};

  if(checkinType === 'entrance'){
    if(rec.entrance){
      return showResult('warn', 'Вы уже отметились на входе в ' + rec.entrance.time);
    }
    rec.entrance = { time: nowHM(), gps: !!geo };
    data.checkins[today][student.id] = rec;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    syncFirebase(data.checkins);
    showSuccess({ time: rec.entrance.time, gps: rec.entrance.gps });
    return;
  }

  if(!rec.classrooms) rec.classrooms = [];
  const nowMs = Date.now();
  const recent = rec.classrooms.find(c => {
    if(c.room !== classroomNumber) return false;
    const [h, m] = c.time.split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    return nowMs - d.getTime() < 5 * 60 * 1000;
  });
  if(recent){
    return showResult('warn', 'Вы уже отметились в кабинете ' + classroomNumber + ' в ' + recent.time);
  }

  const resolved = resolveSubjectForRoom(data, student, classroomNumber, nowHM());
  if(resolved && resolved.mismatch){
    resolvedSubject = resolved.subject;
    showResult('warn',
      'Сейчас у вас ' + resolved.subject + ', но это кабинет ' +
      classroomNumber + '. Проверьте расписание.');
  } else if(resolved){
    resolvedSubject = resolved;
  } else {
    resolvedSubject = classroomSubjects[0] || '—';
  }

  const entry = {
    time: nowHM(),
    room: classroomNumber,
    subject: resolvedSubject,
    gps: !!geo
  };
  rec.classrooms.push(entry);
  data.checkins[today][student.id] = rec;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  syncFirebase(data.checkins);
  showSuccess({ time: entry.time, gps: entry.gps });
});

function syncFirebase(checkins){
  if(!window.firebaseDB) return;
  try{
    const { db, ref, set } = window.firebaseDB;
    set(ref(db, 'schoolData/main/checkins'), checkins).catch(()=>{});
  }catch(e){}
}
</script>
</body>
</html>
